# Stratt task runner — charter §3 ("Task runner: `task`").
#
# Pre-Phase-0: there is no product code yet, so every language branch below is
# guarded on its manifest (go.mod / package.json / pyproject.toml) and no-ops
# cleanly until that code lands. The targets are the stable contract CI and the
# devcontainer call today; they grow bodies, not names, as the spine is built.
#
# The evergreen floors are the N-1 gate (charter §1.7). Bumping them is the
# "quarterly upgrade train" checklist item — edit the vars, not the logic.

version: "3"

vars:
  GO_MIN: "1.24" # N-1 of the Go 1.25 line
  NODE_MIN: "22" # previous LTS (container ships current LTS 24)
  PYTHON_MIN: "3.13" # N-1 of 3.14 (pods / plugin SDK only — charter §3)
  TASK_MIN: "3.0"
  # uv RUNS the pinned Python gate tools below (uvx ruff@…, uvx mypy@…, uv run pytest),
  # so it is a gate prerequisite, not an optional convenience. It is checked by
  # `task evergreen` because it was NOT, once: the Taskfile moved to `uvx <tool>@<ver>`
  # while CI installed only go/node/python, and the gate failed deep inside fmt:check
  # with a bare `"uvx": executable file not found` instead of naming the missing tool.
  UV_MIN: "0.5"
  # Sovereign plugin port codegen (ADR-0046 Phase A). Pinned like the other
  # `go run <tool>@<ver>` tools; bump on the quarterly upgrade train.
  BUF_VER: "1.71.0"
  PROTOC_GEN_GO_VER: "1.36.11" # tracks google.golang.org/protobuf (pinned UP by k8s.io — see core/go.mod)
  PROTOC_GEN_GO_GRPC_VER: "1.5.1"
  # Cluster tooling — pinned + installed to repo-local .bin/ so the dev stack
  # stands up with ZERO manual installs beyond go+task (quarterly upgrade train).
  KIND_VER: "0.32.0"
  # Helm 4 line (ADR-0092 / dependency-scout): Helm 3 bug-fix support lapsed
  # 2026-07-08 (security EOL 2026-11-11), so the pin moved off the stale 3.16.4.
  # N-1 v3.21.3 must keep working; the plugin image pins the same v4.2.3.
  # sha256 verified against get.helm.sh (§7.3 — verify, don't trust a bare curl).
  HELM_VER: "4.2.3"
  HELM_SHA256_AMD64: "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c"
  HELM_SHA256_ARM64: "21abd9354d39b2cd79a8d76be6912cd137a983cbf997193503fb8a6a6e2f2785"
  KUBECTL_VER: "1.34.1" # within skew of the kind node (K8s N-2, §1.7)
  # OpenTofu — charter §3 (OpenTofu over Terraform) and the network builder's toolchain
  # (ADR-0112/0145). Pinned on the CURRENT 1.12 line; N-1 is 1.11.x, so the module's
  # `required_version = ">= 1.8.0"` keeps both working (§1.7). sha256 from the release's
  # own SHA256SUMS (§7.3 — verify, don't trust a bare curl), like helm above.
  #
  # It is a GATE prerequisite, not a convenience: `task tofu:validate` runs in `task ci`,
  # and the committed `.terraform.lock.hcl` (ADR-0112 D4's binding condition) can only be
  # regenerated by a real tofu. The module shipped for months with neither, because no
  # tofu binary existed in this container to notice.
  TOFU_VER: "1.12.5"
  TOFU_SHA256_AMD64: "dade9650e6b74fc7a8b986bd8717497d32f9e09cf82e479afef4977fa3085536"
  TOFU_SHA256_ARM64: "528f4eea63452bbddb30fa4f1780b57fac8d7676f9dda0f772e847bb62c1260a"
  # Python gate tools (ADR-0117 D3). Run via `uvx <tool>@<ver>` — project-independent,
  # so they work regardless of UV_PROJECT — and PINNED: a gate whose whole thesis is
  # "unpinned things resolve differently on different days" must not itself float.
  RUFF_VER: "0.14.5"
  MYPY_VER: "1.18.2"
  PYYAML_VER: "6.0.3"
  PYTEST_VER: "9.1.1"
  # Go build/test parallelism. Deliberately BOUNDED rather than left at the Go
  # default of GOMAXPROCS: the gates loop over ~29 workspace modules, and an
  # unbounded `go vet ./...` / `go test ./...` fans out to every core, so on a
  # many-core box you get dozens of concurrent type-checkers over dependency trees
  # the size of client-go, all writing one build cache. That pins the machine at
  # 100% and — observed repeatedly on this container (overlayfs on WSL2) — produced
  # `internal compiler error: unexpected decoding error: EOF`: the compiler reading
  # a build-cache entry that another writer had left truncated. Type-checking has
  # sharply diminishing returns past ~8 workers, so this costs little wall clock on
  # a warm cache and makes the gate reproducible instead of a coin flip.
  #
  # It governs IMAGE builds too, threaded in as a --build-arg to every Dockerfile that
  # compiles Go (each sets GOFLAGS=-p from it). Bounding only the host gates was not
  # enough, and the gap was worse than the original symptom: a single
  # `go build ./cmd/strattd` inside a builder stage still fans out to every core over the
  # same overlayfs, and on a COLD BuildKit cache — the exact state a `docker builder
  # prune` leaves behind — the whole client-go graph compiles at once. Observed: `export
  # data desync` in k8s.io/client-go/informers, and then the host itself going down under
  # the memory load. One knob for both, so the two cannot drift apart.
  # Override on a beefy CI runner: `GO_PARALLEL=16 task ci`.
  GO_PARALLEL: '{{.GO_PARALLEL | default "8"}}'
  BIN: "{{.ROOT_DIR}}/.bin"
  HELM: "{{.ROOT_DIR}}/.bin/helm"
  KUBECTL: "{{.ROOT_DIR}}/.bin/kubectl"
  TOFU: "{{.ROOT_DIR}}/.bin/tofu"
  KIND_CLUSTER: "stratt-dev"
  KIND_CONTEXT: "kind-stratt-dev"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:devcontainer:
    desc: Idempotent devcontainer bootstrap — verify toolchain, enforce evergreen
    silent: true
    cmds:
      - task: versions
      - task: evergreen

  setup:gh-auth:
    # Kept OUT of setup:devcontainer (which is host-reproducible + side-effect-free): this appends to
    # the shell rc files, so it is container-only and invoked explicitly from postCreateCommand.sh.
    desc: Container-only — let gh borrow the VSCode-forwarded git credential (no stored token)
    silent: true
    cmds:
      - bash {{.ROOT_DIR}}/.devcontainer/setup-gh-auth.sh

  versions:
    desc: Print installed toolchain versions
    silent: true
    cmds:
      - |
        echo "Stratt toolchain:"
        printf '  go      %s\n' "$(go version 2>/dev/null | awk '{print $3}' | sed 's/^go//' || echo MISSING)"
        printf '  node    %s\n' "$(node --version 2>/dev/null | sed 's/^v//' || echo MISSING)"
        printf '  python  %s\n' "$(python3 --version 2>/dev/null | awk '{print $2}' || echo MISSING)"
        printf '  uv      %s\n' "$(uv --version 2>/dev/null | awk '{print $2}' || echo MISSING)"
        printf '  task    %s\n' "$(task --version 2>/dev/null | sed 's/^v//' || echo MISSING)"

  evergreen:
    desc: Fail the build if any toolchain dep is below its N-1 floor (charter §1.7)
    silent: true
    cmds:
      - |
        set -eu
        fail=0
        check() {
          name="$1"; min="$2"; cur="$3"
          if [ -z "$cur" ]; then
            echo "  ✗ $name: not found (need >= $min)"; fail=1; return
          fi
          lowest=$(printf '%s\n%s\n' "$min" "$cur" | sort -V | head -n1)
          if [ "$lowest" = "$min" ]; then
            echo "  ✓ $name $cur (>= $min)"
          else
            echo "  ✗ $name $cur is below the N-1 floor $min"; fail=1
          fi
        }
        check go     "{{.GO_MIN}}"     "$(go version 2>/dev/null | awk '{print $3}' | sed 's/^go//')"
        check node   "{{.NODE_MIN}}"   "$(node --version 2>/dev/null | sed 's/^v//' | cut -d. -f1)"
        check python "{{.PYTHON_MIN}}" "$(python3 --version 2>/dev/null | awk '{print $2}')"
        check task   "{{.TASK_MIN}}"   "$(task --version 2>/dev/null | sed 's/^v//')"
        check uv     "{{.UV_MIN}}"     "$(uv --version 2>/dev/null | awk '{print $2}')"
        if [ "$fail" != 0 ]; then
          echo "Evergreen gate FAILED (charter §1.7 — stay >= N-1)."; exit 1
        fi
        echo "Evergreen gate passed."

  # Go modules live in the go.work workspace (ADR-0005), not at the repo
  # root; every Go branch below iterates the workspace members.
  fmt:
    desc: Format Go, web, and Python sources (skips languages with no files yet)
    silent: true
    cmds:
      - |
        set -eu
        if [ -f go.work ]; then
          files=$(git ls-files '*.go' | grep -v '\.gen\.go$' || true)
          [ -z "$files" ] || { echo '→ gofmt'; gofmt -w $files; }
        fi
        if [ -f package.json ]; then echo '→ prettier'; npx --yes prettier --write . >/dev/null; fi
        if [ -f pyproject.toml ]; then echo '→ ruff format'; uvx ruff@{{.RUFF_VER}} format .; fi
        echo "fmt done."

  fmt:check:
    desc: Verify formatting without modifying files (CI gate)
    silent: true
    cmds:
      - |
        set -eu
        rc=0
        if [ -f go.work ]; then
          files=$(git ls-files '*.go' | grep -v '\.gen\.go$' || true)
          if [ -n "$files" ]; then
            out=$(gofmt -l $files); [ -z "$out" ] || { echo "gofmt needs: $out"; rc=1; }
          fi
        fi
        if [ -f package.json ]; then npx --yes prettier --check . || rc=1; fi
        if [ -f pyproject.toml ]; then uvx ruff@{{.RUFF_VER}} format --check . || rc=1; fi
        if [ "$rc" != 0 ]; then exit 1; fi
        echo "fmt:check clean."

  lint:
    desc: Lint Go, web, and Python (skips languages with no files yet)
    silent: true
    cmds:
      - |
        set -eu
        if [ -f go.work ]; then
          for mod in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            echo "→ go vet ($mod)"; (cd "$mod" && go vet -p={{.GO_PARALLEL}} ./...)
          done
        fi
        if [ -f package.json ]; then echo '→ eslint'; npx --yes eslint .; fi
        if [ -f pyproject.toml ]; then
          echo '→ ruff check'; uvx ruff@{{.RUFF_VER}} check .
          # mypy --strict too: .claude/rules/backend-python.md demands typed + clean, and
          # ee/content.py is a supply-chain gate — the last place to accept loose typing.
          echo '→ mypy'; uvx --with pyyaml=={{.PYYAML_VER}} --with types-PyYAML --with pytest=={{.PYTEST_VER}} mypy@{{.MYPY_VER}} --strict ee/
        fi
        echo "lint done."

  test:
    desc: Run tests across all workspace modules
    silent: true
    cmds:
      - |
        set -eu
        ran=0
        if [ -f go.work ]; then
          for mod in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            echo "→ go test ($mod)"; (cd "$mod" && go test -p={{.GO_PARALLEL}} ./...)
          done
          ran=1
        fi
        if [ -f pyproject.toml ]; then
          echo '→ pytest'
          # Pinned deps, project-independent (UV_PROJECT may point elsewhere). These cover
          # the EE content pin gate (ADR-0117 D3) — supply-chain logic, so it gets tests.
          uv run --quiet --with pyyaml=={{.PYYAML_VER}} --with pytest=={{.PYTEST_VER}} pytest -q
          ran=1
        fi
        if [ "$ran" = 0 ]; then echo "No packages yet — nothing to test."; fi

  plugins:standalone:
    desc: Build every plugin module OUTSIDE the go workspace (GOWORK=off) — the way its container image builds it
    silent: true
    cmds:
      - |
        set -eu
        # A plugin is a SEPARATE Go module and its image builds it with GOWORK=off
        # (see ee/Dockerfile). Inside the workspace, go.work satisfies imports from
        # sibling modules, so an INCOMPLETE go.sum stays invisible here and fails
        # only at docker build — far from the change that caused it. This gate moves
        # that failure left. It has bitten ansible, vcenter, awsec2 and (silently)
        # ten more; plugins/script is baked into the EE image, so its breakage would
        # have taken the execution environment down with it.
        #
        # `go vet`, not `go build`: build ignores _test.go, so a TEST-only dependency
        # missing from go.sum stayed invisible to this gate — and "a plugin can be
        # TESTED alone" is the property ADR-0137 D6 exists for, not just "it compiles
        # alone". vet type-checks the test files too, which closes that hole without
        # paying to run every suite twice (`task test` already runs them).
        failed=""
        for mod in $(find plugins -maxdepth 2 -name go.mod | sort); do
          dir=$(dirname "$mod")
          if (cd "$dir" && GOWORK=off go vet ./... >/dev/null 2>&1); then
            echo "  ✓ $dir"
          else
            echo "  ✗ $dir — does not build/vet standalone:"
            (cd "$dir" && GOWORK=off go vet ./... 2>&1 | head -5 | sed 's/^/      /') || true
            failed="$failed $dir"
          fi
        done
        if [ -n "$failed" ]; then
          echo ""
          echo "✗ plugins:standalone — these modules build only inside the workspace:$failed"
          echo "  Fix each with:  (cd <module> && GOWORK=off go mod tidy)"
          exit 1
        fi
        echo "✓ plugins:standalone — every plugin module builds and vets outside the workspace"

  plugins:boundary:
    desc: "ADR-0137 D2's acid test — prove each plugin is self-contained (import direction + estate ownership)"
    silent: true
    cmds:
      - |
        set -eu
        # D2: "Developing a plugin changes nothing outside plugins/<name>/."
        #
        # The ADR asks for this to be "mechanically checkable the way
        # plugins:standalone is" — and note what that gate actually does: it proves a
        # PROPERTY OF THE TREE, not a property of a diff. So does this. The strongest
        # mechanical statement of "developing a plugin changes nothing outside it" is
        # that there IS nothing outside it: a self-contained plugin has nowhere else
        # to reach. (The diff-shaped half — a change that edits a plugin AND
        # special-cases it in core — is plugins:boundary:diff, which needs a base ref.)
        fail=0

        # ── 1. The import direction ──────────────────────────────────────────────
        # core may depend on sdk; a plugin may depend on sdk; a plugin may NEVER
        # depend on core. This is the whole claim in one line — a plugin that
        # imported the control plane would disprove every other guarantee here, and
        # would make `mock-stratt` pointless (a plugin testing itself would pull in
        # the thing it is supposed to be independent of).
        for mod in $(find plugins -maxdepth 2 -name go.mod | sort); do
          if grep -q "dstout-devops/stratt/core" "$mod"; then
            echo "  ✗ $(dirname "$mod") depends on core/ — a plugin must never import the control plane"
            fail=1
          fi
        done

        # ── 2. A migrated plugin owns ALL of its declarations ────────────────────
        # A RATCHET, deliberately, not a cliff: it fails only for plugins that have
        # already taken ownership (they have plugins/<name>/estate/). A gate that
        # went red for all 12 unmigrated plugins on day one would be switched off
        # within a week, and a switched-off gate is worse than none. What it buys is
        # that migration is one-way — nothing drifts back into estate/ — and the
        # remaining debt is PRINTED rather than living in someone's head.
        migrated=""; pending=""
        for id in $(grep -h "pluginIdentity:" estate/actuators/*.yaml estate/connectors/*.yaml 2>/dev/null \
                    | sed 's/.*pluginIdentity:[[:space:]]*//' | tr -d '"' | sort -u); do
          [ -d "plugins/$id" ] || continue
          if [ -d "plugins/$id/estate" ]; then
            echo "  ✗ plugin '$id' owns plugins/$id/estate but still has declarations in estate/:"
            grep -ln "pluginIdentity:[[:space:]]*\"\?$id\"\?$" estate/actuators/*.yaml estate/connectors/*.yaml 2>/dev/null \
              | sed 's/^/        /'
            fail=1
          else
            pending="$pending $id"
          fi
        done
        for d in plugins/*/estate; do
          [ -d "$d" ] && migrated="$migrated $(basename "$(dirname "$d")")"
        done

        # ── 3. A plugin's declarations NAME no other plugin ──────────────────────
        # The rule is ADR-0104 D1, and it is about NAMES, not about dependency:
        #
        #     "A declaration requires `keycustodian`, NEVER `openbao-transit`. The
        #      capability class is the sovereign contract; the plugin that fulfils it
        #      is a swappable transport."
        #
        # A plugin DEPENDING on another capability is the intended design, not a
        # violation — ansible cannot provision the hosts it converges, a cert plugin
        # needs a CA, an HSM-backed one needs `keycustodian`. `requires: [provisioning]`
        # is correct and this check deliberately says nothing about it. What is refused
        # is naming a PROVIDER: `action: awsec2/create-vm` welds one plugin to another
        # and is exactly what a capability class exists to avoid (§1.5, the anti-Jenkins
        # move — coupling to a contract cannot version-rot the way a named provider can).
        #
        # It caught linux-onboard, which step 2 had moved into plugins/ansible. Note
        # what the real defect was: not that the Workflow spans two plugins — that is
        # ordinary and fine — but that it NAMES awsec2. The capability-typed form of it
        # cannot be written today (a Workflow Step takes a concrete actuator:/action:,
        # with no `requiresCapability:` equivalent to the one an Intent has), so it
        # lives in estate/ for now BECAUSE THE MECHANISM IS MISSING, not because a
        # cross-plugin lifecycle inherently belongs to core.
        #
        # Ownership comes from the declarations themselves — an `actuator:` resolves
        # through its declaration's pluginIdentity, an `action: <plugin>/<verb>`
        # through its prefix. A reference this cannot resolve (a boot-registered
        # Actuator like cert-issuer or mcp) is SKIPPED rather than guessed at.
        owners=$(for f in estate/actuators/*.yaml plugins/*/estate/actuators/*.yaml; do
          [ -f "$f" ] || continue
          n=$(grep -m1 "^name:" "$f" | sed 's/name:[[:space:]]*//' | tr -d '"')
          p=$(grep -m1 "pluginIdentity:" "$f" | sed 's/.*pluginIdentity:[[:space:]]*//' | tr -d '"')
          [ -n "$n" ] && [ -n "$p" ] && echo "$n=$p"
        done)
        # Both a plugin's own estate AND its demo's estate: a SINGLE-plugin demo is what
        # earns a demo the right to live inside a plugin (D7), so it is held to the same
        # rule as the declarations beside it.
        for d in plugins/*/estate plugins/*/demo/estate; do
          [ -d "$d" ] || continue
          self=$(basename "$d")
          case "$d" in
            */demo/estate) self=$(basename "$(dirname "$(dirname "$d")")") ;;
            *)             self=$(basename "$(dirname "$d")") ;;
          esac
          for f in $(find "$d" -name '*.yaml' -o -name '*.yml' 2>/dev/null); do
            for ref in $(grep -oE "^[[:space:]]*(actuator|action):[[:space:]]*[A-Za-z0-9/_-]+" "$f" 2>/dev/null \
                         | sed 's/.*:[[:space:]]*//'); do
              case "$ref" in
                */*) owner=${ref%%/*} ;;                                     # action: <plugin>/<verb>
                *)   owner=$(echo "$owners" | grep -m1 "^$ref=" | cut -d= -f2) ;;
              esac
              [ -n "$owner" ] || continue                                    # unresolvable ⇒ not ours to judge
              if [ "$owner" != "$self" ]; then
                echo "  ✗ $f NAMES another plugin's provider: '$ref' (owned by '$owner')."
                echo "      Depend on a capability CLASS, never a provider name (ADR-0104 D1). Depending on"
                echo "      another capability is fine — naming who fulfils it is not."
                fail=1
              fi
            done
          done
        done

        # ── 5. A provider's ADVERTISED Workflows live in its OWN tree ───────────
        # Check 3 reads `actuator:`/`action:` references. It does NOT read the per-kind
        # maps — `provisions`/`remediates`/`decommissions` — and that gap was real: ADR-0137
        # step 4 moved vsphere-vm-build and vsphere-vm-teardown into plugins/vcenter/ and left
        # vsphere-subnet-build in estate/, so vcenter's `provisions` map pointed into two
        # different trees and nothing noticed. A provider whose advertised mechanisms are
        # scattered is a plugin that does not actually own its own declarations (D2), and the
        # ratchet is only a ratchet if it covers every way one can advertise a mechanism.
        #
        # Same ownership test as check 3, applied to the maps rather than to Step references.
        # Scoped to plugin trees: a provider declared in estate/ is core-owned and may name any
        # Workflow the floor declares.
        for d in plugins/*/estate; do
          [ -d "$d" ] || continue
          self=$(basename "$(dirname "$d")")
          own=$(for w in "$d"/workflows/*.yaml plugins/"$self"/demo/estate/workflows/*.yaml; do
            [ -f "$w" ] || continue
            grep -m1 "^name:" "$w" | sed 's/name:[[:space:]]*//' | tr -d '"'
          done)
          for f in $(find "$d" -name '*.yaml' -o -name '*.yml' 2>/dev/null); do
            for wf in $(awk '
              /^(provisions|remediates|decommissions):[[:space:]]*$/ { inmap=1; next }
              /^[^[:space:]#]/ { inmap=0 }
              inmap && /^[[:space:]]+[A-Za-z][A-Za-z0-9_.-]*:[[:space:]]*[A-Za-z0-9][A-Za-z0-9_-]*[[:space:]]*$/ {
                sub(/^[^:]*:[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); print
              }' "$f" 2>/dev/null); do
              if ! echo "$own" | grep -qx "$wf"; then
                echo "  ✗ $f ADVERTISES workflow '$wf', which is not declared in plugins/$self/."
                echo "      A provider's provisions/remediates/decommissions map names ITS OWN mechanisms"
                echo "      (ADR-0140 D2). One pointing outside its tree means the plugin does not own the"
                echo "      thing it advertises \u2014 move the Workflow, or drop the entry."
                fail=1
              fi
            done
          done
        done

        # ── 4. demos/ holds CROSS-plugin scenarios only ──────────────────────────
        # D7: a demo that exercises ONE plugin belongs beside that plugin; demos/ is
        # for scenarios that span several, which is the only thing no single plugin
        # can own. Without this the split silently re-scatters — a new single-plugin
        # demo lands in demos/ because that is where demos "go", and the tree drifts
        # back to where it started one file at a time.
        #
        # A demo's span is read the same way its estate declares it: pluginIdentity on
        # its Actuators/Connectors, plus the `<plugin>/` prefix of any Action it calls.
        for d in demos/*/; do
          [ -d "${d}estate" ] || continue
          spans=$({ grep -rhoE "pluginIdentity:[[:space:]]*[a-z0-9-]+" "$d" 2>/dev/null | sed 's/.*:[[:space:]]*//'
                    grep -rhoE "^[[:space:]]+action:[[:space:]]*[a-z0-9-]+/" "$d" 2>/dev/null | sed 's|.*:[[:space:]]*||; s|/||'
                  } | sort -u | tr '\n' ' ' | sed 's/ *$//')
          n=$(echo "$spans" | wc -w)
          if [ "$n" -eq 1 ]; then
            echo "  ✗ demo '$(basename "$d")' exercises only '$spans' — a single-plugin demo belongs in"
            echo "      plugins/$spans/demo/, not in demos/ (ADR-0137 D7)"
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo ""
          echo "✗ plugins:boundary — see above (ADR-0137 D2)"
          exit 1
        fi
        echo "✓ plugins:boundary — no plugin depends on core; every migrated plugin owns its declarations"
        echo "  migrated:$migrated"
        [ -n "$pending" ] && echo "  still owned by estate/ (ADR-0137 step 4):$pending" || true

  plugins:boundary:diff:
    desc: "ADR-0137 D2 on a DIFF — a plugin change must not reach into core (BASE=origin/main)"
    silent: true
    vars:
      BASE: '{{.BASE | default ""}}'
    cmds:
      - |
        set -eu
        base="{{.BASE}}"
        if [ -z "$base" ]; then
          echo "· plugins:boundary:diff — skipped (no BASE; run as: BASE=origin/main task plugins:boundary:diff)"
          exit 0
        fi
        # An UNSET base skips (above); a SET but unresolvable one FAILS. The
        # difference is the same one estate/plugins.yaml draws between "declared
        # nothing" and "declared something unreadable": CI sets BASE deliberately, so
        # a base it cannot resolve means the gate is silently a no-op — admitted,
        # never consulted, reported nowhere. That is the failure shape this whole ADR
        # keeps refusing, and a gate is the last place to permit it.
        if ! git rev-parse --verify --quiet "$base" >/dev/null; then
          echo "✗ plugins:boundary:diff — BASE=$base does not resolve here, so this gate would check NOTHING."
          echo "  Fetch it first (CI does this for buf):  git fetch --no-tags origin +refs/heads/main:refs/heads/main"
          exit 1
        fi
        changed=$(git diff --name-only "$base"...HEAD)
        [ -n "$changed" ] || { echo "✓ plugins:boundary:diff — no changes"; exit 0; }

        touched_plugins=$(echo "$changed" | grep '^plugins/' | cut -d/ -f2 | sort -u || true)
        [ -n "$touched_plugins" ] || { echo "✓ plugins:boundary:diff — no plugin touched"; exit 0; }

        # This is the half the structural gate CANNOT see: a change that edits a
        # plugin AND teaches core about it — the `if ansible {}` §1.4 forbids. It
        # leaves no trace in the plugin's module graph, so only the shape of the
        # change reveals it.
        #
        # Each exception below is allowed for a STATED reason, not for convenience.
        #
        # The contracts/ exceptions are NARROW on purpose. Only `actuators/` and
        # `actions/` hold a plugin's own wire promises — 22 of the tree's 152
        # documents. The other 130 are not the plugin's to own and never were:
        # `facets/` is graph vocabulary that core compositions READ (a Blueprint route
        # observes app.config), `intents/` is the payload shape of core Named Kinds,
        # `capabilities/` is the closed core-owned class vocabulary (ADR-0104), plus
        # policy/ and outputs/. A plugin change that touches one of those is a §1.1/§2.1
        # event — a new Facet namespace, a changed Intent shape — and must be reviewed
        # as one, not waved through as routine plugin work. A blanket `contracts/`
        # exception did exactly that.
        outside=$(echo "$changed" | grep -v '^plugins/' \
          | grep -v '^proto/'                  `# the port itself — D2 exception 2` \
          | grep -v '^sdk/stratt/'             `# generated port bindings` \
          | grep -v '^types/capability'        `# the capability vocabulary — D2 exception 1` \
          | grep -v '^estate/plugins.yaml$'    `# ADMISSION: deploying, not developing (D3)` \
          | grep -v '^contracts/actuators/'    `# TEMPORARY: a plugin's own input Contract (D5/step 6)` \
          | grep -v '^contracts/actions/'      `# TEMPORARY: a plugin's own Action Contracts (D5/step 6)` \
          | grep -v '^docs/'                   `# never load-bearing` \
          | grep -v '\.md$'                    \
          || true)
        [ -n "$outside" ] || { echo "✓ plugins:boundary:diff — plugin change stayed inside its plugin"; exit 0; }

        # The escape hatch is a STATEMENT, not a switch. A change that genuinely
        # alters the boundary itself — building the plugin-estate mechanism, moving a
        # Contract — is legitimate and must be possible; what must not be possible is
        # doing it silently. Saying so in the commit message puts it in front of the
        # reviewer, which is the same logic D3 applies to admission: the exception is
        # fine, the exception being invisible is not.
        if git log --format=%B "$base"..HEAD | grep -q '^Boundary-Change:'; then
          echo "✓ plugins:boundary:diff — core paths touched, declared via Boundary-Change:"
          echo "$outside" | sed 's/^/    /'
          exit 0
        fi
        echo "✗ plugins:boundary:diff — this change touches$(echo " $touched_plugins" | tr '\n' ' ')and also reaches outside:"
        echo "$outside" | sed 's/^/    /'
        echo ""
        echo "  ADR-0137 D2: developing a plugin changes nothing outside plugins/<name>/."
        echo "  If this IS a deliberate change to the boundary (a new capability class, a"
        echo "  port change, moving a Contract), say so — add a trailer to the commit:"
        echo ""
        echo "      Boundary-Change: <why this must touch core>"
        echo ""
        echo "  If it is not, the coupling belongs inside the plugin."
        exit 1

  e2e:cells:
    desc: Two-Cell end-to-end harness — federated read + fenced Source re-home over real HTTP (ADR-0044; needs `task dev:up`)
    dir: core
    cmds:
      - go test ./internal/api/ -run TestCellsE2E -v -count=1

  ci:
    desc: Aggregate gate CI runs — evergreen + formatting + lint + codegen freshness + tests
    cmds:
      - task: evergreen
      - task: fmt:check
      - task: lint
      - task: generate:check
      - task: proto:check
      - task: migrate:lint
      # The bundled tofu modules are executable content and belong in the gate for the
      # same reason the playbooks do. They were outside it only because no tofu binary
      # existed here, which is how a module shipped unvalidated with no lockfile.
      - task: tofu:validate
      - task: adr:index:check
      - task: test
      - task: plugins:standalone
      - task: plugins:boundary
      # D2's diff half. Needs a base ref, so it SKIPS locally and runs in CI, where
      # the workflow fetches main. Skipping without a base is deliberate: the check
      # is about the shape of a change, and there is no change to shape when you are
      # just running the gate on a checkout.
      - task: plugins:boundary:diff
      - task: ee:content:check
      - task: ui:ci

  dev:up:
    desc: "EXTRAS (opt-in; genesis needs none of this): full compose dev substrate (Postgres 18, NATS, Temporal, vspheresim, …)"
    # The guest image first: vspheresim gives every VM it provisions a container
    # guest, and a missing image degrades into a per-VM "guest backing failed" rather
    # than a failure anyone would read as the cause.
    deps: [dev:vspheresim:guest-image]
    cmds:
      - docker compose -f deploy/dev/docker-compose.yml up -d --wait

  dev:down:
    desc: Stop the dev substrate (keep volumes)
    cmds:
      - docker compose -f deploy/dev/docker-compose.yml down

  dev:nuke:
    desc: Stop the dev substrate and delete its volumes (fresh graph)
    prompt: This deletes the dev Postgres/NATS data volumes. Continue?
    cmds:
      - docker compose -f deploy/dev/docker-compose.yml down -v

  dev:zitadel:bootstrap:
    desc: Provision the dev e2e service identities in Zitadel (ADR-0009 slice 5)
    cmds:
      - deploy/dev/zitadel-bootstrap.sh

  migrate:lint:
    desc: >
      Expand/contract lint (UPG-1, ADR-0078): fail if a migration's Up section has
      a DESTRUCTIVE change (drop/rename/type-change/set-not-null) that would break
      the previous release's still-running replicas during a rolling upgrade. A
      genuine contract step (a later release, after every replica is new) opts out
      with a `-- expand/contract-ok: <reason>` marker in the file.
    cmds:
      - |
        set -eu
        dir=core/internal/graph/migrations
        rc=0
        for f in "$dir"/*.sql; do
          up=$(awk '/-- \+goose Up/{u=1;next} /-- \+goose Down/{u=0} u' "$f")
          if printf '%s\n' "$up" | grep -iqE 'DROP +TABLE|DROP +COLUMN|DROP +CONSTRAINT|RENAME +(COLUMN|TO)|ALTER +COLUMN.*TYPE|SET +NOT +NULL'; then
            if grep -qiE 'expand/contract-ok' "$f"; then
              echo "  ~ $(basename "$f"): destructive Up, acknowledged (expand/contract-ok)"
            else
              echo "  ✗ $(basename "$f"): destructive change in Up would break the previous release's replicas during a rolling upgrade (UPG-1). Split into a later contract release, or annotate '-- expand/contract-ok: <reason>'."
              rc=1
            fi
          fi
        done
        [ "$rc" = 0 ] && echo "✓ migrations are expand/contract-safe" || exit 1

  dr:restore-test:
    desc: >
      DR restore drill (enterprise-readiness DR-1): pg_dump the graph exactly as
      the backup CronJob does, restore it into a throwaway database, and assert a
      known table survives. Proves the backup FORMAT restores — a backup you have
      never restored is not a backup. Needs the dev substrate (task dev:up).
    vars:
      URL: '{{.STRATT_DATABASE_URL | default "postgres://stratt:stratt-dev@localhost:5432/stratt"}}'
    cmds:
      - |
        set -euo pipefail
        base="{{.URL}}"; base="${base%/*}"
        tmp="stratt_restore_test_$$"
        dump="$(mktemp -t stratt-dr-XXXX.sql.gz)"
        # The dump client major MUST be >= the server major (the backup CronJob's
        # postgres:18 image guarantees this in-cluster). pipefail makes a failed
        # pg_dump abort the drill rather than write an empty archive.
        echo "→ dump (as the CronJob does)"
        pg_dump "{{.URL}}" | gzip > "$dump" || { echo "pg_dump failed — ensure the client major >= server (the CronJob uses postgres:18)"; exit 1; }
        trap 'rm -f "$dump"; psql "$base/postgres" -c "DROP DATABASE IF EXISTS $tmp WITH (FORCE)" >/dev/null 2>&1 || true' EXIT
        echo "→ restore into $tmp"; createdb "$base/$tmp" >/dev/null 2>&1 || psql "$base/postgres" -c "CREATE DATABASE $tmp"
        gunzip -c "$dump" | psql "$base/$tmp" >/dev/null
        echo "→ verify the (non-rebuildable) audit chain table survived the roundtrip"
        n=$(psql "$base/$tmp" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='audit' AND table_name='event'")
        test "$n" = "1" || { echo "RESTORE FAILED: audit.event missing after restore"; exit 1; }
        echo "✓ DR restore drill passed (dump→restore→verify)"

  dev:openbao:bootstrap:
    desc: Provision the dev CLM in OpenBao — PKI engine, root CA, role, demo certs (ADR-0030)
    cmds:
      - deploy/dev/openbao-bootstrap.sh

  dev:netbox:up:
    # The IN-KIND IPAM — the network leg's LAST dependency (NET-2). netbox-ipam had an image and no
    # floor to run in, so opentofu-network verified as a provisioning provider and sat pending on
    # `ipam` forever. Heavier than openbao/seaweedfs because NetBox needs Postgres and Redis beside
    # it, and worth it for the same reason: ADR-0112 D5's claim is that a subnet CIDR is ALLOCATED
    # by a real allocator, not declared — which a stub cannot prove.
    #
    # The bootstrap is the SAME script the compose path uses, pointed at a port-forward, exactly as
    # dev:openbao:up does. One seeding of record for both floors.
    desc: "Stand the dev IPAM (NetBox + Postgres + Redis) in kind and seed its topology (NET-2)"
    deps: [tools:kubectl]
    cmds:
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f {{.ROOT_DIR}}/deploy/dev/netbox.yaml"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/netbox-postgres --timeout=180s"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/netbox-redis --timeout=120s"
      # NetBox migrates on first boot; this is a startup budget, not a guess.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/netbox --timeout=420s"
      - |
        set -eu
        "{{.KUBECTL}}" --context {{.KIND_CONTEXT}} -n stratt port-forward deploy/netbox 18083:8080 >/dev/null 2>&1 &
        pf=$!
        trap 'kill $pf 2>/dev/null || true' EXIT
        for _ in $(seq 1 60); do
          if curl -fsS -o /dev/null http://127.0.0.1:18083/api/ 2>/dev/null; then break; fi
          sleep 2
        done
        # MINT the API token and store it where the plugin reads it. NetBox 4.5 generates the
        # value and matches it through a key it derives, so there is no literal to configure —
        # measured: with the pepper set and a FRESH database, SUPERUSER_API_TOKEN mints nothing.
        # Idempotent: an existing Secret is reused so re-running does not orphan a live token.
        if ! "{{.KUBECTL}}" --context {{.KIND_CONTEXT}} -n stratt get secret netbox-api-token >/dev/null 2>&1; then
          tok=$("{{.KUBECTL}}" --context {{.KIND_CONTEXT}} -n stratt exec deploy/netbox -- \
            /opt/netbox/netbox/manage.py shell -c "
        from users.models import Token, User
        u = User.objects.filter(is_superuser=True).first()
        t = Token(user=u, description='stratt dev floor')
        t.save()
        # The CREDENTIAL is what follows the scheme in the Authorization header. For a v2 token
        # that is nbt_<key>.<plaintext> — NetBox looks the token up BY KEY and then HMAC-validates
        # the plaintext, so the key is part of the credential and not decoration. get_auth_header_prefix()
        # is NetBox's own account of the shape ('Token ' for v1, 'Bearer nbt_<key>.' for v2); taking the
        # value from there means this never drifts from the server's parser.
        print('STRATT_TOKEN=' + t.get_auth_header_prefix().split(' ', 1)[1] + str(t.token))
        " 2>/dev/null | sed -n 's/^STRATT_TOKEN=//p' | tr -d '\r')
          test -n "$tok" || { echo "netbox: minting an API token produced nothing" >&2; exit 1; }
          "{{.KUBECTL}}" --context {{.KIND_CONTEXT}} -n stratt create secret generic netbox-api-token \
            --from-literal=token="$tok" >/dev/null
          echo "netbox: minted an API token into secret/netbox-api-token"
        else
          tok=$("{{.KUBECTL}}" --context {{.KIND_CONTEXT}} -n stratt get secret netbox-api-token \
            -o jsonpath='{.data.token}' | base64 -d)
          echo "netbox: reusing the existing secret/netbox-api-token"
        fi
        STRATT_NETBOX_ADDR=http://127.0.0.1:18083 STRATT_NETBOX_TOKEN="$tok" {{.ROOT_DIR}}/deploy/dev/netbox-bootstrap.sh

  dev:floci:up:
    # The real-EC2-API backend the network leg builds against, in kind (ADR-0093/0112). The
    # aws-network module defaults `aws_endpoint` to http://floci:4566, so a Service of that name is
    # all it needs — no plugin or estate change. Deliberately WITHOUT the host Docker socket the
    # compose service mounts: the network leg calls CreateVpc/CreateSubnet and nothing that
    # materialises an instance (HAR-1).
    desc: "Stand the dev EC2 API (floci) in kind — the network leg's build target"
    deps: [tools:kubectl]
    cmds:
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f {{.ROOT_DIR}}/deploy/dev/floci.yaml"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/floci --timeout=180s"

  dev:objectstore:up:
    # The IN-KIND S3-compatible store the `statestore` capability needs a real provider for
    # (W5 prerequisite). Same story as dev:openbao:up one leg over: SeaweedFS shipped in compose,
    # dev:connector-e2e is fully in-kind, and the awss3 plugin therefore ran with no state bucket
    # and — correctly — advertised no statestore capability. The registry then refused the estate's
    # s3-statestore Actuator as a PHANTOM PROVIDER and opentofu-network sat pending on a dependency
    # forever. Every layer was right; the floor had no object store.
    desc: "Stand the dev object store (SeaweedFS) in kind and create the tofu state bucket (W5 prereq)"
    deps: [tools:kubectl]
    cmds:
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f {{.ROOT_DIR}}/deploy/dev/seaweedfs.yaml"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/seaweedfs --timeout=180s"
      - |
        set -eu
        # tofu's s3 backend does NOT create its bucket, and its diagnostic for a missing one names
        # the REGION rather than the bucket — a long way from the cause (measured, ADR-0145).
        "{{.KUBECTL}}" --context {{.KIND_CONTEXT}} -n stratt port-forward deploy/seaweedfs 18333:8333 >/dev/null 2>&1 &
        pf=$!
        trap 'kill $pf 2>/dev/null || true' EXIT
        for _ in $(seq 1 40); do
          if curl -fsS -o /dev/null http://127.0.0.1:18333/healthz 2>/dev/null; then break; fi
          sleep 1
        done
        docker run --rm --network host \
          -e AWS_ACCESS_KEY_ID=testing -e AWS_SECRET_ACCESS_KEY=testing \
          amazon/aws-cli:2.32.5 --endpoint-url http://127.0.0.1:18333 --region us-east-1 \
          s3api create-bucket --bucket stratt-tofu-state >/dev/null 2>&1 || true
        echo "objectstore: bucket stratt-tofu-state ready"

  dev:openbao:up:
    # The IN-KIND dev CLM (CERT-1, W4). OpenBao shipped as a compose service and
    # `dev:connector-e2e` is fully in-kind by design, so the certificate leg had no floor in which
    # its provider could exist — the compile failed closed with `no verified provider builds
    # Intent/Certificate`. Same in-cluster-substrate posture values-allinone takes for
    # Postgres/NATS/Temporal: a dev floor stands up from nothing.
    #
    # The bootstrap is the SAME script the compose path uses, pointed at a port-forward — one
    # provisioning of record for both floors, rather than a second copy that drifts.
    desc: "Stand the dev CLM (OpenBao) in kind and provision its PKI — the certissuer provider's backend (W4)"
    deps: [tools:kubectl]
    cmds:
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f {{.ROOT_DIR}}/deploy/dev/openbao.yaml"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/openbao --timeout=120s"
      - |
        set -eu
        "{{.KUBECTL}}" --context {{.KIND_CONTEXT}} -n stratt port-forward deploy/openbao 18200:8200 >/dev/null 2>&1 &
        pf=$!
        trap 'kill $pf 2>/dev/null || true' EXIT
        for _ in $(seq 1 30); do
          if curl -fsS -o /dev/null http://127.0.0.1:18200/v1/sys/health 2>/dev/null; then break; fi
          sleep 1
        done
        STRATT_OPENBAO_ADDR=http://127.0.0.1:18200 {{.ROOT_DIR}}/deploy/dev/openbao-bootstrap.sh

  dev:netbox:bootstrap:
    desc: Seed the dev NetBox with an enterprise topology — regions, AZs, tenants (sovereignty), VLANs, the app supernet (ADR-0111)
    cmds:
      - deploy/dev/netbox-bootstrap.sh

  dev:vspheresim:guest-image:
    # The guest OS. vspheresim gives every VM a real container, which makes a
    # provisioned VM REACHABLE — but a base image answers no port, so the coordinate
    # led to a host that could be named and never logged into. This image is sshd plus
    # python3: the reach path, and what a configuration tool needs on the far side.
    #
    # Built rather than pulled because the authorized key is the harness's, and
    # because an image assembled at boot (apk add in an entrypoint) would make every
    # guest's readiness depend on network egress from inside the guest.
    desc: "Build the vspheresim guest image — sshd + python3, keyed to the dev machine credential"
    deps: [dev:machine-key]
    vars:
      GUEST_IMAGE: '{{.GUEST_IMAGE | default "stratt/vspheresim-guest:dev"}}'
      KEYDIR: "{{.ROOT_DIR}}/deploy/dev/managed-web"
    cmds:
      - docker build -q --build-arg AUTHORIZED_KEY="$(cat {{.KEYDIR}}/id_ed25519.pub)" -t {{.GUEST_IMAGE}} {{.ROOT_DIR}}/plugins/vcenter/cmd/vspheresim/guestimage

  dev:vspheresim:up:
    # vspheresim (plugins/vcenter/cmd/vspheresim) — a vCenter API whose VMs have REAL
    # container guests, so provision→configure can be exercised on vSphere at all.
    # The stock vcsim image stops at the API: create-vm executes and the inventory is
    # real, but no guest boots, so a provisioned VM never gets a reachability
    # coordinate (ADR-0143) and nothing can be converged onto it.
    #
    # Guests get `<vm>.${DOMAIN}` as their hostname so the coordinate resolves to a
    # NAME rather than an address — the branch ADR-0143 D1 prefers, and one that would
    # otherwise never be exercised because docker defaults a container's hostname to
    # its own id.
    #
    # A USER-DEFINED docker network is load-bearing, not tidiness. Docker's embedded
    # DNS serves only user-defined networks, and it is what resolves that name; on the
    # default bridge the guests would be reachable by address and the published
    # coordinate would resolve nowhere. That is the harness standing in for the DNS a
    # real estate has, and it is why the reach proof runs from a peer ON the network.
    desc: "Run vspheresim on :8989 — a vCenter API with real container-backed guests"
    deps: [dev:vspheresim:guest-image]
    vars:
      GUEST_IMAGE: '{{.GUEST_IMAGE | default "stratt/vspheresim-guest:dev"}}'
      GUEST_NETWORK: '{{.GUEST_NETWORK | default "vspheresim"}}'
      DOMAIN: '{{.DOMAIN | default "dev.stratt.test"}}'
      LISTEN: '{{.LISTEN | default "127.0.0.1:8989"}}'
    cmds:
      - docker network inspect {{.GUEST_NETWORK}} >/dev/null 2>&1 || docker network create {{.GUEST_NETWORK}}
      - |
        set -eu
        cd {{.ROOT_DIR}}/plugins/vcenter
        # -guest-args is emptied deliberately: its default keeps a bare base image
        # alive, and this image's own entrypoint IS the guest's init.
        go run ./cmd/vspheresim \
          -listen {{.LISTEN}} \
          -guest-image {{.GUEST_IMAGE}} \
          -guest-network {{.GUEST_NETWORK}} \
          -guest-args "" \
          -guest-domain {{.DOMAIN}}

  dev:vspheresim:proof:
    # The whole chain end to end: create a VM through the real vcenter/create-vm Action
    # with ordinary vSphere params, poll Observe until mgmt.address appears, assert it
    # is a NAME — and then USE it: reach the guest at that coordinate and execute.
    # Needs dev:vspheresim:up running.
    desc: "Prove provision→reach→execute against vspheresim (needs dev:vspheresim:up)"
    dir: plugins/vcenter
    env:
      # https, because vspheresim serves TLS by default exactly as vCenter and the stock
      # vcsim image do; the certificate is self-signed and clients dial insecure.
      VSPHERESIM_URL: '{{.VSPHERESIM_URL | default "https://127.0.0.1:8989/sdk"}}'
      # Set together with the URL so the converge half is never quietly skipped: a
      # reach proof that passes while nothing was executed is the failure mode this
      # target exists to close.
      VSPHERESIM_GUEST_NETWORK: '{{.GUEST_NETWORK | default "vspheresim"}}'
      VSPHERESIM_GUEST_IMAGE: '{{.GUEST_IMAGE | default "stratt/vspheresim-guest:dev"}}'
      VSPHERESIM_GUEST_KEY: "{{.ROOT_DIR}}/deploy/dev/managed-web/id_ed25519"
    cmds:
      - go test ./ -run LiveVsphereSim -v -count=1

  dev:vsphere:bootstrap:
    desc: Seed the dev vspheresim with an enterprise topology — regions (datacenters), AZs (clusters), sovereignty (tenant folders), VLAN portgroups (ADR-0113)
    dir: plugins/vcenter
    cmds:
      - STRATT_VCENTER_URL={{.STRATT_VCENTER_URL | default "https://localhost:8989/sdk"}} go run ./cmd/vsphere-seed

  dev:scim:bootstrap:
    desc: Drive the SCIM SP like an IdP — push Users/Group, filter, deactivate (ADR-0035)
    cmds:
      - deploy/dev/scim-bootstrap.sh

  dev:logs:
    desc: Tail dev substrate logs
    cmds:
      - docker compose -f deploy/dev/docker-compose.yml logs -f --tail=50

  dev:kind:up:
    desc: Create the kind dev cluster for the dispatcher (ADR-0007) — idempotent, self-healing
    deps: [tools:kubectl]
    cmds:
      # Pre-create kind's network with an explicit subnet — the devcontainer's
      # docker-in-docker default address pool is small, and kind reuses an
      # existing network named "kind" instead of allocating from the pool.
      - docker network inspect kind >/dev/null 2>&1 || docker network create --subnet 192.168.102.0/24 kind
      # Idempotent: only create when the cluster is absent (re-running the turnkey
      # stack must never fail on an existing cluster).
      - |
        if go run sigs.k8s.io/kind@v{{.KIND_VER}} get clusters 2>/dev/null | grep -qx {{.KIND_CLUSTER}}; then
          echo "kind cluster {{.KIND_CLUSTER}} already exists — skipping create"
        else
          go run sigs.k8s.io/kind@v{{.KIND_VER}} create cluster --config deploy/dev/kind.yaml
        fi
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} export kubeconfig --name {{.KIND_CLUSTER}}
      # Raise the host inotify limit FROM the privileged kind node (we can't sudo
      # in the devcontainer, and this sysctl is host-global). The devcontainer
      # default (128 instances) is too low for kube-proxy + CoreDNS, which crash
      # with "too many open files" and take ClusterIP routing + DNS down with them.
      # A real host/CI runner already has an adequate limit; this makes the
      # constrained dev host self-sufficient. Idempotent.
      - docker exec {{.KIND_CLUSTER}}-control-plane sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=1048576 >/dev/null
      # If kube-proxy/CoreDNS already crashed under the old limit, bounce them so
      # they restart under the raised one; then wait for the rollout (which handles
      # the pod-recreation window, unlike `wait` which errors on no-match). DNS +
      # ClusterIP must be healthy before strattd dispatch / plugin dials depend on them.
      - |
        set -eu
        ready=$({{.KUBECTL}} --context {{.KIND_CONTEXT}} -n kube-system get pods -l k8s-app=kube-proxy -o jsonpath='{.items[*].status.containerStatuses[*].ready}' 2>/dev/null || true)
        if ! echo "$ready" | grep -q true; then
          {{.KUBECTL}} --context {{.KIND_CONTEXT}} -n kube-system rollout restart ds/kube-proxy deploy/coredns
        fi
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n kube-system rollout status ds/kube-proxy --timeout=150s"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n kube-system rollout status deploy/coredns --timeout=150s"

  dev:kind:down:
    desc: Delete the kind dev cluster
    cmds:
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} delete cluster --name {{.KIND_CLUSTER}}

  dev:status:
    desc: "Show the dev environment at a glance — kind cluster, strattd + plugin pods (with age; the ADR-0103 no-restart signal), and the compose substrate"
    silent: true
    deps: [tools:kubectl]
    cmds:
      - |
        set -eu
        echo "── kind cluster ─────────────────────────────────"
        if go run sigs.k8s.io/kind@v{{.KIND_VER}} get clusters 2>/dev/null | grep -qx {{.KIND_CLUSTER}}; then
          echo "  ✓ {{.KIND_CLUSTER}} up  (context {{.KIND_CONTEXT}})"
          echo
          echo "── workloads: namespace stratt ──────────────────"
          if {{.KUBECTL}} --context {{.KIND_CONTEXT}} get ns stratt >/dev/null 2>&1; then
            # AGE is the no-restart proof (ADR-0103): a runtime Connector enable/disable
            # must NOT bump the strattd pod's age.
            {{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt get pods 2>/dev/null
          else
            echo "  (no 'stratt' namespace — not installed; run: task dev:genesis)"
          fi
        else
          echo "  ✗ {{.KIND_CLUSTER}} not found  (run: task dev:genesis)"
        fi
        echo
        echo "── compose substrate ────────────────────────────"
        docker compose -f deploy/dev/docker-compose.yml ps 2>/dev/null || echo "  (compose not running)"

  image:build:
    desc: Build the strattd control-plane image (ADR-0013)
    cmds:
      - docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} -f deploy/docker/strattd.Dockerfile -t stratt/strattd:dev .

  image:kind-load:
    desc: Build the strattd image and load it into the dev kind cluster
    cmds:
      - task: image:build
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} load docker-image stratt/strattd:dev --name {{.KIND_CLUSTER}}

  image:agent:
    desc: Build the stratt-agent (Site satellite) image and load it into kind (ADR-0032)
    cmds:
      - docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} -f deploy/docker/stratt-agent.Dockerfile -t stratt/stratt-agent:dev .
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} load docker-image stratt/stratt-agent:dev --name {{.KIND_CLUSTER}}

  image:forwarder:
    desc: Build the stratt-forwarder (audit→SIEM) image and load it into kind (ADR-0034)
    cmds:
      - docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} -f deploy/docker/stratt-forwarder.Dockerfile -t stratt/stratt-forwarder:dev .
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} load docker-image stratt/stratt-forwarder:dev --name {{.KIND_CLUSTER}}

  dev:forwarder:demo:
    desc: >-
      Run stratt-forwarder locally against the harness strattd, shipping the audit
      stream to a declared SIEM sink (ADR-0034). Declare a sink under
      notify-sinks/ (kind splunk-hec|syslog|otel-logs, config.endpoint) + grant
      the forwarder principal reader on audit:log, then `stratt apply`. Set
      STRATT_FORWARDER_SINK to the sink name.
    cmds:
      - |
        go run -C core ./cmd/stratt-forwarder
    env:
      STRATT_SERVER: '{{.STRATT_SERVER | default "http://localhost:8080"}}'
      STRATT_FORWARDER_SINK: '{{.SINK | default "splunk-dev"}}'
      STRATT_FORWARDER_PRINCIPAL: '{{.PRINCIPAL | default "audit-forwarder"}}'
      STRATT_FORWARDER_CRED_DIR: '{{.CRED_DIR | default ""}}'

  dev:site:up:
    desc: Bring up the remote Site "edge-west" agent in kind namespace site-b (ADR-0032)
    cmds:
      - task: image:agent
      - kubectl apply -f deploy/dev/site-agent.yaml
      # A Site-LOCAL credential Secret — material lives at the Site, never shipped
      # over NATS (§2.5). Only created if absent (idempotent).
      - kubectl -n site-b create secret generic edge-demo-cred --from-literal=token=site-local-only --dry-run=client -o yaml | kubectl apply -f -
      - kubectl -n site-b rollout status deploy/stratt-agent --timeout=90s

  dev:site:down:
    desc: Tear down the edge-west Site agent + namespace
    cmds:
      - kubectl delete -f deploy/dev/site-agent.yaml --ignore-not-found

  dev:cosign:keys:
    desc: Generate a dev cosign key pair for Bundle signing (ADR-0032; empty password)
    dir: deploy/dev
    cmds:
      - test -f cosign.key || COSIGN_PASSWORD="" cosign generate-key-pair
    status:
      - test -f deploy/dev/cosign.key

  dev:bundle:demo:
    desc: Build+push+sign a demo Bundle to the dev registry (ADR-0032). Prints the digest to pin.
    dir: deploy/dev
    vars:
      REF: localhost:5555/stratt/bundles/hello:1
    cmds:
      - task: dev:cosign:keys
      - rm -rf /tmp/stratt-bundle && mkdir -p /tmp/stratt-bundle/project
      - printf 'echo "hello from a signed pull Bundle"\n' > /tmp/stratt-bundle/project/run.sh
      # Build+push via the CLI; the manifest digest it prints is what you pin + sign.
      - STRATT_BUNDLE_INSECURE=true go run -C ../../core ./cmd/stratt bundle push /tmp/stratt-bundle {{.REF}} --name hello --version 1 --actuator script --command "sh,/runner/project/run.sh"
      - COSIGN_PASSWORD="" cosign sign --yes --allow-insecure-registry --key cosign.key {{.REF}}

  chart:lint:
    desc: Lint + render the Helm chart (ADR-0013)
    deps: [tools:helm, dev:stage-estate]
    cmds:
      - "{{.HELM}} lint deploy/charts/stratt"
      - "{{.HELM}} template stratt deploy/charts/stratt > /dev/null"
      - "{{.HELM}} template stratt deploy/charts/stratt -f deploy/charts/stratt/values-dev-kind.yaml > /dev/null"
      - "{{.HELM}} template stratt deploy/charts/stratt -f deploy/charts/stratt/values-dev-kind.yaml -f deploy/charts/stratt/values-e2e.yaml > /dev/null"
      # Real-authz profile (ADR-0101 Phase A): openfga.enabled + oidc.issuers, dev header off.
      - "{{.HELM}} template stratt deploy/charts/stratt -f deploy/charts/stratt/values-dev-kind.yaml -f deploy/charts/stratt/values-e2e.yaml -f deploy/charts/stratt/values-authz.yaml > /dev/null"
      # Self-contained bootstrap profile (in-cluster substrate) — must render too.
      - "{{.HELM}} template stratt deploy/charts/stratt -f deploy/charts/stratt/values-allinone.yaml > /dev/null"
      # Self-deploy profile (helm Actuator plugin + demo chart, M2/ADR-0092).
      - "{{.HELM}} template stratt deploy/charts/stratt -f deploy/charts/stratt/values-allinone.yaml -f deploy/charts/stratt/values-selfdeploy.yaml > /dev/null"
      # Genesis profile (ADR-0102): minimal floor + self-deploy + inline declarations.
      - "{{.HELM}} template stratt deploy/charts/stratt -f deploy/charts/stratt/values-allinone.yaml -f deploy/charts/stratt/values-selfdeploy.yaml -f deploy/charts/stratt/values-genesis.yaml > /dev/null"
      # Connector-e2e profile (ADR-0103): fully in-kind — allinone substrate + helm/declared plugins + estate.
      - "{{.HELM}} template stratt deploy/charts/stratt -f deploy/charts/stratt/values-allinone.yaml -f deploy/charts/stratt/values-connector-e2e.yaml > /dev/null"

  tools:helm:
    desc: Install the pinned helm binary to .bin/ (idempotent; zero-manual bootstrap)
    status:
      - test "$({{.HELM}} version --short 2>/dev/null | sed 's/^v//; s/+.*//')" = "{{.HELM_VER}}"
    cmds:
      - mkdir -p {{.BIN}}
      - |
        set -eu
        arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64|arm64) arch=arm64;; esac
        # Verify the pinned sha256 before install (§7.3 — no bare `curl | tar`;
        # dependency-scout binding condition, ADR-0092).
        case "$arch" in
          amd64) sha="{{.HELM_SHA256_AMD64}}";;
          arm64) sha="{{.HELM_SHA256_ARM64}}";;
          *) echo "unsupported arch: $arch" >&2; exit 1;;
        esac
        tmp=$(mktemp -d)
        curl -fsSL -o "$tmp/helm.tgz" "https://get.helm.sh/helm-v{{.HELM_VER}}-linux-${arch}.tar.gz"
        echo "${sha}  $tmp/helm.tgz" | sha256sum -c -
        tar -xz -C "$tmp" -f "$tmp/helm.tgz"
        install -m 0755 "$tmp/linux-${arch}/helm" "{{.HELM}}"
        rm -rf "$tmp"

  tools:kubectl:
    desc: Install the pinned kubectl binary to .bin/ (idempotent; zero-manual bootstrap)
    status:
      - "{{.KUBECTL}} version --client 2>/dev/null | grep -q 'v{{.KUBECTL_VER}}'"
    cmds:
      - mkdir -p {{.BIN}}
      - |
        set -eu
        arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64|arm64) arch=arm64;; esac
        curl -fsSL -o "{{.KUBECTL}}" "https://dl.k8s.io/release/v{{.KUBECTL_VER}}/bin/linux/${arch}/kubectl"
        chmod +x "{{.KUBECTL}}"

  tools:tofu:
    desc: Install the pinned tofu binary to .bin/ (idempotent; zero-manual bootstrap)
    status:
      # `version -json` is pretty-printed, so a naive "key":"value" grep never matches
      # and the install re-ran on every invocation. Match the plain banner instead.
      - '{{.TOFU}} version 2>/dev/null | grep -qx "OpenTofu v{{.TOFU_VER}}"'
    cmds:
      - mkdir -p {{.BIN}}
      - |
        set -eu
        arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64|arm64) arch=arm64;; esac
        case "$arch" in
          amd64) sha="{{.TOFU_SHA256_AMD64}}";;
          arm64) sha="{{.TOFU_SHA256_ARM64}}";;
          *) echo "unsupported arch: $arch" >&2; exit 1;;
        esac
        tmp=$(mktemp -d)
        curl -fsSL -o "$tmp/tofu.zip" "https://github.com/opentofu/opentofu/releases/download/v{{.TOFU_VER}}/tofu_{{.TOFU_VER}}_linux_${arch}.zip"
        echo "${sha}  $tmp/tofu.zip" | sha256sum -c -
        unzip -q -o -d "$tmp" "$tmp/tofu.zip"
        install -m 0755 "$tmp/tofu" "{{.TOFU}}"
        rm -rf "$tmp"

  dev:placement:proof:
    # PRV-2's live proof (ADR-0147): an instance built INTO a real subnet, against the real EC2
    # API, plus the falsification — the raw Intent NAME the estate used to send is REJECTED by
    # the substrate. Without that second half the first would pass equally against a backend
    # that ignored placement entirely.
    desc: Live-prove the network→host join against floci (ADR-0147)
    dir: plugins/awsec2
    env:
      STRATT_LIVE_EC2_ENDPOINT: http://localhost:4566
    cmds:
      - docker compose -f {{.ROOT_DIR}}/deploy/dev/docker-compose.yml up -d --wait floci
      - go test ./ -run LivePlacement -v -count=1 -timeout 5m

  dev:content:proof:
    # Runs the SHIPPED apache/tomcat plays against REAL bare nodes through the REAL EE image
    # (ADR-0148). The falsification is the point: each node is asserted to start WITHOUT its
    # package, so a green run means the remediation installed it rather than the image having.
    #
    # Its first run found ANS-012 (now closed): the default EE shipped ZERO collections, so
    # `ansible.builtin.package` dispatched to community.general.apk on Alpine and found nothing.
    # The floor that fixed it is ee/content/platform.requirements.yml. Point this at another EE
    # with STRATT_LIVE_EE_IMAGE — rebuilding with `--build-arg EE_CONTENT=` reproduces the
    # original failure exactly, which is how the fix was falsified.
    #
    # Needs `task dev:ee:build` first (or any current stratt-ee:dev).
    # Four nodes: apache on Alpine/Debian/RedHat and tomcat on Debian, each asserted bare first and
    # each probed OUT-OF-BAND from a third container after the converge (ANS-014). Reading only the
    # play's own report would be taking its word for it, which is how a Tomcat that never started
    # once reported a converged port.
    desc: Live-prove the apache/tomcat content against real bare nodes, three distro families (ADR-0148)
    dir: plugins/ansible
    env:
      STRATT_LIVE_CONTENT: "1"
      STRATT_LIVE_KEYDIR: "{{.ROOT_DIR}}/deploy/dev/managed-web"
    cmds:
      - go test ./ -run LiveContent -v -count=1 -timeout 15m

  dev:tofu:proof:
    # The live proof the network leg never had (ADR-0145): a REAL tofu applying the SHIPPED
    # aws-network module against the REAL floci EC2 API with REAL S3 state, through the
    # opentofu/apply Action a launched Intent/Subnet build invokes. Everything about this leg
    # was declared and none of it had ever been executed.
    desc: Live-prove the OpenTofu subnet build against floci + seaweedfs (ADR-0145)
    deps: [tools:tofu]
    dir: plugins/opentofu
    env:
      STRATT_LIVE_EC2_ENDPOINT: http://localhost:4566
      STRATT_LIVE_S3_ENDPOINT: http://localhost:8333
    cmds:
      - docker compose -f {{.ROOT_DIR}}/deploy/dev/docker-compose.yml up -d --wait floci seaweedfs
      # The state bucket. tofu's s3 backend does NOT create one, and its diagnostic for a missing
      # bucket names the region rather than the bucket, which is a long way from the cause.
      - |
        docker run --rm --network host \
          -e AWS_ACCESS_KEY_ID=testing -e AWS_SECRET_ACCESS_KEY=testing \
          amazon/aws-cli:2.32.5 --endpoint-url http://localhost:8333 --region us-east-1 \
          s3api create-bucket --bucket stratt-tofu-state >/dev/null 2>&1 || true
      - go test ./ -run LiveOpenTofu -v -count=1 -timeout 10m

  tofu:lock:
    # Regenerates the module's COMMITTED provider lockfile (ADR-0112 D4's binding
    # condition, §7.3). Run it when required_providers moves; commit the result.
    # -platform is explicit so the committed hashes cover every platform the plugin
    # image and CI run on, not just this container's — a lockfile with one platform's
    # hashes fails `tofu init` everywhere else, which is the worst time to find out.
    desc: Regenerate deploy/tofu-modules/aws-network/.terraform.lock.hcl (provider hash pins)
    deps: [tools:tofu]
    dir: deploy/tofu-modules/aws-network
    cmds:
      - "{{.TOFU}} init -backend=false -input=false -no-color"
      - "{{.TOFU}} providers lock -platform=linux_amd64 -platform=linux_arm64 -platform=darwin_arm64"

  tofu:validate:
    # The gate the module never had. It shipped for months with no lockfile and no
    # validation because there was no tofu in this container to run either — the
    # "declared but never executed" shape this repo keeps finding. -backend=false
    # keeps it hermetic: validation must not need an S3 endpoint (the backend is
    # core-injected at Run time via the statestore handle, ADR-0105).
    desc: tofu validate the bundled modules against the COMMITTED provider lockfile
    deps: [tools:tofu]
    dir: deploy/tofu-modules/aws-network
    env:
      # HERMETIC: working state goes to .bin/ (gitignored), never into the module tree. Without
      # this the gate inherited whatever a previous run left in <module>/.terraform — after a live
      # build that meant an S3 backend binding, and `-backend=false` then failed hunting AWS
      # credentials. A gate whose result depends on what you ran before it is not a gate.
      TF_DATA_DIR: "{{.ROOT_DIR}}/.bin/tofu-data/validate"
      TF_PLUGIN_CACHE_DIR: "{{.ROOT_DIR}}/.bin/tofu-data/plugin-cache"
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.bin/tofu-data/plugin-cache"
      - "{{.TOFU}} init -backend=false -input=false -no-color -lockfile=readonly"
      # fmt over the WHOLE module tree, not just this dir — a second module added
      # later is covered without anyone remembering to extend the gate.
      - "{{.TOFU}} fmt -check -recursive {{.ROOT_DIR}}/deploy/tofu-modules"
      - "{{.TOFU}} validate -no-color"

  dev:kind:gateway:
    desc: Print the kind docker network's host gateway (compose substrate locus)
    silent: true
    cmds:
      - |
        gw=$(docker network inspect kind 2>/dev/null | grep -m1 '"Gateway"' | sed 's/.*: *"//; s/".*//')
        echo "${gw:-192.168.102.1}"

  image:plugin:
    # ONE task for EVERY plugin image (ADR-0137 D2). This used to be six tasks —
    # image:vcenter-plugin, image:helm-plugin, … — identical but for a name, which
    # meant adding a plugin required a core edit for no design reason whatsoever.
    # That is precisely the boundary defect D2 names, arriving as boilerplate
    # rather than as a decision, and `task plugins:boundary` would have to
    # allowlist it forever. Deleting the cause beats allowlisting the symptom.
    #
    # The convention is the contract: plugins/<name>/Dockerfile builds an image
    # tagged stratt-plugin-<name>:dev. A plugin needing something else needs a
    # different Dockerfile, not a different task.
    desc: 'Build a plugin image and load it into kind — `task image:plugin PLUGIN=vcenter`'
    requires:
      vars: [PLUGIN]
    cmds:
      - docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} -f plugins/{{.PLUGIN}}/Dockerfile -t stratt-plugin-{{.PLUGIN}}:dev .
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} load docker-image stratt-plugin-{{.PLUGIN}}:dev --name {{.KIND_CLUSTER}}

  images:control-plane:
    desc: Build the CONTROL-PLANE images (no push/load) — the CI regression gate. Plugins & the EE image build in their OWN units (each plugin is its own build/CI unit, ADR-0046) — core CI never builds per-plugin (it must scale to hundreds of plugins).
    cmds:
      - docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} -f deploy/docker/strattd.Dockerfile -t stratt/strattd:ci .
      - docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} -f deploy/docker/stratt-agent.Dockerfile -t stratt/stratt-agent:ci .
      - docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} -f deploy/docker/stratt-forwarder.Dockerfile -t stratt/stratt-forwarder:ci .

  dev:stage-estate:
    desc: Stage the reconciled /estate — plus every plugin estate it admits — into the chart's inline-declarations path
    silent: true
    cmds:
      # /estate is the single source of truth; this git-ignored copy is what the
      # inline-declarations ConfigMap globs. Mirror exactly (delete-extraneous) so
      # a removed declaration doesn't linger in the staged tree.
      - rm -rf {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - mkdir -p {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - cp -R {{.ROOT_DIR}}/estate/. {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations/
      # VENDOR the admitted plugin estates (ADR-0137 D1/D3). This is the `install`
      # half: in the repo a plugin estate lives beside the estate and plugins.yaml
      # reaches out to it, but a DEPLOYED estate is self-contained — the operator's
      # Git holds a copy, exactly as `stratt pack install` materializes a pack
      # (ADR-0033, §1.2 stays operator-owned).
      #
      # Vendored into plugins/<name>/estate rather than flattened INTO the estate's
      # own directories, for two reasons: two plugins may each ship a `content/`
      # root and flattening would collide them silently, and keeping the subtree
      # means the deployed tree still shows which declarations came from which
      # plugin (§1.8 — where a declaration came from stays visible).
      #
      # The ConfigMap keys on a flattened path (`/`→`__`) and deployment.yaml
      # restores it via items[].path, so the extra depth costs nothing.
      - |
        set -eu
        src="{{.ROOT_DIR}}/estate/plugins.yaml"
        dst="{{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations"
        [ -f "$src" ] || exit 0
        # name/path pairs out of the admission list. Deliberately strict: anything
        # this cannot read is a hard failure, never a silently unstaged plugin —
        # which would boot a daemon running none of that plugin's Workflows.
        names=$(awk '/^[[:space:]]*-[[:space:]]*name:/{gsub(/.*name:[[:space:]]*/,"");print}' "$src")
        paths=$(awk '/^[[:space:]]*path:/{gsub(/.*path:[[:space:]]*/,"");print}' "$src")
        [ "$(echo "$names" | grep -c .)" = "$(echo "$paths" | grep -c .)" ] || {
          echo "✗ estate/plugins.yaml: every admitted plugin needs exactly one path" >&2; exit 1; }
        : > "$dst/plugins.yaml"
        echo "# GENERATED by 'task dev:stage-estate' — edit estate/plugins.yaml instead." >> "$dst/plugins.yaml"
        echo "# The admitted plugin estates are VENDORED beside this file (ADR-0137 D3)." >> "$dst/plugins.yaml"
        echo "plugins:" >> "$dst/plugins.yaml"
        i=1
        while [ "$i" -le "$(echo "$names" | grep -c .)" ]; do
          n=$(echo "$names" | sed -n "${i}p")
          p=$(echo "$paths" | sed -n "${i}p")
          from="{{.ROOT_DIR}}/estate/$p"
          [ -d "$from" ] || { echo "✗ admitted plugin '$n': no estate at $p" >&2; exit 1; }
          mkdir -p "$dst/plugins/$n/estate"
          cp -R "$from/." "$dst/plugins/$n/estate/"
          # The plugin's own SELF CONTRACTS (ADR-0138 D3/D4), vendored as the SIBLING of its
          # estate because that is where the loader looks: plugins/<n>/{estate,contracts}.
          #
          # Not optional decoration. Since the relocation these documents are the ONLY copy —
          # `actions/helm/deploy.input` and `actuators/ansible.input` left the binary — so a
          # staged tree without them boots a daemon whose estate parse fails on the first Step
          # naming a plugin Action. That is exactly how this was found: task ci was green and
          # the pod CrashLooped with "no input contract for actuator ansible-access-control".
          cfrom="$(dirname "$from")/contracts"
          if [ -d "$cfrom" ]; then
            mkdir -p "$dst/plugins/$n/contracts"
            cp -R "$cfrom/." "$dst/plugins/$n/contracts/"
          fi
          echo "  - name: $n" >> "$dst/plugins.yaml"
          echo "    path: plugins/$n/estate" >> "$dst/plugins.yaml"
          echo "  ✓ vendored plugin estate: $n"
          i=$((i + 1))
        done

  dev:stage-genesis:
    # The LEAN genesis slice (ADR-0102): stage ONLY deploy/dev/genesis-estate into the
    # inline-declarations path — the one bootstrap-admin grant + the genesis self-deploy
    # Workflow/CredentialRef, NOT the full /estate. Same mirror-exactly mechanism as
    # dev:stage-estate, different (minimal) source, so genesis boots with just its floor.
    desc: Stage the lean genesis slice (bootstrap-admin grant + self-deploy Workflow) into the inline-declarations path
    cmds:
      - rm -rf {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - mkdir -p {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - cp -R {{.ROOT_DIR}}/deploy/dev/genesis-estate/. {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations/

  dev:machine-key:
    # The ONE dev machine credential, generated once and shared by every managed node
    # in the harness — the in-cluster managed-web deployment and vspheresim's guests
    # alike. Deliberately one keypair and not two: the same CredentialRef then reaches
    # a DECLARED host and a PROVISIONED VM on a different substrate, which is the
    # property worth having, and a second keypair would let those two paths drift into
    # working for different reasons.
    #
    # A throwaway ed25519 pair: the PRIVATE half rides the web-machine CredentialRef
    # (Secret web-machine-creds); the PUBLIC half becomes each node's authorized_keys.
    # Material is git-ignored and never committed (§2.5).
    desc: Generate the shared dev SSH machine keypair (idempotent, git-ignored)
    vars:
      KEYDIR: "{{.ROOT_DIR}}/deploy/dev/managed-web"
    status:
      - test -f {{.KEYDIR}}/id_ed25519
    cmds:
      - mkdir -p {{.KEYDIR}}
      - ssh-keygen -t ed25519 -N "" -C stratt-web-machine -f {{.KEYDIR}}/id_ed25519

  dev:dns:key:
    # The dev estate's TSIG key — the ONE secret the dns plugin signs every UPDATE and
    # AXFR with, and the same one BIND is configured to accept. Generated once, never
    # committed (§2.5), rendered into the server's config at container start rather than
    # baked into the image layer.
    #
    # 32 random bytes, base64 — the shape `tsig-keygen` emits for hmac-sha256. Written as
    # a KEY=VALUE env file so compose can carry it without the secret ever appearing on a
    # command line, where it would land in a shell history and a process table.
    desc: Generate the dev DNS TSIG key (idempotent, git-ignored)
    vars:
      KEYDIR: "{{.ROOT_DIR}}/deploy/dev/dns"
    status:
      - test -f {{.KEYDIR}}/tsig.env
    cmds:
      - mkdir -p {{.KEYDIR}}
      - |
        set -eu
        printf 'STRATT_DNS_TSIG_SECRET=%s\n' "$(head -c 32 /dev/urandom | base64)" >{{.KEYDIR}}/tsig.env
        chmod 600 {{.KEYDIR}}/tsig.env

  dev:dns:image:
    # REAL BIND 9, not a simulator (see deploy/dev/dns/Dockerfile for why that
    # distinction is load-bearing here and not elsewhere in this harness).
    desc: "Build the dev authoritative DNS server image (real BIND 9, TSIG-gated)"
    vars:
      DNS_IMAGE: '{{.DNS_IMAGE | default "stratt/dev-dns:dev"}}'
    cmds:
      - docker build -q -t {{.DNS_IMAGE}} {{.ROOT_DIR}}/deploy/dev/dns

  dev:dns:up:
    # A standalone authoritative server on the vspheresim network, so the SAME network
    # holds the guests and the resolver — which is what lets the proof reach a machine
    # BY THE NAME STRATT REGISTERED rather than by docker's embedded DNS.
    desc: "Run the dev authoritative DNS server (needs dev:dns:key)"
    deps: [dev:dns:key, dev:dns:image]
    vars:
      DNS_IMAGE: '{{.DNS_IMAGE | default "stratt/dev-dns:dev"}}'
      DNS_NETWORK: '{{.GUEST_NETWORK | default "vspheresim"}}'
      DNS_ZONE: '{{.DNS_ZONE | default "estate.stratt.test"}}'
      DNS_PORT: '{{.DNS_PORT | default "15353"}}'
    cmds:
      - docker network inspect {{.DNS_NETWORK}} >/dev/null 2>&1 || docker network create {{.DNS_NETWORK}}
      - docker rm -f stratt-dev-dns >/dev/null 2>&1 || true
      - |
        set -eu
        docker run -d --name stratt-dev-dns \
          --network {{.DNS_NETWORK}} \
          --env-file {{.ROOT_DIR}}/deploy/dev/dns/tsig.env \
          -e STRATT_DNS_ZONE={{.DNS_ZONE}} \
          -p 127.0.0.1:{{.DNS_PORT}}:53/tcp -p 127.0.0.1:{{.DNS_PORT}}:53/udp \
          {{.DNS_IMAGE}} >/dev/null
        echo "dev-dns: {{.DNS_ZONE}} on 127.0.0.1:{{.DNS_PORT}} (container stratt-dev-dns on network {{.DNS_NETWORK}})"

  dev:dns:down:
    desc: Stop the dev authoritative DNS server
    cmds:
      - docker rm -f stratt-dev-dns >/dev/null 2>&1 || true

  dev:dns:proof:
    # The chain ADDR-1 exists for: declare a name -> the plugin writes a REAL record into
    # a REAL authoritative server -> the Syncer reads it back as a reach coordinate ->
    # and then USE it, reaching a vspheresim guest at the name Stratt registered, with
    # that server as the only resolver that knows it.
    #
    # Needs dev:dns:up. It runs its own guest container (the vspheresim guest image — the
    # one machine image this harness has that answers a port) rather than depending on
    # vspheresim itself: what is under test here is the NAME, not the substrate.
    desc: "Prove register -> observe -> REACH -> falsify against real BIND 9 (needs dev:dns:up)"
    deps: [dev:vspheresim:guest-image]
    dir: plugins/dns
    env:
      STRATT_DNS_SERVER: '{{.STRATT_DNS_SERVER | default "127.0.0.1:15353"}}'
      STRATT_DNS_ZONE: '{{.DNS_ZONE | default "estate.stratt.test"}}'
      STRATT_DNS_TSIG_NAME: '{{.DNS_TSIG_NAME | default "stratt-dev"}}'
      # Read from the generated env file rather than passed on a command line (§2.5).
      STRATT_DNS_TSIG_ENV: "{{.ROOT_DIR}}/deploy/dev/dns/tsig.env"
      # Set together with the server so the REACH half is never quietly skipped: a
      # registration proof that passes while nothing was reached is the failure mode
      # this target exists to close.
      STRATT_DNS_GUEST_NETWORK: '{{.GUEST_NETWORK | default "vspheresim"}}'
      STRATT_DNS_GUEST_IMAGE: '{{.GUEST_IMAGE | default "stratt/vspheresim-guest:dev"}}'
      STRATT_DNS_GUEST_KEY: "{{.ROOT_DIR}}/deploy/dev/managed-web/id_ed25519"
    cmds:
      - go test ./ -run LiveDns -v -count=1

  dev:managed-web:up:
    desc: Deploy the REAL sshd/nginx managed node for the ADR-0084 convergence demo (keypair + machine-credential Secret + node, idempotent)
    deps: [tools:kubectl, dev:machine-key]
    vars:
      KEYDIR: "{{.ROOT_DIR}}/deploy/dev/managed-web"
    cmds:
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} export kubeconfig --name {{.KIND_CLUSTER}}
      # The machine credential the remediation Step use-checks + mounts (§2.5).
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt create secret generic web-machine-creds --from-file=ssh-privatekey={{.KEYDIR}}/id_ed25519 --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      # The node's authorized_keys (the public half).
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt create secret generic managed-web-authorized-keys --from-file=authorized_keys={{.KEYDIR}}/id_ed25519.pub --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f {{.ROOT_DIR}}/deploy/dev/managed-web.yaml"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/managed-web --timeout=120s"

  dev:kubecompute:up:
    desc: "Prepare the floor kubecompute BUILDS into (ADR-0151): the built hosts' authorized_keys + the gate-only authz markers"
    deps: [tools:kubectl, dev:machine-key]
    vars:
      KEYDIR: "{{.ROOT_DIR}}/deploy/dev/managed-web"
    cmds:
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} export kubeconfig --name {{.KIND_CLUSTER}}
      # The namespace is normally rendered by the chart (kubecompute's deployNamespace), but this
      # task must also work BEFORE the first helm install — a built host needs its authorized_keys
      # Secret to exist in the namespace at pod-spawn, and a missing Secret makes the pod hang in
      # ContainerCreating with a message about a volume rather than about a key.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} create namespace stratt-hosts --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      # The SAME throwaway dev keypair the hand-declared fixture nodes use, so a host Stratt BUILT
      # is reachable by the credential the converge already brokers (web-machine) rather than by a
      # key minted at build time that nothing else knows about.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt-hosts create secret generic managed-web-authorized-keys --from-file=authorized_keys={{.KEYDIR}}/id_ed25519.pub --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      # GATE-ONLY authz markers (ADR-0052). An Action's CredentialRef use-check is its ONLY authz
      # gate — the core refuses a credential-free Action outright — so `kubecompute/create-host` and
      # `cert-issuer/sign` each need one even though neither brokers material: kubecompute reaches
      # the API through its own ServiceAccount and openbao holds its own CLM token. The Secret is a
      # POINTER the use-check resolves; it carries a marker and never material (§2.5).
      #
      # Created here because the credential-refs that NAME them ship in the estate while nothing
      # created them — a gap that only shows up as a failed Run at the moment an operator launches.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt create secret generic kubecompute-build-authz --from-literal=marker=1 --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt create secret generic cert-issuer-authz --from-literal=marker=1 --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"

  dev:managed-app:up:
    # The BARE node the apache Blueprint converges (ADR-0148). It reuses managed-web's keypair and
    # authorized-keys Secret on purpose — one throwaway dev key for both fixture nodes — so this
    # depends on dev:managed-web:up having created them rather than minting a second.
    #
    # Bare is the point: alpine with sshd and no web server, so "apache is installed" is a fact the
    # remediation CAUSES. managed-web ships nginx already, so its converge can only adjust a port on
    # something the image supplied — which cannot tell those two apart.
    desc: Deploy the BARE sshd node the apache Blueprint installs onto (ADR-0148, idempotent)
    deps: [tools:kubectl, dev:machine-key]
    vars:
      KEYDIR: "{{.ROOT_DIR}}/deploy/dev/managed-web"
    cmds:
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} export kubeconfig --name {{.KIND_CLUSTER}}
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt create secret generic managed-web-authorized-keys --from-file=authorized_keys={{.KEYDIR}}/id_ed25519.pub --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f {{.ROOT_DIR}}/deploy/dev/managed-app.yaml"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/managed-app --timeout=120s"

  dev:managed-tomcat:up:
    # The bare DEBIAN node the tomcat Blueprint converges (ADR-0148). Debian rather than alpine on
    # purpose: with managed-app on apk and this on apt, the claim that distro naming belongs to
    # content is exercised against two package managers instead of asserted against one.
    desc: Deploy the BARE debian node the tomcat Blueprint installs onto (ADR-0148, idempotent)
    deps: [tools:kubectl, dev:machine-key]
    vars:
      KEYDIR: "{{.ROOT_DIR}}/deploy/dev/managed-web"
    cmds:
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} export kubeconfig --name {{.KIND_CLUSTER}}
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt create secret generic managed-web-authorized-keys --from-file=authorized_keys={{.KEYDIR}}/id_ed25519.pub --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f {{.ROOT_DIR}}/deploy/dev/managed-tomcat.yaml"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/managed-tomcat --timeout=180s"

  dev:crossplane:
    desc: Install REAL Crossplane + provider-kubernetes into kind for the topology build loop (ADR-0059, idempotent)
    deps: [tools:helm, tools:kubectl]
    cmds:
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} export kubeconfig --name {{.KIND_CLUSTER}}
      - "{{.HELM}} repo add crossplane-stable https://charts.crossplane.io/stable --force-update"
      - "{{.HELM}} repo update crossplane-stable"
      - >-
        {{.HELM}} --kube-context {{.KIND_CONTEXT}} upgrade --install crossplane
        crossplane-stable/crossplane -n crossplane-system --create-namespace
        --version 2.3.3 --wait --timeout 5m
      # provider-kubernetes with a PINNED runtime SA (so RBAC can target it).
      - |
        cat <<'EOF' | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -
        apiVersion: pkg.crossplane.io/v1beta1
        kind: DeploymentRuntimeConfig
        metadata: { name: provider-kubernetes }
        spec:
          serviceAccountTemplate:
            metadata: { name: provider-kubernetes }
        ---
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        metadata: { name: provider-kubernetes }
        spec:
          package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.17.0
          runtimeConfigRef: { name: provider-kubernetes }
        EOF
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} wait --for=condition=Healthy provider/provider-kubernetes --timeout=180s"
      # The subnet platform: ProviderConfig (InjectedIdentity) + confined provider RBAC.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f {{.ROOT_DIR}}/deploy/dev/crossplane-subnet.yaml"

  dev:install:
    desc: "EXTRAS (advanced): helm-install strattd + all in-cluster plugins into kind, wired to the compose substrate (the plugin-e2e path; genesis uses dev:genesis instead)"
    deps: [tools:helm, tools:kubectl, dev:stage-estate]
    vars:
      GW:
        sh: |
          docker network inspect kind 2>/dev/null | grep -m1 '"Gateway"' | sed 's/.*: *"//; s/".*//'
    cmds:
      # Ensure the kubeconfig context exists (idempotent) before helm/kubectl.
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} export kubeconfig --name {{.KIND_CLUSTER}}
      - |
        set -eu
        GW="{{.GW}}"; GW="${GW:-192.168.102.1}"
        "{{.HELM}}" upgrade --install stratt {{.ROOT_DIR}}/deploy/charts/stratt \
          --kube-context {{.KIND_CONTEXT}} -n stratt --create-namespace \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-dev-kind.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-e2e.yaml \
          --set-string database.url="postgres://stratt:stratt-dev@${GW}:5432/stratt" \
          --set-string nats.url="nats://${GW}:4222" \
          --set-string temporal.address="${GW}:7233" \
          --set-string "plugins[1].env.STRATT_VCENTER_URL=https://${GW}:8989/sdk" \
          --set-string "plugins[1].hostEnv.STRATT_VCENTER_URL=https://${GW}:8989/sdk" \
          --set-string "plugins[2].env.STRATT_AWSEC2_ENDPOINT=http://${GW}:4566"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/stratt --timeout=180s"

  dev:genesis:
    # THE default dev entrypoint (ADR-0102): nothing -> minimal Stratt in kind. kind +
    # the in-cluster spine (Postgres/NATS/Temporal, charter §1.4) + strattd + the in-proc
    # authz evaluator + ONE self-retiring dev-header bootstrap-admin Principal (granted
    # only enough to drive self-deploy — see deploy/dev/genesis-estate). No compose, no
    # tool plugins. From here Stratt self-deploys the rest through its OWN gated helm/deploy
    # loop (dev:genesis:selfdeploy). The self-retiring floor: the boot guard forbids the
    # dev header alongside OIDC, so it cannot persist into the real-authz posture. DEV ONLY.
    desc: THE default dev entrypoint — nothing -> minimal Stratt in kind (spine + strattd + bootstrap-admin), which then self-deploys the rest
    deps: [tools:helm, tools:kubectl]
    cmds:
      - task: dev:kind:up
      - task: image:kind-load
      - task: image:plugin # the self-deploy Actuator Stratt uses to deploy the rest
        vars: {PLUGIN: helm}
      - task: dev:stage-genesis
      - |
        set -eu
        "{{.HELM}}" upgrade --install stratt {{.ROOT_DIR}}/deploy/charts/stratt \
          --kube-context {{.KIND_CONTEXT}} -n stratt --create-namespace \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-allinone.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-selfdeploy.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-genesis.yaml
      # A rebuilt image with the SAME tag is invisible to Kubernetes: the pod spec does not
      # change, so `helm upgrade` leaves the old pod running and `rollout status` happily
      # reports it ready. With pullPolicy: Never that means a code change silently does not
      # take effect — this cost a live demo run, which passed its floor checks against a
      # strattd built hours earlier. Restart explicitly whenever the image was just rebuilt.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout restart deploy/stratt"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/stratt --timeout=240s"

  bootstrap:kind:
    desc: "Alias of dev:genesis (ADR-0102 renamed the minimal-core entrypoint)"
    cmds:
      - task: dev:genesis

  dev:genesis:selfdeploy:
    # Dogfood (ADR-0102): from the genesis floor, have Stratt self-deploy a REAL service —
    # the OpenFGA server (memory mode) — through its own gated helm/deploy loop. Ensures
    # the target namespace exists (the self-deploy plugin's ClusterRole is scoped to
    # workloads, NOT namespace-create — least authority), then launches the
    # genesis-authz-deploy Workflow, approves the platform-admins Gate as bootstrap-admin,
    # and waits for the WorkflowRun to converge. Run AFTER `task dev:genesis`.
    desc: "Dogfood: Stratt self-deploys the real OpenFGA server via its own gated helm/deploy loop"
    deps: [tools:kubectl]
    cmds:
      # The stratt-authz namespace is created by the chart (deployNamespace); here we just
      # seed the gate-marker Secret the gateOnly CredentialRef points at (pointer, no material).
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt-authz create secret generic helm-deploy-authz --from-literal=marker=1 --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      - KUBECONTEXT={{.KIND_CONTEXT}} KUBECTL={{.KUBECTL}} bash {{.ROOT_DIR}}/deploy/dev/genesis-selfdeploy.sh

  demo:k8s-deploy:stage:
    # Stage the k8s-deploy demo's SELF-CONTAINED estate (ADR-0116) into the inline-declarations
    # path — its authz grant + helm Actuator + gate-only CredentialRef + deploy-hello Workflow +
    # hello View. Same mirror-exactly mechanism as dev:stage-genesis, different source: the floor
    # boots with the demo's whole desired state as CaC (actuators/credential-refs are CaC-only,
    # §2.2/2.3 — never `stratt apply`), which the reconcile controller then enforces.
    desc: Stage the k8s-deploy demo estate into the inline-declarations path
    cmds:
      - rm -rf {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - mkdir -p {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - cp -R {{.ROOT_DIR}}/plugins/helm/demo/estate/. {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations/
      - task: demo:vendor-contracts
        vars: { DEMO: k8s-deploy, ESTATE: "{{.ROOT_DIR}}/plugins/helm/demo/estate" }

  demo:k8s-deploy:run:
    # The turnkey "k8s: deploy an app" demo (ADR-0116, the first demos/ scenario). Stands up a Stratt
    # floor whose desired state IS the demo estate (kind + spine + strattd + the helm plugin + the
    # staged CaC), then drives its gated deploy-hello Workflow end to end — approve the platform-admins
    # gate as bootstrap-admin, converge the WorkflowRun, assert the real `hello` Deployment is Ready.
    # The hello-stratt chart rides the helm plugin image (image:plugin PLUGIN=helm). By-hand walk:
    # plugins/helm/demo/README.md. Teardown: demo:k8s-deploy:down (full nuke: dev:kind:down).
    desc: "Demo — stand up a floor and deploy a real app through a gated Workflow (plugins/helm/demo)"
    deps: [tools:helm, tools:kubectl]
    cmds:
      - task: dev:kind:up
      - task: image:kind-load
      - task: image:plugin # the helm Actuator + the baked hello-stratt chart
        vars: {PLUGIN: helm}
      - task: demo:k8s-deploy:stage
      - |
        set -eu
        "{{.HELM}}" upgrade --install stratt {{.ROOT_DIR}}/deploy/charts/stratt \
          --kube-context {{.KIND_CONTEXT}} -n stratt --create-namespace \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-allinone.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-selfdeploy.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-genesis.yaml
      # A rebuilt image with the SAME tag is invisible to Kubernetes: the pod spec does not
      # change, so `helm upgrade` leaves the old pod running and `rollout status` happily
      # reports it ready. With pullPolicy: Never that means a code change silently does not
      # take effect — this cost a live demo run, which passed its floor checks against a
      # strattd built hours earlier. Restart explicitly whenever the image was just rebuilt.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout restart deploy/stratt"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/stratt --timeout=240s"
      # The gate-only CredentialRef points at this marker Secret (pointer, no material).
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt-authz create secret generic helm-deploy-authz --from-literal=marker=1 --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      - KUBECONTEXT={{.KIND_CONTEXT}} KUBECTL={{.KUBECTL}} bash {{.ROOT_DIR}}/plugins/helm/demo/run.sh

  demo:k8s-deploy:down:
    # Tear down JUST the demo's footprint — uninstall the `hello` release (Deployment +
    # Service + ConfigMap + release Secret) via the in-cluster helm the plugin used, leaving
    # the genesis floor up so `demo:k8s-deploy:run` can re-run fast. Idempotent: a missing
    # release is not an error. For a FULL teardown (nuke the cluster) use `task dev:kind:down`.
    desc: "Demo teardown — uninstall the hello release, leave the genesis floor up (full nuke: dev:kind:down)"
    cmds:
      - "{{.HELM}} uninstall hello -n demo --kube-context {{.KIND_CONTEXT}} --ignore-not-found"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n demo get deploy,svc,cm -l app.kubernetes.io/name=hello 2>/dev/null || true"

  demo:vsphere-only:stage:
    # Stage the vsphere-only demo's SELF-CONTAINED estate (ADR-0116) into the inline-declarations
    # path — its authz grant + gate-only vsphere-dev CredentialRef + vsphere-vm-build Workflow +
    # the dev-vms/availability-zones/datastores Views. Delivered as CaC through the declarations
    # mount the reconcile controller enforces.
    #
    # The estate now carries its OWN vcenter Actuator, and must. The comment here used to say the
    # Actuator/Actions were boot-wired via hostEnv so no actuator file was needed — ADR-0103 moved
    # them to a declaration, and this demo, whose estate is a separate tree, was left naming an
    # Action nothing declared. The floor could not boot.
    desc: Stage the vsphere-only demo estate into the inline-declarations path
    cmds:
      - rm -rf {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - mkdir -p {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - cp -R {{.ROOT_DIR}}/plugins/vcenter/demo/estate/. {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations/
      - task: demo:vendor-contracts
        vars: { DEMO: vsphere-only, ESTATE: "{{.ROOT_DIR}}/plugins/vcenter/demo/estate" }

  demo:vsphere-only:run:
    # The turnkey "vSphere: provision a VM + watch the graph come alive" demo (ADR-0116). Stands up a
    # vSphere-only Stratt floor — kind + spine + strattd + the vcenter plugin + an external vspheresim (a real
    # vCenter API) seeded with an enterprise topology + the staged CaC estate — then drives BOTH halves:
    # the vcenter Syncer projects the vspheresim topology into a live graph (Views come alive), and a gated
    # Workflow provisions a new VM through vcenter/create-vm. By-hand walk: plugins/vcenter/demo/README.md.
    desc: "Demo — stand up a vSphere floor, project the graph, and provision a VM through a gated Workflow"
    deps: [tools:helm, tools:kubectl, dev:vspheresim:guest-image]
    cmds:
      - task: dev:kind:up
      # vspheresim runs as a compose service on the host; the plugin reaches it on the kind host-gateway.
      # force-recreate so every run starts from a clean default topology (no leftover web-01).
      - docker compose -f {{.ROOT_DIR}}/deploy/dev/docker-compose.yml up -d --force-recreate --wait vspheresim
      - task: image:kind-load
      - task: image:plugin # the vcenter Syncer; create-vm is registered by the demo's Actuator
        vars: {PLUGIN: vcenter}
      - task: demo:vsphere-only:stage
      - |
        set -eu
        "{{.HELM}}" upgrade --install stratt {{.ROOT_DIR}}/deploy/charts/stratt \
          --kube-context {{.KIND_CONTEXT}} -n stratt --create-namespace \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-allinone.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-genesis.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-demo-vsphere.yaml
      # A rebuilt image with the SAME tag is invisible to Kubernetes: the pod spec does not
      # change, so `helm upgrade` leaves the old pod running and `rollout status` happily
      # reports it ready. With pullPolicy: Never that means a code change silently does not
      # take effect — this cost a live demo run, which passed its floor checks against a
      # strattd built hours earlier. Restart explicitly whenever the image was just rebuilt.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout restart deploy/stratt"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/stratt --timeout=240s"
      # The gate-only vsphere-dev CredentialRef points at this marker Secret (pointer, no material).
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt create secret generic vsphere-dev-authz --from-literal=marker=1 --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      - KUBECONTEXT={{.KIND_CONTEXT}} KUBECTL={{.KUBECTL}} bash {{.ROOT_DIR}}/plugins/vcenter/demo/run.sh

  demo:vsphere-only:down:
    # Tear down the vsphere-only demo: uninstall the stratt release and stop the vspheresim substrate
    # (kind cluster kept for a fast re-run; full nuke: `task dev:kind:down`). Idempotent.
    desc: "Demo teardown — uninstall stratt + stop vspheresim (full nuke: dev:kind:down)"
    cmds:
      - "{{.HELM}} uninstall stratt -n stratt --kube-context {{.KIND_CONTEXT}} --ignore-not-found 2>/dev/null || true"
      - docker compose -f {{.ROOT_DIR}}/deploy/dev/docker-compose.yml stop vspheresim 2>/dev/null || true

  demo:ec2-only:stage:
    # Stage the ec2-only demo's SELF-CONTAINED estate (ADR-0116) into the inline-declarations path —
    # its authz grant + gate-only aws-dev CredentialRef + compute-build Workflow + the provisioned-instances
    # View. The instance SYNCER is boot-wired via the plugin's hostEnv (values-demo-ec2); the Actions
    # are not — ADR-0103 moved them into an Actuator declaration, so the estate carries one. Saying
    # otherwise here is what left this demo dispatching an Action nothing registered. Delivered as CaC.
    desc: Stage the ec2-only demo estate into the inline-declarations path
    cmds:
      - rm -rf {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - mkdir -p {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - cp -R {{.ROOT_DIR}}/plugins/awsec2/demo/estate/. {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations/
      - task: demo:vendor-contracts
        vars: { DEMO: ec2-only, ESTATE: "{{.ROOT_DIR}}/plugins/awsec2/demo/estate" }

  demo:ec2-only:run:
    # The turnkey "EC2: provision a real instance" demo (ADR-0116). Stands up an EC2-only Stratt floor —
    # kind + spine + strattd + the awsec2 plugin + an external floci (a real-host EC2 backend that runs
    # real instance containers with a real network model; NOT SSH-able — ADR-0093, HAR-1) + the staged
    # CaC estate — then drives a gated Workflow
    # that provisions a REAL instance via awsec2/create-vm; the awsec2 Syncer observes it into the graph.
    # By-hand walk: plugins/awsec2/demo/README.md.
    desc: "Demo — stand up an EC2 floor (floci) and provision a real instance through a gated Workflow"
    deps: [tools:helm, tools:kubectl]
    cmds:
      - task: dev:kind:up
      # floci runs as a compose service on the host; the plugin reaches its EC2 API on the kind
      # host-gateway. force-recreate so every run starts clean (no leftover instances).
      - docker compose -f {{.ROOT_DIR}}/deploy/dev/docker-compose.yml up -d --force-recreate --wait floci
      - task: image:kind-load
      - task: image:plugin # the awsec2 create-vm Action + the instance Syncer
        vars: {PLUGIN: awsec2}
      - task: demo:ec2-only:stage
      - |
        set -eu
        "{{.HELM}}" upgrade --install stratt {{.ROOT_DIR}}/deploy/charts/stratt \
          --kube-context {{.KIND_CONTEXT}} -n stratt --create-namespace \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-allinone.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-genesis.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-demo-ec2.yaml
      # A rebuilt image with the SAME tag is invisible to Kubernetes: the pod spec does not
      # change, so `helm upgrade` leaves the old pod running and `rollout status` happily
      # reports it ready. With pullPolicy: Never that means a code change silently does not
      # take effect — this cost a live demo run, which passed its floor checks against a
      # strattd built hours earlier. Restart explicitly whenever the image was just rebuilt.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout restart deploy/stratt"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/stratt --timeout=240s"
      # The gate-only aws-dev CredentialRef points at this marker Secret (pointer, no material).
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt create secret generic aws-dev-authz --from-literal=marker=1 --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      - KUBECONTEXT={{.KIND_CONTEXT}} KUBECTL={{.KUBECTL}} bash {{.ROOT_DIR}}/plugins/awsec2/demo/run.sh

  demo:ec2-only:down:
    # Tear down the ec2-only demo: uninstall the stratt release and stop the floci substrate (which
    # also stops the instance containers it spawned). kind cluster kept for a fast re-run; full nuke:
    # `task dev:kind:down`. Idempotent.
    desc: "Demo teardown — uninstall stratt + stop floci (full nuke: dev:kind:down)"
    cmds:
      - "{{.HELM}} uninstall stratt -n stratt --kube-context {{.KIND_CONTEXT}} --ignore-not-found 2>/dev/null || true"
      - docker compose -f {{.ROOT_DIR}}/deploy/dev/docker-compose.yml stop floci 2>/dev/null || true

  demo:vendor-contracts:
    # Vendor a demo's contractsOnly plugin admissions into the staged declarations (ADR-0138 D3/D4).
    #
    # Since the relocation, a plugin's Action/Actuator Contracts live in the PLUGIN's tree, and core
    # holds only what the estate admits — a plugin wired by environment never contributes its
    # documents, because the Manifest carries a schema ID and hash, never the schema (§1.5: a plugin
    # does not mint contract meaning). So a demo that dispatches a plugin-owned Action must ADMIT the
    # plugin, and the tree has to travel with the staged estate: in the repo the admission is a
    # relative path out of the demo directory, and a deployed estate is self-contained.
    #
    # Without this the demo stages cleanly, `task ci` stays green (it parses from the repo, where the
    # relative path resolves), and the daemon fails in-cluster on "no input contract". ONLY RUNNING
    # THE DEMO CATCHES IT — which is how the vsphere demo sat broken from ADR-0103 moving vcenter's
    # Actions into a declaration until the next time anyone ran it.
    #
    # One implementation, called by every demo that needs it. It was app-cert's inline shell block,
    # and a second copy for vsphere would have been the divergent-copy defect this repo keeps paying
    # for — with the twist that the copies would drift in the one dimension that decides whether a
    # floor boots.
    internal: true
    requires:
      vars: [DEMO, ESTATE]
    cmds:
      - |
        set -eu
        src="{{.ESTATE}}/plugins.yaml"
        dst="{{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations"
        [ -f "$src" ] || exit 0
        names=$(awk '/^[[:space:]]*-[[:space:]]*name:/{gsub(/.*name:[[:space:]]*/,"");print}' "$src")
        : > "$dst/plugins.yaml"
        echo "# GENERATED by 'task demo:{{.DEMO}}:stage' — edit {{.ESTATE}}/plugins.yaml." >> "$dst/plugins.yaml"
        echo "plugins:" >> "$dst/plugins.yaml"
        for n in $names; do
          [ -d "{{.ROOT_DIR}}/plugins/$n/contracts" ] || {
            echo "✗ {{.DEMO}} admits plugin '$n' but plugins/$n/contracts does not exist" >&2; exit 1; }
          mkdir -p "$dst/plugins/$n/contracts"
          cp -R "{{.ROOT_DIR}}/plugins/$n/contracts/." "$dst/plugins/$n/contracts/"
          echo "  - name: $n" >> "$dst/plugins.yaml"
          echo "    path: plugins/$n/estate" >> "$dst/plugins.yaml"
          echo "    contractsOnly: true" >> "$dst/plugins.yaml"
          echo "  ✓ vendored plugin contracts: $n"
        done

  demo:app-cert:stage:
    # Stage the app-cert demo's SELF-CONTAINED estate (ADR-0116) into the inline-declarations path —
    # its authz grants + the app-node-ssh machine CredentialRef + the app-nodes View + the declared
    # Syncer + hosts/app-node.yaml + the ansible-crypto Actuator (the ADR-0117 D3a declaration that
    # selects the crypto EE) + both Workflows. hosts/** is picked up by the declared plugin's
    # estateHosts mount. Delivered as CaC — actuators/connectors/credential-refs are CaC-only.
    desc: Stage the app-cert demo estate into the inline-declarations path
    cmds:
      - rm -rf {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - mkdir -p {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations
      - cp -R {{.ROOT_DIR}}/demos/app-cert/estate/. {{.ROOT_DIR}}/deploy/charts/stratt/dev/declarations/
      # VENDOR the contractsOnly admissions (ADR-0138 D3/D4). The demo declares its own
      # `ansible-crypto` Actuator with pluginIdentity: ansible, and since the relocation that
      # Actuator's input Contract lives in the ansible PLUGIN's tree — so the demo admits ansible
      # contractsOnly. In the repo that admission is a relative path out of the demo directory; a
      # DEPLOYED estate is self-contained, so the tree has to travel with it and the path has to be
      # rewritten, exactly as dev:stage-estate vendors the full admissions.
      #
      # Without this the demo stages cleanly, `task ci` stays green (it parses from the repo, where
      # the relative path resolves), and the daemon CrashLoops in-cluster on "no input contract for
      # actuator ansible-crypto". Only running the demo catches it.
      - task: demo:vendor-contracts
        vars: { DEMO: app-cert, ESTATE: "{{.ROOT_DIR}}/demos/app-cert/estate" }

  demo:app-cert:node:up:
    # The demo's managed host: a real sshd + nginx node with root login DISABLED and
    # py3-cryptography installed, so `become` is load-bearing and community.crypto's modules can
    # run on the target. Separate from dev:managed-web:up so the two fixtures cannot perturb each
    # other. Idempotent — a throwaway keypair is generated once and reused.
    desc: Stand up the app-cert demo's managed node (sshd + nginx + sudo, non-root login)
    deps: [tools:kubectl]
    vars:
      KEYDIR: "{{.ROOT_DIR}}/deploy/dev/app-cert"
    cmds:
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} export kubeconfig --name {{.KIND_CLUSTER}}
      # A throwaway ed25519 keypair: the PRIVATE half rides the app-node-ssh CredentialRef, the
      # PUBLIC half becomes the node's authorized_keys. Material is git-ignored, never committed (§2.5).
      - mkdir -p {{.KEYDIR}}
      - test -f {{.KEYDIR}}/id_ed25519 || ssh-keygen -t ed25519 -N "" -C stratt-app-cert -f {{.KEYDIR}}/id_ed25519
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt create secret generic app-node-creds --from-file=ssh-privatekey={{.KEYDIR}}/id_ed25519 --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt create secret generic app-node-authorized-keys --from-file=authorized_keys={{.KEYDIR}}/id_ed25519.pub --dry-run=client -o yaml | {{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f -"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} apply -f {{.ROOT_DIR}}/demos/app-cert/node.yaml"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/app-node --timeout=180s"

  demo:app-cert:run:
    # The turnkey "app install with a certificate" demo (ADR-0116; the scenario ADR-0117 was written
    # for). Stands up a Stratt floor whose desired state IS this demo's estate, plus the crypto EE
    # image and a real managed node, then drives the gated Workflow end to end: approve, SSH in as an
    # unprivileged user, escalate, mint a certificate with community.crypto, install the app on it,
    # write the observed state back — and then prove that a play reaching no host FAILS.
    # By-hand walk: demos/app-cert/README.md. Teardown: demo:app-cert:down.
    desc: "Demo — install an app with a TLS certificate on a real host through a gated Workflow (demos/app-cert)"
    deps: [tools:helm, tools:kubectl]
    cmds:
      - task: dev:kind:up
      - task: image:kind-load
      - task: image:plugin # the Syncer that projects the demo's declared host
        vars: {PLUGIN: declared}
      # The purpose-built EE: community.crypto installed and version-verified at BUILD time
      # (ADR-0117 D3). Built and kind-loaded HERE because nothing else would catch a missing
      # image — an EE-Job Actuator is reported healthy without any image check (ADR-0117 l).
      - task: dev:ee-crypto:build
      - task: demo:app-cert:stage
      - |
        set -eu
        "{{.HELM}}" upgrade --install stratt {{.ROOT_DIR}}/deploy/charts/stratt \
          --kube-context {{.KIND_CONTEXT}} -n stratt --create-namespace \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-allinone.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-genesis.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-demo-app-cert.yaml
      # A rebuilt image with the SAME tag is invisible to Kubernetes: the pod spec does not
      # change, so `helm upgrade` leaves the old pod running and `rollout status` happily
      # reports it ready. With pullPolicy: Never that means a code change silently does not
      # take effect — this cost a live demo run, which passed its floor checks against a
      # strattd built hours earlier. Restart explicitly whenever the image was just rebuilt.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout restart deploy/stratt"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/stratt --timeout=240s"
      - task: demo:app-cert:node:up
      - KUBECONTEXT={{.KIND_CONTEXT}} KUBECTL={{.KUBECTL}} bash {{.ROOT_DIR}}/demos/app-cert/run.sh

  demo:app-cert:down:
    # Tear down the app-cert demo: uninstall the stratt release and delete the managed node (and its
    # Secrets — throwaway key material). kind cluster kept for a fast re-run; full nuke:
    # `task dev:kind:down`. Idempotent.
    desc: "Demo teardown — uninstall stratt + delete the managed node (full nuke: dev:kind:down)"
    cmds:
      - "{{.HELM}} uninstall stratt -n stratt --kube-context {{.KIND_CONTEXT}} --ignore-not-found 2>/dev/null || true"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} delete -f {{.ROOT_DIR}}/demos/app-cert/node.yaml --ignore-not-found 2>/dev/null || true"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt delete secret app-node-creds app-node-authorized-keys --ignore-not-found 2>/dev/null || true"

  dev:promote:authz:
    # Genesis -> real-authz promotion, BACKEND axis (ADR-0102, docs/runbooks/genesis-to-authz.md):
    # point strattd's authz backend at the self-deployed OpenFGA server (in-proc -> server).
    # ONE strattd restart (backend selection is boot-time env); on boot SyncTuples pushes the
    # CaC tuples into the fresh server. Dev-header identity is RETAINED (legal — the boot guard
    # forbids only dev-header + OIDC). Run AFTER dev:genesis:selfdeploy. The full OIDC identity
    # flip (dev-header -> OpenBao) is the ADR-0101 follow-up.
    desc: "Promote authz backend in-proc -> the self-deployed OpenFGA server (one strattd restart)"
    deps: [tools:helm, tools:kubectl]
    cmds:
      - |
        set -eu
        "{{.HELM}}" upgrade --install stratt {{.ROOT_DIR}}/deploy/charts/stratt \
          --kube-context {{.KIND_CONTEXT}} -n stratt \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-allinone.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-selfdeploy.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-genesis.yaml \
          --set-string externalOpenfga.url=http://openfga.stratt-authz.svc:8080
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/stratt --timeout=240s"

  dev:connector-e2e:
    # ADR-0103 S7: the FULLY IN-KIND runtime-registry proof — NO compose. kind + the
    # in-cluster substrate (values-allinone) + the helm Actuator + declared Syncer plugin
    # pods + the full estate; the runtime Connector/Actuator registry dials + registers them
    # from estate/{actuators/helm,connectors/declared}.yaml with no strattd restart. From
    # here: edit a Connector declaration and watch the registry enable/disable it live
    # (GET /connectors, GET /actuators) while the strattd pod's start time never changes.
    desc: "ADR-0103: fully in-kind runtime-registry proof (no compose) — substrate + helm/declared plugins + estate"
    deps: [tools:helm, tools:kubectl]
    cmds:
      - task: dev:kind:up
      - task: image:kind-load # strattd
      - task: image:plugin
        vars: {PLUGIN: helm}
      - task: image:plugin
        vars: {PLUGIN: declared}
      # kubeservices is admitted by estate/plugins.yaml now (ADR-0148 follow-up b), so the floor
      # has to carry its pod or the registry reports a Connector that will not verify.
      - task: image:plugin
        vars: {PLUGIN: kubeservices}
      # The certificate leg's provider (CERT-1) and the network leg's builder plus its statestore
      # dependency (ADR-0145). Each was declared in the estate with a dial address and deployed by
      # no floor, so each sat permanently unverified — which reads as "the backend is down".
      - task: image:plugin
        vars: {PLUGIN: openbao}
      - task: image:plugin
        vars: {PLUGIN: opentofu}
      - task: image:plugin
        vars: {PLUGIN: awss3}
      - task: image:plugin
        vars: {PLUGIN: netbox}
      - task: dev:stage-estate # full estate incl. connectors/actuators
      - |
        set -eu
        "{{.HELM}}" upgrade --install stratt {{.ROOT_DIR}}/deploy/charts/stratt \
          --kube-context {{.KIND_CONTEXT}} -n stratt --create-namespace \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-allinone.yaml \
          -f {{.ROOT_DIR}}/deploy/charts/stratt/values-connector-e2e.yaml
      # A rebuilt image with the SAME tag is invisible to Kubernetes: the pod spec does not
      # change, so `helm upgrade` leaves the old pod running and `rollout status` happily
      # reports it ready. With pullPolicy: Never that means a code change silently does not
      # take effect — this cost a live demo run, which passed its floor checks against a
      # strattd built hours earlier. Restart explicitly whenever the image was just rebuilt.
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout restart deploy/stratt"
      - "{{.KUBECTL}} --context {{.KIND_CONTEXT}} -n stratt rollout status deploy/stratt --timeout=240s"

  dev:stack:up:
    desc: "EXTRAS (turnkey plugin-e2e stack): compose substrate + kind + all plugin images + helm-install (opt-in; genesis is the minimal default)"
    deps: [dev:kind:up, dev:vspheresim:guest-image]
    cmds:
      # Only the substrate the plugin e2e actually needs — Postgres (graph),
      # NATS (bus), Temporal (orchestration), vspheresim (the vcenter Syncer's SoR).
      # Scoping this away from the full `dev:up` keeps the turnkey path off the
      # kitchen-sink extras (zot registry, zitadel, …) a plugin run never touches.
      - docker compose -f deploy/dev/docker-compose.yml up -d --wait postgres nats temporal vspheresim floci openbao
      - task: image:kind-load
      - task: dev:ee:build
      - task: image:plugin
        vars: {PLUGIN: vcenter}
      - task: image:plugin
        vars: {PLUGIN: declared}
      - task: image:plugin
        vars: {PLUGIN: awsec2}
      - task: dev:install

  dev:stack:down:
    desc: Uninstall the stack release and stop the substrate (keep volumes)
    cmds:
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} export kubeconfig --name {{.KIND_CLUSTER}} 2>/dev/null || true
      - "{{.HELM}} uninstall stratt --kube-context {{.KIND_CONTEXT}} -n stratt 2>/dev/null || true"
      - task: dev:down

  dev:stack:nuke:
    desc: Full teardown — uninstall, delete the kind cluster, and drop substrate volumes
    cmds:
      - task: dev:stack:down
      - task: dev:kind:down
      - task: dev:nuke

  e2e:seed:
    desc: Seed one synthetic dev-host Entity for the actuator e2e (Normalizer seam, §1.2)
    dir: core
    env:
      STRATT_DATABASE_URL: '{{.STRATT_DATABASE_URL | default "postgres://stratt:stratt-dev@localhost:5432/stratt"}}'
    cmds:
      - go run ./cmd/stratt-dev-seed

  e2e:plugin:actuator:
    desc: Prove the script+ansible EE-Job Actuators run as governed K8s Jobs in kind (needs dev:stack:up)
    dir: core
    cmds:
      - task: e2e:seed
      - go run ./cmd/stratt-dev-assert -mode=actuator -context={{.KIND_CONTEXT}}

  e2e:plugin:syncer:
    desc: Prove the vcenter gRPC Syncer plugin projects vspheresim Entities + actuator on real targets (needs dev:stack:up)
    dir: core
    cmds:
      - go run ./cmd/stratt-dev-assert -mode=syncer -context={{.KIND_CONTEXT}}

  e2e:plugin:devices:
    desc: Prove devices-as-code — estate/hosts/*.yaml projects into the linux-fleet View via the declared-estate plugin (needs dev:stack:up)
    dir: core
    cmds:
      - go run ./cmd/stratt-dev-assert -mode=devices -context={{.KIND_CONTEXT}}

  e2e:plugin:
    desc: Full functional plugin e2e in kind — actuator (EE-Job) + syncer (gRPC) + devices-as-code (static-inv). Run after `task dev:stack:up`.
    cmds:
      - task: e2e:plugin:actuator
      - task: e2e:plugin:syncer
      - task: e2e:plugin:devices

  dev:ee:build:
    desc: Build the dev EE image and load it into the kind cluster
    cmds:
      # Context is the repo root: the multi-stage build compiles the stratt-ansible
      # shim (ADR-0051) from plugins/ansible + sdk before baking the EE runtime.
      - docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} -f ee/Dockerfile -t stratt-ee:dev .
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} load docker-image stratt-ee:dev --name {{.KIND_CLUSTER}}

  ee:content:check:
    desc: Fail if any EE content declaration is unpinned, unlocked, or drops the platform floor (ADR-0117 D3/i, ANS-012)
    cmds:
      # The SAME implementation the EE build runs (ee/content.py), so CI and the image
      # cannot disagree about what "pinned" means. uv supplies pyyaml without adding a
      # repo dependency (.claude/rules/backend-python.md — uv is the only sanctioned
      # Python package manager, and this content is EE-side, never the control plane).
      #
      # This is the WEAKER of the two lock gates and says so: verifying a content hash means
      # installing the artifact, which means the network, which a pin check must not need. So
      # it asserts every declared artifact IS locked at the declared version (the mistake
      # that actually happens — bump a version, forget to relock) and leaves the hashes to
      # the build, which is where they can be computed from real bytes.
      - uv run --quiet --with pyyaml=={{.PYYAML_VER}} python ee/content.py verify ee/content/*.requirements.yml

  ee:content:lock:
    desc: "(Re)generate an EE content lockfile from a real install — review the diff before committing (ADR-0117 i)"
    vars:
      CONTENT: '{{.CONTENT | default "crypto.requirements.yml"}}'
    cmds:
      # Writing a lockfile requires ACTUALLY INSTALLING the content, because the hash is over
      # the bytes the registry served — there is no offline way to know them. So this runs the
      # real EE build with EE_LOCK_MODE=write (which verifies nothing) and copies the result
      # back out of the image.
      #
      # Regenerating is a DELIBERATE, reviewable act, never part of a build or of `task ci`:
      # an automatic relock would launder exactly the event the lockfile exists to catch —
      # the same version resolving to different bytes — into a silent no-op. Commit the diff
      # only once you know why it changed.
      - |
        set -eu
        content="{{.CONTENT}}"
        lock="${content%.yml}.lock.json"
        test -f "ee/content/${content}" || { echo "no such declaration: ee/content/${content}"; exit 1; }
        docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} -f ee/Dockerfile \
          --build-arg "EE_CONTENT=${content}" --build-arg EE_LOCK_MODE=write \
          -t "stratt-ee-relock:tmp" .
        docker run --rm "stratt-ee-relock:tmp" cat "/usr/share/stratt/ee-content/${lock}" > "ee/content/${lock}"
        docker image rm "stratt-ee-relock:tmp" >/dev/null
        echo "wrote ee/content/${lock} — REVIEW THE DIFF before committing:"
        git --no-pager diff --stat -- "ee/content/${lock}" || true

  ee:content:pull:
    desc: "Download declared collections for an AIR-GAPPED EE build (ADR-0124 D2) — never relocks"
    vars:
      CONTENT: '{{.CONTENT | default "crypto.requirements.yml"}}'
      OUT: '{{.OUT | default "artifacts"}}'
    cmds:
      # Run this on a CONNECTED machine, then copy ee/content/<OUT>/ to the air-gapped builder and
      # build with EE_OFFLINE=<OUT>. Deliberately not a relock: it fetches the declared versions and
      # stops, so the lockfile stays what git says and the offline install verifies against it
      # exactly as an online one does. A pull that relocked would launder the very event the
      # lockfile exists to catch (ADR-0117 i).
      - uv run --quiet --with pyyaml=={{.PYYAML_VER}} python ee/content.py pull
          --artifacts ee/content/{{.OUT}} ee/content/{{.CONTENT}}

  ee:factory:requirements:
    desc: "Read an ansible-builder execution-environment.yml and report what carries over (ADR-0124 D1)"
    vars:
      EE: '{{.EE}}'
    cmds:
      # The compatibility front door: an operator arriving from AAP has this file. This prints the
      # Galaxy requirements it declares — feed them to the pinned pipeline — and names on stderr
      # every section that does NOT carry over, rather than producing an image quietly missing it.
      - 'test -n "{{.EE}}" || { echo "usage: task ee:factory:requirements EE=path/to/execution-environment.yml" >&2; exit 1; }' 
      - uv run --quiet --with pyyaml=={{.PYYAML_VER}} python ee/content.py ee-requirements {{.EE}}

  dev:ee-crypto:build:
    desc: Build the crypto-content EE variant and load it into the kind cluster (ADR-0117 D3/D3a)
    cmds:
      # Same Dockerfile as the base EE — content is selected by build ARG, not by a fork
      # of the image definition. The declared collections are installed at BUILD time, the
      # resolved set is verified against the pins, and each artifact's SHA-256 is verified
      # against ee/content/crypto.requirements.lock.json (ee/content.py).
      - docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} --build-arg EE_CONTENT=crypto.requirements.yml -f ee/Dockerfile -t stratt-ee-crypto:dev .
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} load docker-image stratt-ee-crypto:dev --name {{.KIND_CLUSTER}}

  dev:ee-mcp:build:
    desc: Build the MCP EE image and load it into the kind cluster (ADR-0022)
    cmds:
      # Context is the repo root: the multi-stage build compiles the stratt-mcp shim
      # (ADR-0053) from plugins/mcp + sdk before baking the sandbox runtime.
      - docker build --build-arg GO_PARALLEL={{.GO_PARALLEL}} -f ee/mcp.Dockerfile -t stratt-ee-mcp:dev .
      - go run sigs.k8s.io/kind@v{{.KIND_VER}} load docker-image stratt-ee-mcp:dev --name {{.KIND_CLUSTER}}

  generate:
    desc: Regenerate code from specs (OpenAPI → server stubs + UI types, ADR-0006/0012; proto → plugin port, ADR-0046)
    cmds:
      - cd core && go generate ./...
      - cd ui && npm run generate
      - task: proto:generate

  generate:check:
    desc: Fail if generated code is stale relative to the spec (CI gate, ADR-0006)
    cmds:
      - task: generate
      - git diff --exit-code -- '**/*.gen.go' 'ui/src/api/schema.d.ts'

  adr:index:
    desc: Regenerate the ADR knowledge-graph map (docs/adr/MAP.md) from topics.json (ADR-0109)
    cmds:
      - go run ./tools/adrmap

  adr:index:check:
    desc: Fail if the ADR map is stale or an ADR is untagged (CI gate, ADR-0109)
    cmds:
      - go run ./tools/adrmap -check

  proto:generate:
    desc: Regenerate Go bindings from the sovereign plugin port proto (ADR-0046 Phase A)
    dir: proto
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v{{.PROTOC_GEN_GO_VER}}
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v{{.PROTOC_GEN_GO_GRPC_VER}}
      - PATH="$(go env GOPATH)/bin:$PATH" go run github.com/bufbuild/buf/cmd/buf@v{{.BUF_VER}} generate

  proto:check:
    desc: Lint + no-breaking-change gate for the plugin port; fail if bindings are stale (ADR-0046 inv#5)
    cmds:
      - cd proto && go run github.com/bufbuild/buf/cmd/buf@v{{.BUF_VER}} lint
      - cd proto && go run github.com/bufbuild/buf/cmd/buf@v{{.BUF_VER}} build
      - task: proto:breaking
      - task: proto:generate
      - git diff --exit-code -- sdk

  proto:breaking:
    desc: Enforce additive-only evolution of the plugin port vs main (ADR-0046 inv#5 / §1.7 anti-fossilization)
    dir: proto
    silent: true
    cmds:
      - |
        set -eu
        out=$(go run github.com/bufbuild/buf/cmd/buf@v{{.BUF_VER}} breaking --against '../.git#branch=main,subdir=proto' 2>&1) || {
          printf '%s\n' "$out" | grep -q 'no .proto files' && { echo "✓ proto:breaking — no baseline on main yet (first introduction of the port); gate engages once merged"; exit 0; }
          printf '%s\n' "$out"; exit 1
        }
        echo "✓ proto:breaking — no breaking changes vs main"

  ui:dev:
    desc: Vite dev server on :5173, /api proxied to strattd :8080 (ADR-0012)
    dir: ui
    cmds:
      - npm run dev

  ui:build:
    desc: Build the UI (serve via STRATT_UI_DIR=ui/dist)
    dir: ui
    cmds:
      - npm run build

  ui:lint:
    desc: ESLint the UI (0 warnings; ADR-0090)
    dir: ui
    cmds:
      - npm run lint

  ui:typecheck:
    desc: Type-check the UI (tsc, ADR-0090)
    dir: ui
    cmds:
      - npm run typecheck

  ui:test:
    desc: Run the UI unit tests (vitest, ADR-0090)
    dir: ui
    cmds:
      - npm run test

  ui:ci:
    desc: UI gate — typecheck + lint + tests + build (ADR-0090). Runs in the aggregate `ci`.
    cmds:
      - task: ui:typecheck
      - task: ui:lint
      - task: ui:test
      - task: ui:build
