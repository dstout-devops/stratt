# values-demo-region-to-cert.yaml — the floor the capstone demo runs on (ADR-0116).
#
# Layer on values-allinone.yaml (in-cluster Postgres/NATS/Temporal), so the whole thing stands up
# from nothing in one kind cluster with no compose services.
#
# FIVE PLUGIN PODS, one per capability the demo's Intents resolve to. There is no sixth for
# `ansible`: an ansible Actuator runs on the EE-Job transport — a Kubernetes Job spawned per Run from
# a declared execution-environment image — not as a long-lived plugin pod. Two transports beneath one
# sovereign contract (§1.5), and the estate above them cannot tell which is which.

declarations:
  inline:
    enabled: true
    interval: "10s" # tighten the reconcile so a staged estate change goes live fast
    maxPruneFraction: "1"

environment: dev

plugins:
  # The `provisioning` provider for Intent/Compute on the kubernetes substrate — the demo's LEG 2.
  - name: kubecompute
    image:
      repository: stratt-plugin-kubecompute
      tag: dev
      digest: ""
      pullPolicy: Never # kind-loaded (task image:plugin PLUGIN=kubecompute)
    # Hosts are built into their OWN namespace, never beside the control plane. deployNamespace
    # renders the Namespace plus a NAMESPACED Role+RoleBinding, so a compromised builder can create
    # pods where hosts live and nowhere else.
    deployNamespace: [stratt-hosts]
    kubeAccess:
      apiGroups: [""]
      # `services` alongside `pods`: the build creates a Service per host, because that is what
      # CAUSES the DNS name the Syncer projects as mgmt.address (ADR-0142 D4 — observed or caused,
      # never computed). Without it the host is running and unaddressable, and the certificate leg
      # has no subject to derive.
      resources: ["pods", "services"]
      verbs: ["get", "list", "watch", "create", "delete"]
    hostEnv:
      STRATT_KUBECOMPUTE_NAMESPACE: stratt-hosts
    env:
      STRATT_KUBECOMPUTE_NAMESPACE: stratt-hosts
      STRATT_KUBECOMPUTE_IMAGE: alpine:3.22
  # The `certissuer` provider — LEG 4. The token is the dev root token, literal, exactly as the
  # compose service carries it and for the same reason: `server -dev` mints it at startup and it dies
  # with the pod. Real deployments broker a token through a CredentialRef and never hold one in a
  # manifest (§2.5); that debt is recorded on the plugin's own Actuator declaration.
  - name: openbao
    image:
      repository: stratt-plugin-openbao
      tag: dev
      digest: ""
      pullPolicy: Never # kind-loaded (task image:plugin PLUGIN=openbao)
    env:
      STRATT_OPENBAO_ADDR: http://openbao:8200
      STRATT_OPENBAO_TOKEN: stratt-dev-root
  # The network builder — LEG 1. tmpDir gives it the writable root its Dockerfile's
  # STRATT_OPENTOFU_DATA_ROOT points at: tofu writes a per-workspace data dir and a shared provider
  # cache, and the pod rootfs is read-only.
  - name: opentofu
    image:
      repository: stratt-plugin-opentofu
      tag: dev
      digest: ""
      pullPolicy: Never # kind-loaded (task image:plugin PLUGIN=opentofu)
    tmpDir: true
    # This plugin FORKS A TOOL, which every other plugin does not. `tofu apply` loads the AWS
    # provider binary and was OOMKilled (exit 137) at the shared 256Mi default — mid-apply, so it
    # left an acquired state lock in S3 and every retry then failed with `connection refused`
    # followed by `Error acquiring the state lock`. Two misleading verdicts for one memory limit.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "2", memory: 2Gi }
    env:
      # tofu's s3 BACKEND authenticates from the pod's own credential chain — the statestore handle
      # resolves WHERE the state lives, never the material (§2.5). Without these `tofu init` dies on
      # `No valid credential sources found` AFTER accepting the backend config, which reads as a
      # backend problem rather than a credential one.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
  # opentofu's `statestore` provider. Without it the build resolves and then sits PENDING ON A
  # DEPENDENCY — fail-closed working as designed, and not a floor a subnet can be built on.
  - name: awss3
    image:
      repository: stratt-plugin-awss3
      tag: dev
      digest: ""
      pullPolicy: Never # kind-loaded (task image:plugin PLUGIN=awss3)
    env:
      STRATT_AWSS3_ENDPOINT: http://seaweedfs:8333
      STRATT_AWSS3_REGION: us-east-1
      STRATT_AWSS3_PATH_STYLE: "true" # SeaweedFS and most S3-compatibles need path-style
      # WITHOUT THIS the plugin advertises no `statestore` capability at all — by design, since it
      # only advertises what it can back (the ADR-0106 D2 honesty rule).
      STRATT_AWSS3_STATE_BUCKET: stratt-tofu-state
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
  # The `ipam` provider — what makes the demo's CIDR an ALLOCATION rather than a literal.
  - name: netbox
    image:
      repository: stratt-plugin-netbox
      tag: dev
      digest: ""
      pullPolicy: Never # kind-loaded (task image:plugin PLUGIN=netbox)
    env:
      STRATT_NETBOX_URL: http://netbox:8080
      # NOT a literal, and that is forced rather than stylistic: NetBox 4.5 GENERATES its API token
      # and matches the presented value through a key it derives itself, so no value written into
      # this file could ever authenticate. `task dev:netbox:up` mints one into this Secret.
      STRATT_NETBOX_TOKEN:
        secretKeyRef: { name: netbox-api-token, key: token }
