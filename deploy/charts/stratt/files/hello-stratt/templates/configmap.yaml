apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-page
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    stratt.dev/deployed-by: helm-actuator
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head><meta charset="utf-8"><title>Hello from Stratt</title></head>
      <body style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; line-height: 1.5">
        <h1>Hello from Stratt 👋</h1>
        <p>This page is served by the <code>{{ .Release.Name }}</code> release, deployed by Stratt's
           helm Actuator through a <strong>gated Workflow</strong> — declared in Config-as-Code,
           approved at a gate, run over the sovereign plugin port.</p>
        <p>You just watched the descent: Intent → Workflow → Run → task event.</p>
      </body>
    </html>
