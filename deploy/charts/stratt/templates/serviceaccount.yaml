apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stratt.fullname" . }}
  labels: {{- include "stratt.labels" . | nindent 4 }}
---
# The dispatcher's exact K8s surface (charter §3: Jobs are the only
# execution primitive) — nothing broader (ADR-0013). Namespace-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "stratt.fullname" . }}-dispatcher
  labels: {{- include "stratt.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # `list` and `delete` are what CANCELLATION needs, and their absence made every cancel
    # since ADR-0026 a lie. DeleteRunJobs selects the Run's Jobs by the stratt.dev/run-id
    # LABEL — so it must list before it deletes — and the Role granted neither. Dispatch
    # only ever needed create+get, so nothing failed on the happy path and the gap survived.
    #
    # WHAT IT LOOKED LIKE, because it looked like nothing: the cancellation handler calls
    # CleanupRun as `_ = workflow.ExecuteActivity(...)`, so the RBAC denial was discarded.
    # The Run was stamped `canceled`, the API returned 202, and the execution pod kept
    # converging a real machine to completion. A record that says stopped while the estate
    # says otherwise is §1.8's failure in its purest form — and no unit test could see it,
    # because the fake clientset grants everything.
    #
    # Found by ADR-0157's live proof, which exists precisely because "the K8s Job is gone"
    # is the only one of the three assertions that distinguishes a real cancel from
    # bookkeeping. The other two passed here.
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- if .Values.leaderElection.enabled }}
  # Leader election (ADR-0040): the coordination.k8s.io Lease the controllers
  # contend for. Namespace-scoped, one named Lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stratt.fullname" . }}-dispatcher
  labels: {{- include "stratt.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "stratt.fullname" . }}-dispatcher
subjects:
  - kind: ServiceAccount
    name: {{ include "stratt.fullname" . }}
    namespace: {{ .Release.Namespace }}
