# vcenter — vSphere as a `provisioning` capability PROVIDER (ADR-0113), registered as an Actuator Kind
# (ADR-0103) declaring provides:[provisioning]. It dials the SAME vcenter plugin pod whose OBSERVE
# Syncer already reads the vSphere estate — the dual-verb shape (ADR-0060): one plugin, both verbs, so
# the build output's identity scheme correlates structurally with the Syncer's (ADR-0113 D1/D3).
# Provider verification (ADR-0104 D1) confirms the pod's Manifest advertises provisioning before any
# consumer binds.
#
# provisioning is ENABLEMENT-GATE (ADR-0107 D1), not resolve-inject — no resolve Action here; the build
# is a target-scoped Action (create the VM, then provision→configure it, ADR-0017).
#
# ENVIRONMENT-SCOPED (ADR-0113 D2): scoped to the vsphere-dc environment so it is the Compute provider
# THERE, coexisting with awsec2 (the aws environment's Compute provider) — a region/sovereignty
# boundary is an environment. vSphere is provider #N of provisioning (§1.5); EC2/opentofu are siblings.
name: vcenter
address: stratt-vcenter:9090
pluginIdentity: vcenter
tier: trusted
environments: [vsphere-dc]
# Every vcenter Action the boot block registered was dry-runnable, and this is the declaration's
# only place to say so. Omitting it would REFUSE a dry-run Step against any of them — a silent
# capability loss the migration must not introduce, and the mirror of `script`'s dryRunnable: false
# being a safety property in the other direction.
dryRunnable: true
# The landscape this provider builds in (ADR-0151 D1) — vCenter proper and vcsim alike.
substrate: vsphere
provides: [provisioning]
# ── The 15 INVOKE Actions, MOVED here from main.go (ADR-0103) ────────────────────────────────
# They were registered in Go behind STRATT_VCENTER_PLUGIN_ADDR — a dispatch surface unreviewable
# from Git, and one nothing checked against the plugin's own Manifest. Declared, they are verified
# at enable: a name this plugin does not advertise now holds the Actuator back with a diagnostic
# instead of registering a dispatch entry that fails at Invoke.
#
# create-vm is the Compute builder and create-portgroup the Subnet builder (ADR-0113); the rest are
# the ADR-0114 lifecycle + snapshot/mobility set. All dry-runnable, which the declaration's
# `dryRunnable` above already says once for the whole plugin.
actionNames:
  - vcenter/create-vm
  - vcenter/create-portgroup
  - vcenter/power-off
  - vcenter/power-on
  - vcenter/reset
  - vcenter/suspend
  - vcenter/shutdown-guest
  - vcenter/reconfigure
  - vcenter/delete-vm
  - vcenter/snapshot-create
  - vcenter/snapshot-revert
  - vcenter/snapshot-remove
  - vcenter/migrate
  - vcenter/clone
  - vcenter/reconfigure-portgroup
  - vcenter/delete-portgroup
# The Actuator's own write ceiling (ADR-0054). NARROWER than the boot grant it replaces, which was
# the SYNCER's — one Go value served both roles there. An Action's write-back is Run-provenance and
# entity-shaped: create-vm projects the built VM by identity, create-portgroup the portgroup. The
# Syncer keeps its own boot grant untouched and remains the authority for the observed Facets.
# NARROWED again after checking what an Action actually writes. RecordActionResult projects
# Kind + IdentityKeys + Labels + Relations and NO Facet — actuators.EntityObservation has no facet
# field — so the facetNamespaces this carried were authority granted for a path that does not
# exist. The vcenter SYNCER keeps its own boot grant and stays authoritative for the seven Facet
# namespaces it observes.
identitySchemes: [vcenter.uuid, vcenter.network.moref]
# The CORRELATION LABEL is granted explicitly, and it is not optional garnish: the provisioning
# loop closes on it. A build projects the Entity it made carrying stratt.intent/instance (Compute) or stratt.intent/singleton (a named singleton), and the next
# reconcile reads ONLY that key back to see the desired unit as built. It was missing here, and
# the failure mode is why it stayed missing: Host.toUpsert DROPS an ungranted label key rather
# than refusing the projection, so the Entity still lands, the Run still goes green, and the sole
# symptom is a build offered again on the next pass. TestProvisioningActuatorsGrantTheirCorrelationLabel
# now refuses a `provisions` advertisement without it.
labelKeys: [vcenter.name, source, stratt.intent/instance, stratt.intent/singleton]
# provisions advertises vcenter's per-kind build Workflows (ADR-0110 D3). In the vsphere-dc environment
# BOTH Compute (awsec2 unscoped + vcenter) and Subnet (crossplane/opentofu unscoped + vcenter) have >1
# provider → per-(class,kind) resolution fails closed on the ambiguity (§2.4); the
# estate/capability-bindings/provisioning-vsphere.yaml entries select vcenter for both.
#
# Note there is NO requires:[ipam] here (ADR-0113 D4, corrected): the Subnet build composes ipam via an
# EXPLICIT netbox/ipam-resolve Step in vsphere-subnet-build (resolve-inject is workspace-shaped and
# Actuator-Apply-only; a per-build VLAN allocation is more legibly a visible Step, §1.8). The dependency
# is the Workflow's `needs` edge, not a resolve-inject gate.
provisions:
  Compute: vsphere-vm-build
  Subnet: vsphere-subnet-build
# decommissions advertises vcenter's per-kind gated TEARDOWN Workflow (ADR-0114 D4), symmetric to
# provisions. When an Intent/Compute declared onRemove:remove drops its count, the excess built VMs
# resolve to this teardown Workflow — a gated decommission Finding per excess, never an auto-destroy
# (§2.4). (Subnet teardown pairs with whole-Intent withdrawal, the booked follow-up — not wired here.)
decommissions:
  Compute: vsphere-vm-teardown
