# vsphere-vm-build — the GATED build Workflow an Intent/Compute launches when it resolves to the
# vcenter provisioning provider (ADR-0113 / ADR-0110 D3, the vsphere-dc environment's Compute builder).
# Mirrors compute-build (ADR-0058): the provisioning reconcile surfaces a `provision/<intent>` Finding
# per missing instance; an operator launches THIS Workflow to build one (§5 Flow 1 — the launch IS the
# gate, and the approve Step adds a second platform-admin approval). The build Action projects the VM
# back BY IDENTITY ONLY with Run provenance (ADR-0113 D3); the projectKind + labels + the
# stratt.intent/instance correlation label ride that projection (never a reconcile-side write, §1.2) so
# the next reconcile sees it built and resolves the Finding. Facets arrive from the vcenter Syncer's
# next OBSERVE.
name: vsphere-vm-build
# The per-instance launch interface (ADR-0118 D2, ADR-0120 D2). Identical to compute-build's,
# because the reconcile sends the same core-generated set to whichever provider is bound — that
# symmetry is the point of resolving a capability CLASS rather than a named provider (§1.5), and
# checkProvisioningBuildInputs enforces it against EVERY advertised Compute builder rather than
# only the one bound in this environment. It found this Workflow, which had no inputs at all.
#
# `params` is OPAQUE: Intent/Compute declares it additionalProperties:true and vcenter/create-vm's
# own Action Contract types it downstream (§1.5). Enumerating cpus/memoryMB here would re-couple
# this Workflow to one landscape (ADR-0110).
inputs:
  type: object
  additionalProperties: false
  required: [instance, projectKind, labels]
  properties:
    instance:
      type: string
      description: The desired instance's correlation name (namePrefix + ordinal), e.g. app-01.
    projectKind:
      type: string
      description: The Entity kind the built VM projects as.
    labels:
      type: object
      additionalProperties: { type: string }
      description: >
        Labels the projection carries, INCLUDING stratt.intent/instance — the correlation label
        the next reconcile matches to decide this instance is built.
steps:
  - name: approve
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400 # 24h to approve the build
  - name: build
    needs: [approve]
    action: vcenter/create-vm # landscape binding — vSphere's Compute builder (swap point, §1.4/§1.5)
    credentialRefs: [vsphere-dev] # §2.5 — an Action's use-check is its only authz gate
    params:
      name: "{{.launch.instance}}"
      # Placement: create-vm builds into the datacenter's default when the estate has ONE datacenter.
      # When it spans MULTIPLE (e.g. after `task dev:vsphere:bootstrap` seeds regions), the Intent's
      # own params carry `datacenter` and it arrives below — govmomi's default is ambiguous otherwise,
      # and the target must carry compute + storage capacity (the create-vm error names the datacenter
      # if it lacks either, §1.8). A production Intent binds the target region per the resolved
      # environment (ADR-0113 D2).
      #
      # Sizing stays LITERAL here, and the reason is a real constraint rather than an oversight.
      # Intent/Compute's `params` is opaque and PROVIDER-SHAPED by design (§1.5), and the reference
      # estate's two Compute Intents declare almost none of it: `web-fleet` declares no params at
      # all and `app-tier` only `tier`. (They used to carry EC2's region/instanceType/ami, for a
      # builder that runs for them in no environment they are reconciled in; scoping the Intents let
      # those go.) Binding {{.launch.params.cpus}} would therefore fail CLOSED at launch against
      # exactly the Intents that exist — the substituter refuses an unknown field rather than
      # defaulting it (ADR-0024), and the template language has no conditionals (ADR-0083 D5). The
      # constraint did not move when the coordinates did: it was never about which substrate's
      # params were there, only that this builder cannot require params an Intent may not declare.
      #
      # These are also fleet-shape, not per-instance: every instance of a fleet gets the same size,
      # so they are not what ADR-0120 D2 is about. A vsphere-environment Intent puts cpus/memoryMB in
      # its own `params` and this becomes a forward — booked in ADR-0120 rather than half-done here,
      # because the honest fix is an Intent per substrate boundary, not a template that guesses.
      cpus: 2
      memoryMB: 2048
      # The estate OVERLAY (ADR-0058 §6): the built VM projects AS this kind with these labels (Run
      # provenance, never a reconcile write, §1.2 — routing them through launch params does not change
      # the writer). labels already carries stratt.intent/instance, which resolves the provisioning
      # Finding, so this Workflow no longer names any single instance and builds whichever one its
      # Finding is for.
      projectKind: "{{.launch.projectKind}}"
      projectLabels: "{{.launch.labels}}"
