# vsphere-subnet-build — the GATED build Workflow an Intent/Subnet launches when it resolves to the
# vcenter provisioning provider in the vsphere-dc environment (ADR-0113 D4 / ADR-0110 D3).
#
# It LIVES HERE because it is vcenter's own advertised Subnet builder: vcenter.yaml declares
# `provisions: {Compute: vsphere-vm-build, Subnet: vsphere-subnet-build}`. It sat in estate/ until
# its ipam leg stopped naming NetBox (ADR-0140 D3 row 2) — a Workflow that names another plugin's
# provider cannot live in this tree (plugins:boundary check 3), and a provider whose advertised
# mechanisms are split across trees is the gap check 5 now closes.
#
# It composes the `ipam` capability EXPLICITLY (ADR-0113 D4, the corrected mechanism): step 1
# netbox/ipam-resolve ALLOCATES the prefix + VLAN (anchored in NetBox, idempotent on `key`, §1.2 — no
# allocation record in Stratt); step 2 vcenter/create-portgroup reads the allocated vlanId + cidr via
# the shipped step-output binding ({{.steps.allocate-vlan.outputs.x}}, ADR-0031 — the template engine
# preserves the native integer type of vlanId) and builds a VLAN-tagged DVS portgroup. The allocation
# is a VISIBLE descent Step (§1.8), not a hidden resolve-inject — resolve-inject is workspace-shaped and
# Actuator-Apply-only, and a per-build allocation is more legibly a Step. The `needs` edge is the
# observable dependency. The build projects the portgroup back BY IDENTITY ONLY (vcenter.network.moref,
# ADR-0113 D3); the vcenter Syncer OBSERVEs the authoritative net.subnet Facet on its next poll.
# CORRECTED BY ADR-0120 D3, and the correlation label was a real bug rather than only hardcoding: this
# Workflow projected `stratt.intent/subnet`, while ProvisionedSingletons reads ONLY
# `stratt.intent/singleton`. So a successful build produced a portgroup that never resolved its own
# provisioning Finding — the reconcile kept surfacing the same gated build forever. It now forwards
# {{.launch.labels}}, where the reconcile puts the key it will actually match on.
name: vsphere-subnet-build
inputs:
  type: object
  additionalProperties: false
  required: [name, projectKind, labels]
  properties:
    name:
      type: string
      description: The declared Intent name — also the ipam idempotency key, so a re-run re-allocates nothing.
    projectKind: { type: string }
    labels:
      type: object
      additionalProperties: { type: string }
      description: Labels the projection carries, INCLUDING stratt.intent/singleton.
steps:
  - name: approve
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400 # 24h to approve the build
  - name: allocate-vlan
    needs: [approve]
    # The CLASS, not a provider (ADR-0140 D3 row 2). This Step used to read
    # `action: netbox/ipam-resolve`, with a comment calling it "the ipam capability's allocate
    # Action" — which is the tell: the author was thinking in capabilities and the mechanism could
    # only express a provider. ADR-0104 D1 forbids a consumer naming a provider, and this was the
    # estate's most visible violation of it. The bound provider's advertised implementation is
    # resolved at launch and recorded on the Run beside the class (§1.8).
    #
    # Params are unchanged because they were ALREADY class-shaped — they validated against
    # actions/netbox/ipam-resolve.input, a document that exists only to mirror
    # capabilities/ipam.input and is bound to it by a co-fidelity test. They now validate against
    # the class directly, and the mirror stops being load-bearing here.
    actionCapability: ipam
    # STILL PROVIDER-NAMED, and deliberately left visible. An Action Step must carry a
    # CredentialRef — it is the Action's only authz gate until the run-grant lands — and a
    # credential is provider-specific by nature. So this Step no longer names NetBox's ACTION but
    # still names NetBox's CREDENTIAL, and a swap to Nautobot would edit this line.
    #
    # It did NOT block the move here, on reflection. A CredentialRef is a NAME the operator
    # supplies and the floor resolves, like the `address:` fields already in every plugin
    # declaration — not a plugin-to-plugin reference. And the alternative was worse: leaving this
    # Workflow in estate/ left vcenter's `provisions` map pointing into two trees, which
    # plugins:boundary check 5 now refuses outright.
    #
    # The real asymmetry is that the `requires:` path invokes a resolve Action with NO credentials
    # at all — the plugin uses its own configured auth — so this is a Step-form problem
    # specifically. Whether a capability Step should inherit the provider's auth the same way is
    # an open question ADR-0140 records and does not answer; it touches the Action authz gate, so
    # it needs its own review rather than a quiet change here.
    credentialRefs: [netbox-dev] # §2.5 — an Action's use-check is its only authz gate
    params:
      # The Intent's own name is the idempotency key — a re-run returns the SAME prefix + VLAN
      # (anchored in NetBox). Hardcoding it meant every subnet shared one allocation.
      key: "{{.launch.name}}"
      # role/size/vlanGroup stay LITERAL for the reason vsphere-vm-build records for cpus/memoryMB:
      # Intent/Subnet's `params` is opaque and PROVIDER-shaped (§1.5), and the reference estate's
      # Subnet Intents carry crossplane's `cidr` because they resolve to crossplane outside vsphere-dc.
      # Binding {{.launch.params.role}} would fail CLOSED against exactly the Intents that exist — the
      # substituter refuses an unknown field and there are no conditionals (ADR-0083 D5). ADR-0113 D2
      # makes the environment the substrate boundary, so a vsphere-dc estate declares Subnet Intents
      # with vSphere-shaped params and these become forwards. ADR-0120 moves per-unit IDENTITY, which
      # is universal; provider-shaped config is a separate question.
      role: dmz
      size: 24
      vlanGroup: dc1
  - name: build
    needs: [allocate-vlan]
    action: vcenter/create-portgroup # vSphere's Subnet builder (swap point, §1.4/§1.5)
    credentialRefs: [vsphere-dev] # §2.5
    params:
      name: "{{.launch.name}}"
      # The VLAN + prefix come from the allocate-vlan Step's typed outputs (native-type-preserving bind).
      vlanId: "{{.steps.allocate-vlan.outputs.vlanId}}"
      cidr: "{{.steps.allocate-vlan.outputs.cidr}}"
      # The estate OVERLAY (ADR-0058 §6): the built portgroup projects AS this kind with these labels
      # (Run provenance, never a reconcile write). stratt.intent/subnet resolves the provisioning Finding.
      projectKind: "{{.launch.projectKind}}"
      # labels carries stratt.intent/singleton — the key ProvisionedSingletons reads. The previous
      # `stratt.intent/subnet` spelling was read by nothing, so the build never resolved its Finding.
      projectLabels: "{{.launch.labels}}"
