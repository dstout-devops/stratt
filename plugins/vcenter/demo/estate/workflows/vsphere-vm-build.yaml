# vsphere-vm-build (ADR-0113 / ADR-0116) — the GATED build Workflow this demo launches. An `approve`
# gate Step (platform-admins) fronts the mutating vcenter/create-vm build (§5 Flow 1 — the launch IS a
# gate, and approve adds a second platform-admin approval before anything is created in vSphere).
#
# vcenter/create-vm is a TARGETLESS Action registered by the boot-wired vcenter plugin host (the SAME
# host as the OBSERVE Syncer, ADR-0113 D1/D3), so the build output's vcenter.uuid identity correlates
# with what the Syncer observes. The build projects the VM back BY IDENTITY ONLY with Run provenance —
# projectKind + labels ride that projection (never a reconcile-side write, §1.2). Facets arrive on the
# Syncer's next OBSERVE, so the new VM shows up in the dev-vms View. The vsphere-dev CredentialRef is a
# gate-only ref — an Action's use-check is its only authz gate (§2.5); the plugin connects to vSphere
# with its own broker creds. This whole estate is delivered as CaC through the declarations mount.
name: vsphere-vm-build
# The per-instance launch interface (ADR-0120 D2), matching the reference estate's
# vsphere-vm-build. This demo drives the build Workflow directly (it declares no Intent/Compute), so
# its run.sh plays the part the provisioning reconcile plays and names the instance at launch. Before
# this the Workflow hardcoded web-01, which made the baked-in identity invisible from the script.
inputs:
  type: object
  additionalProperties: false
  required: [instance, projectKind, labels]
  properties:
    instance:
      type: string
      description: The instance's correlation name, e.g. web-01.
    ordinal:
      type: integer
      description: Its 1-based position in the fleet.
    projectKind:
      type: string
      description: The Entity kind the built VM projects as.
    labels:
      type: object
      additionalProperties: { type: string }
      description: Labels the projection carries, INCLUDING stratt.intent/instance.
    placement:
      type: object
      additionalProperties: true
      description: Declared topology placement, when there is one.
    params:
      type: object
      additionalProperties: true
      description: Opaque provider build params, typed by vcenter/create-vm's Contract.
steps:
  - name: approve
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400 # 24h to approve the build
  - name: build
    needs: [approve]
    action: vcenter/create-vm
    credentialRefs: [vsphere-dev]
    params:
      name: "{{.launch.instance}}"
      # No datacenter specified — the demo floor runs a single vSphere datacenter (the default simulated
      # topology), so create-vm places into it (govmomi DefaultDatacenter). In a multi-datacenter estate
      # you would name the target datacenter here (create-vm accepts a `datacenter` param); provisioning
      # into a specific named region across many is the enterprise-capstone story.
      #
      # Sizing stays literal for the reason the reference Workflow records: it is fleet-shape rather
      # than per-instance, and Intent/Compute's `params` is provider-shaped, so forwarding it would
      # fail closed against an Intent that does not declare it.
      cpus: 2
      memoryMB: 2048
      # The built VM projects AS this kind with these labels (Run provenance, never a reconcile write).
      # labels carries stratt.intent/instance, so this builds whichever instance it is asked for.
      projectKind: "{{.launch.projectKind}}"
      projectLabels: "{{.launch.labels}}"
