# demo.yaml — the ec2-only demo manifest (ADR-0116 D1/D3). Declared metadata the turnkey runner READS
# and surfaces, so the human-facing claims (especially `fidelity`) can't quietly rot.
name: ec2-only
title: "EC2: provision a real instance through a gated Workflow"
summary: >
  Declare an EC2 instance in Config-as-Code, approve a gate, and Stratt provisions a REAL instance via
  the awsec2 plugin against floci (a real-host EC2 backend) — then its Syncer observes the new instance
  back into the graph. Real provisioning + a live read-model on one substrate.

# fidelity (D3): how real is what you're watching?
#   real       — real workloads on real substrate.
#   build-real — the substrate's control API and lifecycle are real; the substrate itself is a simulator.
#   simulated  — the substrate itself is faked end to end.
fidelity: build-real
fidelityNote: >
  floci (ADR-0093) runs REAL Docker containers as EC2 instances against a real EC2 API — RunInstances
  actually launches a Linux container, the lifecycle is real, and the network model (VPC/subnet/SG/
  route-table/IGW, genuine subnet CIDR IPAM) is real. Not a mock; it replaced moto. What is NOT real
  is the GUEST: no floci AMI ships an sshd binary and user-data is never executed, so the instance is
  a real machine record with nothing listening and cannot be converged onto. This note said "SSH-able"
  and the demo claimed fidelity `real` until it was measured (2026-07-27, floci 1.5.33) — HAR-1 in
  docs/enterprise-readiness.md, guarded by plugins/awsec2/floci_fidelity_live_test.go. build-real is
  exactly the vocabulary this library already defined for it: provisioning/lifecycle APIs real,
  guest-OS/runtime simulated.

# What the runner drives (mirrors the estate).
workflow: compute-build
substrate: ec2-floci
