# compute-build (ADR-0058 / ADR-0116) — the GATED build Workflow this demo launches. An `approve`
# gate Step (platform-admins) fronts the mutating awsec2/create-vm build (§5 Flow 1 — the launch IS a
# gate, and approve adds a second platform-admin approval before anything is created).
#
# awsec2/create-vm is a TARGETLESS Action registered by the boot-wired awsec2 plugin host. Against the
# floci real-host EC2 backend (ADR-0093) it runs a REAL RunInstances — a genuine SSH-able Linux
# container, not a mock (fidelity: real). The build projects the instance back BY IDENTITY ONLY with Run
# provenance (projectKind + labels ride that projection, never a reconcile write, §1.2); the awsec2
# Syncer's next OBSERVE then picks it up, so it appears in the provisioned-instances View — the build→observe
# closure. The aws-dev CredentialRef is gate-only — an Action's use-check is its only authz gate (§2.5);
# the plugin authenticates to EC2 with its own config. Delivered as CaC through the declarations mount.
name: compute-build
# The per-instance launch interface (ADR-0118 D2, ADR-0120 D2). Before this the Workflow
# hardcoded web-01, so a `count: 2` fleet raised two Findings and the gated path could only
# ever build the first — and the second Finding never resolved, because the correlation label
# it matches on was never projected.
#
# The reconcile supplies every one of these; none is typed by hand at launch. `params` is
# OPAQUE on purpose: Intent/Compute declares it additionalProperties:true and the provider's
# own Action Contract types it downstream (§1.5), so enumerating region/instanceType/ami here
# would re-couple this Workflow to one landscape (ADR-0110).
inputs:
  type: object
  additionalProperties: false
  required: [instance, projectKind, labels]
  properties:
    instance:
      type: string
      description: The desired instance's correlation name (namePrefix + ordinal), e.g. web-02.
    projectKind:
      type: string
      description: The Entity kind the built instance projects as.
    labels:
      type: object
      additionalProperties: { type: string }
      description: >
        Labels the projection carries, INCLUDING stratt.intent/instance — the correlation
        label the next reconcile matches to decide this instance is built.
    placement:
      type: object
      additionalProperties: true
      description: >
        Declared topology placement, ALWAYS present with all fields and empty where nothing is
        declared (ADR-0123 D2), INCLUDING subnetRef — the provider-native id the reconcile
        resolves from the declared subnet NAME (ADR-0147 D1).
    params:
      type: object
      additionalProperties: true
      description: Opaque provider build params, typed by the provider's Action Contract, never here.
steps:
  - name: approve
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400 # 24h to approve the build
  - name: build
    needs: [approve]
    action: awsec2/create-vm
    credentialRefs: [aws-dev]
    params:
      # Forwarded from the Intent's opaque `params` — the floci baseline image (ADR-0093) and the
      # region are the Intent's to declare, not this Workflow's to know.
      region: "{{.launch.params.region}}"
      instanceType: "{{.launch.params.instanceType}}"
      ami: "{{.launch.params.ami}}"
      name: "{{.launch.instance}}"
      # The built instance projects AS this kind with these labels (Run provenance, never a
      # reconcile write). labels carries stratt.intent/instance, so this builds whichever instance
      # its Finding is for rather than always web-01 (ADR-0120 D2).
      projectKind: "{{.launch.projectKind}}"
      projectLabels: "{{.launch.labels}}"
      # Placement, carried EXACTLY as the plugin's shipped compute-build carries it, even
      # though this demo declares no subnet — an unplaced Intent resolves both to "" and the
      # Action skips the axis (ADR-0123 D2).
      #
      # Keeping them identical is the point. This file used to OMIT these two params while the
      # shipped Workflow sent them, so the live-verified demo proved a Workflow the reference
      # estate does not use — and it hid PRV-1, where the shipped one failed at launch for
      # every Intent/Compute. A demo that exercises a different shape than the thing it
      # demonstrates is worse than no demo. Guarded by TestPluginDemoWorkflowsMatchShipped.
      # subnetRef, not subnet — see the shipped compute-build. This copy is kept BINDING-FOR-
      # BINDING identical to it on purpose: the divergence between the two is what hid PRV-1
      # (the demo ran a Workflow the estate did not), and TestDemoWorkflowsDoNotShadowWithDifferentParams
      # now refuses a re-divergence rather than trusting anyone to remember.
      subnetId: "{{.launch.placement.subnetRef}}"
      availabilityZone: "{{.launch.placement.availabilityZone}}"
