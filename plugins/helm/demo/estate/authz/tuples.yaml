# Demo authz (ADR-0116) — the LEAN bootstrap grant for the k8s-deploy demo floor, loaded from
# the staged declarations at boot (LoadTuples). Mirrors the genesis grant: the one self-retiring
# dev-header bootstrap-admin Principal gets exactly the two grants it needs to drive the gated
# deploy, and nothing else. Deny-by-default still holds. The floor is self-retiring — the boot
# guard forbids the dev header coexisting with OIDC (charter §1.3, ADR-0102/0009).
tuples:
  # Approve the §5 Flow-1 gate fronting deploy-hello (helm/deploy is a mutating
  # helm upgrade --install, gated on team:platform-admins).
  - { user: principal:bootstrap-admin, relation: member, object: team:platform-admins }
  # Use the helm/deploy Action's authz-gate CredentialRef (§2.5 use-check — an Action's
  # CredentialRef is its only authz gate; ADR-0092).
  - { user: principal:bootstrap-admin, relation: user, object: credential_ref:helm-deploy }
