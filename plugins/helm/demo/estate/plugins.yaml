# Admitted plugin estates for the k8s-deploy demo (ADR-0137 D1/D3).
#
# The demo declares its own `helm` Actuator, and since ADR-0138 D3/D4 that Actuator's input Contract
# (`actuators/helm.input`) lives in the helm PLUGIN's tree rather than in core. Core holds only what
# the estate admits, and it cannot learn the document from the plugin at runtime: the Manifest
# carries a schema id and a hash, never the schema (§1.5 — a plugin never mints contract meaning).
# Without this admission the deploy Step fails with "no input contract for actuator" after the gate.
#
# CONTRACTS ONLY: the demo needs helm's SEAM, not its ESTATE — it ships its own Actuator and its own
# deploy-hello Workflow, which is the whole of what it demonstrates.
#
# This file was missing, and the reason that stayed invisible is worth keeping: `task ci` parses from
# the repo, where the plugin tree is on disk and complete, so the omission is only reachable by
# running the demo on a real floor. TestDemoEstatesAdmitThePluginsTheyUse now catches it in seconds.
plugins:
  - name: helm
    path: ../../estate
    contractsOnly: true
