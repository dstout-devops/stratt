# helm-deploy — the GATED build Workflow that deploys a Helm release via the
# targetless helm/deploy Action (ADR-0092 dual-surface). It proves the self-managing
# loop end to end (M2): Stratt materializes a Kubernetes release through its OWN gated
# reconcile/actuator path — "declare -> gated build -> helm materializes -> converge".
#
# §5 Flow 1: the launch IS a gate, and the approve Step adds a platform-admin Gate
# BEFORE the deploy (a mutating helm upgrade --install). An agent (or a human) decides
# the Gate via POST /gates/{id}/decision (§1.6 — the same path for both). helm/deploy
# is TARGETLESS (no View anchor) — the deploy names its own release + namespace.
#
# IT IS PARAMETERIZED NOW, and that replaced a hardcoded `hello`/`stratt-m2`. Two reasons, in
# order of weight. It is the remediation half of the CHART delivery form (ADR-0148 follow-up b):
# a Blueprint route over Intent/Application binds `{{.spec.package}}` / `{{.spec.chartVersion}}`
# into these inputs, and a Workflow whose chart is baked cannot serve one. And a Workflow with
# fixed params is a Workflow only a hand-launch can use, so the M2 proof and the drift remediation
# would have been two copies of one thing — the divergent-second-copy failure that hid three
# separate defects earlier in this arc. One artifact, exercised by both.
name: helm-deploy
inputs:
  type: object
  additionalProperties: false
  required: [chart, chartVersion, release, namespace]
  properties:
    chart:
      type: string
      minLength: 1
      description: >
        The chart to deploy — resolved per-Assignment from Intent/Application's spec.package, which
        for the chart delivery form IS the chart name. The `delivers:` agreement check (ADR-0148 D2)
        is what stops an Intent asking for one chart being bound to a Blueprint that installs
        another.
    chartVersion:
      type: string
      minLength: 1
      description: >
        The exact chart version, as a STRING. It is compared against contracts/facets/
        app.deliverable's observed `version` and nothing coerces between types (ADR-0118 D1), so
        the desired and observed values must share a type or they are never comparable. Pinned
        rather than floating because §7.3 wants the deployed bytes knowable.
    release:
      type: string
      minLength: 1
      description: The Helm release name — the identity kubeservices correlates on (helm.release).
    namespace:
      type: string
      minLength: 1
      description: The namespace the release is deployed into.
steps:
  - name: approve
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400 # 24h to approve the deploy
  - name: deploy
    needs: [approve]
    action: helm/deploy
    # §2.5 — an Action's CredentialRef use-check is its only authz gate (ActionUngated
    # otherwise). helm reaches the API via the plugin pod's own SA, so this is a
    # pure authz-gate pointer (no material). The launching Principal needs `use`.
    credentialRefs: [helm-deploy]
    params:
      chart: "{{.launch.chart}}"
      version: "{{.launch.chartVersion}}"
      release: "{{.launch.release}}"
      namespace: "{{.launch.namespace}}"
      # The namespace is created if absent, because the first deploy of a release into a fresh
      # namespace is the ordinary case for a chart-delivered application and a Run that failed on
      # a missing namespace would report a chart problem for a namespace problem (§1.8).
      createNamespace: true
