# ansible-platform-baseline — the ansible Actuator bound to the platform-baseline PROJECT
# (ADR-0134 D1/D2): fleet onboarding and convergence.
#
# WHY AN ACTUATOR PER PROJECT. `contentDir` names a content root — one AWX Project, one Git
# content root, one `roles/`+`group_vars/`+playbooks tree — and the whole tree is mounted at
# project/ for a Run through this Actuator. That is not a new rule: estate/actuators/ansible.yaml
# already stated it as "a Step that needs different CONTENT names a different Actuator", which is
# also how per-Step EE selection works (ADR-0117 D3a). The alternative — one Actuator, and the
# Step names a project in its params — was rejected because it puts ansible awareness in the
# tool-blind dispatch path and mounts every project into every Run.
#
# WHAT THAT BUYS: facetNamespaces below is a PER-PROJECT write ceiling. This project converges
# hosts and reports what it observed, so it may write os.* and app.config — and nothing else. The
# access and fileset projects get their own, narrower ceilings, which is the point D2 is making:
# the access project has no business writing hardening facets, and now it structurally cannot.
#
# THE HONEST LIMIT (ADR-0134 D2 correction). This ceiling holds at RUN time, not at AUTHORING
# time: whoever may write a Workflow declaration chooses which Actuator a Step selects, and
# therefore chooses whose content runs under whose ceiling — Argo CD's documented `.spec.project`
# circumvention with a different field name. So this file lives in the PLATFORM-owned
# estate/actuators/ path and never inside a tenant's project directory; a write ceiling in a file
# its subject can edit is not a ceiling. Real isolation needs an authorization check on Actuator
# selection, which does not exist today (every launch check is `runner` on `view:<name>`; there is
# no authz object for an Actuator). Until that lands this boundary is enforced by repo review,
# and it must not be described as isolation.
name: ansible-platform-baseline
pluginIdentity: ansible
tier: trusted
dryRunnable: true
jobCommand: [stratt-ansible]
# The content root, relative to the estate root. Everything under it mounts at project/ in the
# EE pod; a Step names a file within it via `params.playbook`. Core resolves this at estate-PARSE
# time onto the Actuator (D3) — so the content travels with the JobSpec to a remote Site, and a
# playbook edit shows up in `stratt plan` as the change to what-will-run that it is.
contentDir: content/platform-baseline
# WHICH Step param names a file in that tree — so the estate load can check the reference and a
# Step naming a playbook that is not there fails the load rather than a 3 a.m. Run (§1.8). It is
# DECLARED for the same reason elevatedInputs below is: core walks a path this file names and
# asks the resolved tree whether it holds that key. It never learns the word `playbook`, which
# is the `if ansible{}` §1.4 forbids. Existence only — core never opens the file (ADR-0117 D6).
contentInputs: [playbook]
# The `configmgmt` capability provider — RESTORED by ADR-0138 D5, having been removed once.
#
# The first attempt (ADR-0135 D2/D4) declared exactly these two fields so a Blueprint route could
# name the CAPABILITY and resolve to this Actuator at compile. It broke every real floor: capability
# resolution counts only VERIFIED providers, verification meant fetching a Manifest over a dial
# address, and an EE-Job Actuator has none by construction — ansible is subprocess-only because of
# the GPLv3 boundary (§3). The registry logged `provider REJECTED … not manifest-verifiable` every
# ten seconds and three Assignments stopped compiling, while every unit test passed, because they
# resolve through a fake. It was caught by booting `task dev:connector-e2e` and nothing else.
#
# ADR-0138 D5 gives verification a second admissible form rather than asking this declaration to
# pretend it has an address. There is no Manifest to fetch, so the claim is corroborated against
# what this file actually COMMITS TO: the `remediates` map below names a Workflow the estate loader
# independently requires to exist. The verdict is recorded with basis=declaration, so the API says
# plainly that a declaration was read and not a running binary — weaker than a Manifest check, and
# labelled rather than blurred (§1.8).
#
# What this still CANNOT do, correctly: serve an ACTION-shaped capability class. That needs a
# Manifest-advertised `implements` (ADR-0140 D1), which a subprocess has no way to supply, so such a
# route fails closed at resolution with a diagnostic naming the missing advertisement. configmgmt is
# Workflow-shaped, which is why it works — and why it was the class most damaged by the old rule.
# WHICH Workflow converges an Intent/Application on this Actuator (ADR-0135 D2). This is the
# mechanism the attestation above is checked against — declaring the class with no mechanism behind
# it stays refused as an assertion with nothing under it.
facetNamespaces:
  - os.kernel
  - os.hardening.sysctl
  - os.hardening.sshd
  - os.hardening.filesystem
  - os.hardening.auditd
  - os.hardening.services
identitySchemes: [host.name]
# Privilege escalation, Control-gateable (ADR-0122 D3): core walks this path in each Step's
# params and derives the `stratt.change/privileged` change-context label from a truthy value. It
# never learns the word `become` — it reads a declared path and a boolean, exactly as
# facetNamespaces lets it enforce a ceiling without knowing what a namespace means.
elevatedInputs: [become.enabled]
