# ansible-certificate — the target-side half of certificate delivery (CERT-2, ADR-0050).
#
# ITS OWN Actuator, and the reason is the two ceilings it needs and nothing else does:
#
#   outputContract: outputs/csr   — it is the first Actuator in this estate that hands a value to a
#                                   later Step. Without a pin the hub REFUSES an Apply's outputs, so
#                                   this declaration is what makes {{.steps.gather.outputs.csr}}
#                                   bindable at all.
#   facetNamespaces: fileset.content — delivery reports the file that landed, and nothing more.
#
# It runs the ansible-crypto EE image because csr-gather.yml uses community.crypto's
# openssl_privatekey/openssl_csr. Content is selected by selecting an Actuator (ADR-0117 D3a), never
# by a run-time parameter, so the EE and the content root travel together.
name: ansible-certificate
pluginIdentity: ansible
tier: trusted
dryRunnable: true
jobCommand: [stratt-ansible]
image: stratt-ee-crypto:dev
contentDir: content/certificate
contentInputs: [playbook]
# THE PIN (CERT-2). One document, closed, carrying only the CSR — because the private key is born on
# the target and never crosses the wire, and a schema that admitted more would invite more.
outputContract: outputs/csr
facetNamespaces: [fileset.content]
identitySchemes: [host.name]
elevatedInputs: [become.enabled]
