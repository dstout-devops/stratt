# tomcat-configure — the Tomcat materialization/remediation Workflow (ADR-0148). Surfaced as a ref
# on the drift Finding, never auto-launched (§5 Flow 2).
#
# It INSTALLS as well as configures: managed-tomcat ships bare Debian, so "tomcat is present" is a
# fact this Run causes rather than one the image supplied.
name: tomcat-configure
# Every value the play needs arrives from the LAUNCH. tomcat_home/tomcat_conf_dir are declared
# inputs rather than literals in the play for the same reason the port is: the paths differ by
# distro and by major version, and a play that hardcoded Debian's would be a play that only ever
# worked on Debian while claiming to be distro-agnostic.
inputs:
  type: object
  additionalProperties: false
  required: [tomcat_port]
  properties:
    tomcat_port:
      type: string
      minLength: 1
      description: >
        The desired connector port, resolved per-Assignment from the Blueprint default OR the
        Intent's override. A STRING, matching contracts/facets/app.config's observed port —
        nothing coerces between types (ADR-0118 D1).
# tomcat_home / tomcat_conf_dir USED TO BE INPUTS HERE, defaulted by the Blueprint to Debian's
# /usr/share/tomcat10 and /etc/tomcat10 (ANS-014). They are gone: where a distro keeps tomcat is a
# fact about the TARGET, read from its own facts by content/webapp/vars/tomcat/<family>.yml —
# not desired state an Intent could sensibly declare. Threading them through the launch interface
# made this Blueprint silently Debian-only while looking substrate-agnostic.
steps:
  - name: configure
    # NO viewName — INHERITED from the Baseline that raised the Finding.
    #
    # The Assignment already says WHERE this Intent applies (`view:`), the compiler copies it onto
    # the Baseline, and re-stating it here made one value two binding sites able to disagree (§2.4).
    # It also made the recipe unusable for any host outside the View its author happened to name: a
    # host Stratt had just BUILT could not be converged by it, and labelling the host into that View
    # is not always open to the builder — a label key has exactly one owner (ADR-0041).
    #
    # A converge Workflow is a RECIPE — what to do — not a target. WHERE is the Assignment's job.
    actuator: ansible-tomcat
    credentialRefs: [web-machine]
    facetWriteScope: [app.config, software.package]
    params:
      connection:
        user: root
        credentialRef: web-machine
        hostKeyChecking: accept-new
      extraVars:
        tomcat_port: "{{.launch.tomcat_port}}"
      playbook: tomcat-configure.yml
