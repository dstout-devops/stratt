# nginx-configure — the web-server Blueprint's materialization/remediation Workflow. Surfaced
# as a ref on the drift Finding, never auto-launched (§5 Flow 2). The PLUGIN (ansible)
# materializes the state; the Blueprint route NAMED it, core did not (ADR-0083). This is
# the ADR-0084 CONVERGENCE path: a REAL ansible run over SSH to the managed-web node —
# a genuine AWX-style job (real inventory host from mgmt.address, a machine credential,
# a real connection), not a local no-op. It converges the listen port, READS IT BACK,
# and reports the observed app.config via the stratt_facets fact-back so the drift
# Finding RESOLVES once observed == desired.
name: nginx-configure
# THE DESIRED PORT ARRIVES FROM THE ROUTE, and until now it did not (ADR-0148 D1).
#
# It was the literal "8080" below — the Blueprint's default, restated here. The expectation is
# synthesized per-Assignment from the resolved spec ({{.spec.port}} in the route's `observe`), so
# `web-server-secure`, which overrides the port to 443, DRIFT-CHECKS 443 and would have been
# remediated to 8080. Not a no-op: the converge sets the wrong value, the Finding never resolves,
# and the same remediation is offered forever.
#
# It has been latent rather than live only because no host carries `tier: secure`, so the View that
# Assignment compiles over is empty. It goes live the first time an adopter labels one — which is
# the ordinary way anyone would adopt the second fleet.
#
# The mechanism already existed: a route's `remediationParams` is substituted from the SAME spec
# the expectation is and cross-checked against these inputs at COMPILE (ADR-0118 D3), so a route
# wired to a Workflow it does not fit fails the compile rather than an operator's launch. Nothing
# had to be built — only declared. That is worth recording, because "the seam exists and nobody
# connected it" is now the most common defect shape in this repo.
inputs:
  type: object
  additionalProperties: false
  required: [nginx_port]
  properties:
    nginx_port:
      type: string
      minLength: 1
      description: >
        The desired listen port, resolved per-Assignment from the Blueprint default OR the
        Intent's override. A STRING, matching contracts/facets/app.config's observed port —
        nothing coerces between types (ADR-0118 D1), so an expectation and its converge must
        agree or they are never comparable.
steps:
  - name: configure
    # The dedicated real-node View (ADR-0084 fixture). ansible_host is rendered by the
    # shim from each target's mgmt.address — the core never authored it (§1.4).
    viewName: managed-web
    actuator: ansible-nginx
    # The machine credential (SSH key) — mounted at spawn, use-checked against the
    # launching Principal (§2.5). The AWX Machine-Credential half of the split.
    credentialRefs: [web-machine]
    # The remediation may write back only what it OBSERVES (ADR-0054): the effective port and
    # the installed package. Intersected with the Actuator's own ceiling.
    facetWriteScope: [app.config, software.package]
    params:
      # HOW to reach the targets (ADR-0126 D1). This is the REFERENCE estate, so it is
      # what an operator copies — which is exactly why it no longer teaches
      # `StrictHostKeyChecking=no` with a /dev/null known-hosts by example. The key path
      # is derived from the credentialRef above rather than restated as a literal (§2.4),
      # and the shim stages it at the mode SSH requires.
      connection:
        user: root
        credentialRef: web-machine
        # accept-new is the default and is stated anyway, because this node is ephemeral
        # and a reader should see the policy rather than infer it.
        hostKeyChecking: accept-new
      extraVars:
        # ansible_python_interpreter is left to auto-discovery so localhost (the EE) and
        # the target (alpine + python3) each resolve their own.
        # The desired listen port, from the LAUNCH — never a literal. Restating the Blueprint's
        # default here is what made an overriding fleet detect one value and converge another.
        nginx_port: "{{.launch.nginx_port}}"
      # The play is a PLAYBOOK now (ADR-0134), in the project this Step's Actuator declares:
      # estate/ansible/projects/platform-baseline/web-server-configure.yml. What is left here
      # is what this file was always for — WHAT runs, WHERE, and with WHICH inputs — and the
      # two languages no longer share a file. The extraVars mapping above stays, because it is
      # the declared translation from Stratt inputs to Ansible variable names; core never reads
      # the play to infer it (ADR-0117 D6).
      playbook: nginx-configure.yml
