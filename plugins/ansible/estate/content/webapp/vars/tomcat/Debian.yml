---
# Tomcat's layout on Debian/Ubuntu (ansible_os_family == "Debian"). Loaded by tomcat-configure.yml
# via the stratt_web_service role's prepare tasks.
#
# These values USED TO LIVE IN THE ESTATE — `tomcatHome`/`tomcatConfDir` were Blueprint defaults,
# threaded through the Workflow's declared inputs into extraVars (ANS-014). That put a fact about
# Debian's packaging in the layer that is supposed to hold desired state, and it made the tomcat
# Blueprint silently Debian-only: an estate assigning it to a RHEL host would have converged
# /etc/tomcat10 on a machine whose config lives in /etc/tomcat.
#
# CATALINA_HOME and CATALINA_BASE are DIFFERENT directories here, which is the detail the old single
# `tomcat_home` could not express: Debian ships the distribution under /usr/share/tomcat10 (bin/,
# lib/) and the instance under /var/lib/tomcat10 (conf → /etc/tomcat10, webapps/, work/, logs/).
# catalina.sh reads server.xml from $CATALINA_BASE/conf, so pointing BASE at HOME — which is what
# shipped — made it exit immediately with no server.xml. Nothing noticed, because the start task was
# `failed_when: false` and the observation greped the XML rather than the port.
svc_pkg: tomcat10
tomcat_home: /usr/share/tomcat10
tomcat_base: /var/lib/tomcat10
tomcat_conf_dir: /etc/tomcat10
# THE START COMMAND IS A PER-FAMILY FACT TOO, not just the paths — which is what executing RedHat
# proved. Debian ships upstream's catalina.sh and takes CATALINA_HOME/BASE from the environment;
# RHEL ships no catalina.sh at all. A play that hard-codes `catalina.sh` is not a play whose paths
# happen to be Debian's, it is a play that only works on Debian.
tomcat_start: >-
  CATALINA_HOME={{ tomcat_home }} CATALINA_BASE={{ tomcat_base }}
  {{ tomcat_home }}/bin/catalina.sh start
