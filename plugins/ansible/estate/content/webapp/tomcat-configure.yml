---
# Converge Tomcat on a host: INSTALL it, set the connector port, start it, then observe the RUNNING
# service. The remediation half of the drift loop for the `tomcat` Blueprint (ADR-0148).
#
# THE SECOND INSTANCE THAT JUSTIFIED THE ROLE. apache and tomcat share their ends exactly — guard
# the family, load the layout, install, and then the whole observe/fact-back tail — and share
# nothing in the middle. Tomcat is a JVM service with an XML connector and a catalina.sh; apache is
# a conf.d drop-in and an `httpd -k restart`. One instance plus an intuition produces an abstraction
# fitted to a single case; two instances across three distro families showed where the seam is.
#
# THE LAYOUT LIVES IN CONTENT (ANS-014). tomcat_home and tomcat_conf_dir used to be Blueprint
# defaults threaded through the Workflow's declared inputs, which put Debian's packaging in the layer
# that holds desired state and made this Blueprint silently Debian-only. They are read from the
# target's own facts now, exactly as the package name already was.
- name: Converge tomcat
  hosts: all
  gather_facts: true
  vars:
    # Debian is EXECUTED (`task dev:content:proof`); RedHat is declared and not — vars/tomcat/
    # RedHat.yml says so in the file. Keeping it in the list is a deliberate call: refusing it
    # outright would break an estate for which the documented layout is correct, and the guard's
    # job is to refuse families nobody has thought about, not families nobody has run yet.
    svc_families: [Debian, RedHat]
    svc_layout_dir: vars/tomcat
    svc_port: "{{ tomcat_port }}"
    # Tomcat 10 sends NO Server header, so there is nothing for the role's identity check to assert
    # on. Declared empty rather than omitted: the role requires the value precisely so that "this
    # service cannot be identified that way" and "nobody considered it" do not look the same.
    svc_server_token: ""
    # A JVM is not an httpd: catalina takes seconds to bind, so this is a startup budget rather
    # than a guess.
    svc_ready_timeout: 120
    # A stock Tomcat with no deployed ROOT webapp answers 404; with one, 200. A 403 would mean
    # something else is on the port.
    svc_ok_status: [200, 404]
  tasks:
    - name: Guard the family, load the layout, install tomcat
      ansible.builtin.include_role:
        name: stratt_web_service
        tasks_from: prepare

    # ── TOMCAT'S OWN MIDDLE ─────────────────────────────────────────────────────────────────
    # Narrowed to the HTTP/1.1 connector specifically. The regex used to be
    # `(<Connector\s+port=")\d+(")`, which also matched the SSL connectors — 2 replacements on
    # Debian, 3 on Rocky. It was harmless only by luck: those blocks sit inside XML comments in the
    # stock server.xml, and `replace` does not know what a comment is. Rewriting text a parser will
    # never read is the kind of accident that works until the day a distro ships one uncommented.
    - name: Set the desired connector port (idempotent — changed once, ok on re-run)
      ansible.builtin.replace:
        path: "{{ tomcat_conf_dir }}/server.xml"
        regexp: '(<Connector\s+port=")\d+("\s+protocol="HTTP/1\.1")'
        replace: '\g<1>{{ tomcat_port }}\g<2>'

    # A real converge, not just a file. Tomcat is started directly rather than through systemd:
    # this node is a container with no init, which is the ordinary shape of a dev fixture and
    # exactly why the play must not assume one.
    #
    # The bracketed first character is not decoration: `pkill -f org.apache…` matches THIS shell's
    # own command line, which contains that string, so it signalled itself and the task exited
    # rc=-15. The bracket makes the pattern not match its own literal text. It went unnoticed for as
    # long as the task carried `failed_when: false` — the kill happened, the restart never ran, and
    # the observation greped a file rather than the port, so a Tomcat that had NEVER STARTED
    # reported a converged one (ANS-014).
    - name: Start tomcat so the port takes effect
      # `tomcat_start` comes from the layout, because the launcher itself is a per-family fact: RHEL
      # ships no catalina.sh and starts via /usr/libexec/tomcat/server.
      #
      # DETACHED, not swallowed, and the distinction matters. RHEL's launcher runs in the FOREGROUND
      # (its systemd unit is Type=simple) where Debian's catalina.sh daemonizes — so a start that is
      # not backgrounded blocks forever, measured as a run that hung for the full 12-minute test
      # timeout. Detaching means there is no exit code to check here, and that is fine rather than a
      # compromise: `wait_for` in the observe half is a STRICTLY STRONGER gate than a launcher's
      # status, because a launcher can exit 0 and leave the JVM dead.
      ansible.builtin.shell: |
        pkill -f '[o]rg.apache.catalina.startup.Bootstrap' 2>/dev/null || true
        nohup sh -c '{{ tomcat_start }}' >/dev/null 2>&1 &
      register: started
      changed_when: false

    # ── OBSERVE BACK — from the RUNNING SERVICE, in the shared role ──────────────────────────
    - name: Observe the running service and report the facts Stratt reads
      ansible.builtin.include_role:
        name: stratt_web_service
        tasks_from: observe
