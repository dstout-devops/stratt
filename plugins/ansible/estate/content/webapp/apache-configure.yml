---
# Converge Apache on a host: INSTALL it, set the listen port, start it, then observe the RUNNING
# service. The remediation half of the drift loop for the `apache` Blueprint (ADR-0148).
#
# WHAT IS LEFT IN THIS FILE IS WHAT IS ACTUALLY APACHE. The family guard, the layout load, the
# install and the whole observe/fact-back tail now live in roles/stratt_web_service, because three
# plays across three distro families showed those ends are identical and the middle never is
# (ANS-002/ANS-007). The middle — a conf.d drop-in, a stock `Listen 80` to displace, and
# `httpd -k restart` — is apache's own and stays here where an author reads it.
#
# The variables it reads (apache_port) are supplied by the Step's extraVars, which map the
# Workflow's declared launch inputs onto these names — core never parses this file to discover that
# (ADR-0117 D6); the mapping is declared in the Workflow and a repo-hygiene guard checks they agree.
#
# WHAT THE DISTRO OWNS AND WHAT THE ESTATE OWNS. The Intent declares DESIRED STATE — a port — and
# nothing else. Everything about *where this distro keeps apache* is a fact about the target, so it
# is content's: vars/apache/{Alpine,Debian,RedHat}.yml, loaded from the target's own facts. A
# per-distro map in Intent/Application would be the other wrong answer — it makes core learn distro
# packaging (§1.1/§9 ontology creep) and is the env-keyed-values shape ADR-0118 D1 refuses, rotated
# one axis.
- name: Converge apache
  hosts: all
  gather_facts: true
  vars:
    # All three are EXECUTED, not merely declared: `task dev:content:proof` runs this play against
    # alpine:3.22, debian:12-slim and rockylinux:9. Adding a family means a vars file AND a node.
    svc_families: [Alpine, Debian, RedHat]
    svc_layout_dir: vars/apache
    svc_port: "{{ apache_port }}"
    svc_server_token: Apache
  tasks:
    - name: Guard the family, load the layout, install apache
      ansible.builtin.include_role:
        name: stratt_web_service
        tasks_from: prepare

    # ── APACHE'S OWN MIDDLE ─────────────────────────────────────────────────────────────────
    - name: Ensure the include directory exists
      ansible.builtin.file:
        path: "{{ apache_conf_dir }}"
        state: directory
        mode: "0755"

    - name: Set the desired listen port (idempotent — changed once, ok on re-run)
      ansible.builtin.copy:
        dest: "{{ apache_conf_dir }}/stratt.conf"
        mode: "0644"
        content: |
          Listen {{ apache_port }}
          <VirtualHost *:{{ apache_port }}>
            DocumentRoot {{ apache_docroot }}
          </VirtualHost>

    # Every family ships its own `Listen 80` — in httpd.conf on Alpine and RHEL, in ports.conf on
    # Debian — which would bind a port the estate never asked for and make the observation ambiguous
    # about which one is effective.
    #
    # NOT `failed_when: false`. It was, and that is what let the Debian path fail in silence: the
    # file simply did not exist there. These are distro-owned files, present by definition, so a
    # failure here means the layout is wrong for this target and the Run must say so.
    - name: Remove the stock Listen so the declared port is the only one
      ansible.builtin.replace:
        path: "{{ apache_listen_conf }}"
        regexp: '^Listen\s+80\s*$'
        replace: "# Listen 80 — superseded by stratt.conf (stratt-managed)"

    # ── TLS, if a certificate has been delivered ────────────────────────────────────────────
    # The app leg and the certificate leg COMPOSE THROUGH THE HOST, not through each other. Nothing
    # in the apache declaration names a certificate and nothing in the certificate declaration names
    # apache: the cert-issue flow delivers to /etc/stratt/pki and this play serves whatever is
    # there. ADR-0150 D5 makes that unambiguous — one Stratt-managed certificate per host — so
    # "whatever is there" is a definite article, not a guess.
    #
    # ABSENT IS NORMAL. A host with no certificate serves plain HTTP and converges green; TLS is not
    # a second Blueprint and not a required binding. That is deliberate: making it a binding would
    # mean an apache Intent could not be satisfied until a certificate existed, coupling two legs
    # the estate deliberately keeps separate.
    - name: Look for a delivered certificate
      ansible.builtin.find:
        paths: /etc/stratt/pki
        patterns: "*.crt"
      register: delivered_certs

    - name: Serve TLS with the delivered certificate
      when: delivered_certs.files | length == 1
      block:
        - name: Install the TLS module where the family ships it separately
          ansible.builtin.package:
            name: "{{ apache_ssl_pkg }}"
            state: present
          when: apache_ssl_pkg | length > 0

        - name: Enable the TLS module where the family ships it disabled
          ansible.builtin.command: "{{ apache_ssl_enable_cmd }}"
          when: apache_ssl_enable_cmd | length > 0
          changed_when: false

        # 000- SO IT LOADS FIRST, and that prefix is load-bearing rather than cosmetic. Apache
        # treats the FIRST vhost defined on a port as that port's default, and every family's ssl
        # package ships its own `<VirtualHost _default_:443>` with a self-signed snakeoil
        # certificate. conf.d loads alphabetically, so `stratt-tls.conf` sorted AFTER `ssl.conf` and
        # the stock vhost won: 443 listened, the converge went green, and the certificate presented
        # on the wire was the package's throwaway rather than the CA-issued one this estate had just
        # delivered. Measured with a handshake, not inferred from the config.
        - name: Write the TLS vhost (first on :443, so it is the default rather than the stock one)
          ansible.builtin.copy:
            dest: "{{ apache_conf_dir }}/000-stratt-tls.conf"
            mode: "0644"
            # ONLY the VirtualHost. Every family's ssl package/module already provides the
            # LoadModule and `Listen 443`; emitting our own made apache refuse to start with
            # "Cannot define multiple Listeners on the same IP:port" (measured on Alpine).
            content: |
              <VirtualHost *:443>
                DocumentRoot {{ apache_docroot }}
                SSLEngine on
                SSLCertificateFile {{ (delivered_certs.files | first).path }}
                # `crt$` → `key`, with NO backslash: the escaped form was written through a
                # generator, reached the file as `\\.crt$`, and matched nothing — so the KEY path
                # silently rendered as the CERT path. Apache then had a certificate where its
                # private key should be. A regex that fails to match is indistinguishable from one
                # that matches nothing, which is why the simplest expression that cannot be
                # mis-escaped is the right one here.
                SSLCertificateKeyFile {{ (delivered_certs.files | first).path | regex_replace('crt$', 'key') }}
              </VirtualHost>

    # Remove the vhost when the certificate is gone, so a revoked or withdrawn certificate stops
    # being served rather than leaving apache pointing at a file that is no longer there — which
    # fails the RESTART below and takes the whole service down with it.
    - name: Stop serving TLS when no certificate is delivered
      ansible.builtin.file:
        path: "{{ apache_conf_dir }}/000-stratt-tls.conf"
        state: absent
      when: delivered_certs.files | length != 1

    - name: Start apache so the port actually takes effect (a real converge, not just a file)
      ansible.builtin.shell: "{{ apache_ctl }} -k restart 2>/dev/null || {{ apache_ctl }} -k start"
      register: started
      changed_when: false

    # ── OBSERVE BACK — from the RUNNING SERVICE, in the shared role ──────────────────────────
    - name: Observe the running service and report the facts Stratt reads
      ansible.builtin.include_role:
        name: stratt_web_service
        tasks_from: observe
