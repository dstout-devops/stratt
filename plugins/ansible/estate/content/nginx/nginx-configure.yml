---
# Converge nginx on a host: set the listen port, start it, and read both facts back.
#
# The remediation half of the drift loop for the `web-server` Blueprint. It now lives in its OWN
# content root beside apache/ and tomcat/, rather than inside platform-baseline: one project per
# application, so each carries its own facetNamespaces write ceiling (ADR-0054/0117 D3a). It sat in
# platform-baseline because it was the only app there was; with three, that root goes back to being
# what its name says — OS hardening.
#
# NOTE THE DIFFERENCE FROM apache/tomcat, which is the honest one: this node ships nginx already
# (managed-web is nginx:alpine), so there is no install task and this play converges configuration
# only. The other two install onto bare nodes. Same skeleton, one fewer step — which is exactly the
# kind of variation a shared role has to accommodate rather than assume away.
#
# The variables this play reads (nginx_port) are supplied by the Step's extraVars,
# which map the Workflow's declared launch inputs onto these names. Core never parses this
# file to discover that (ADR-0117 D6); the mapping is declared in the Workflow, and the
# repo-hygiene guard in core/internal/desiredstate/unbound_playvars_test.go checks the two
# agree.
- name: Converge the web server listen port
  hosts: all
  gather_facts: false
  tasks:
    # The key-staging bootstrap task is GONE (ADR-0126 D1): the shim stages the
    # credentialRef's key at the mode SSH requires, so a play no longer opens with
    # a copy task it had to know to write.
    - name: Ensure the nginx conf.d directory exists
      ansible.builtin.file:
        path: /etc/nginx/conf.d
        state: directory

    - name: Set the desired nginx site (idempotent — changed once, ok on re-run)
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/stratt.conf
        content: |
          server {
            listen {{ nginx_port }};
            server_name _;
            location / { return 200 'stratt managed-web listening on {{ nginx_port }}\n'; }
          }

    - name: Reload nginx so the port takes effect (a real converge, not just a file)
      ansible.builtin.command: nginx -s reload
      register: reload
      failed_when: false
      changed_when: false

    # ── OBSERVE BACK — from the RUNNING SERVICE ─────────────────────────────────────────────
    # This used to grep the file the play had just written and call it "the effective listen port
    # back from the running config". It was an echo — it could only ever return the desired value,
    # including on a host where nginx had failed to reload — and the drift Finding resolved on it
    # (ANS-014). An observation that cannot come back wrong is not one. These can, and they fail
    # the Run rather than reporting, because a converge that did not converge is a failure and not
    # a fact (§1.8).
    #
    # nginx's paths need no per-family vars the way apache's do: conf.d/ and `nginx -s reload` are
    # the same on Alpine, Debian and RHEL. That is a property of nginx's packaging, not a shortcut
    # taken here — apache genuinely has three layouts and gets three vars files.
    - name: OBSERVE — the declared port genuinely accepts connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ nginx_port | int }}"
        timeout: 30
        msg: >-
          nothing is listening on {{ nginx_port }} after the converge. Reload output was:
          {{ reload.stdout | default('') }} {{ reload.stderr | default('') }}

    - name: OBSERVE — and that what answers there is really nginx
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginx_port }}/"
        status_code: [200, 403, 404]
      register: served

    - name: OBSERVE — the running server identifies as nginx, not merely as something on that port
      ansible.builtin.assert:
        that: "'nginx' in (served.server | default('') | lower)"
        fail_msg: >-
          port {{ nginx_port }} answered but Server: {{ served.server | default('(none)') }} —
          something other than nginx holds the port this Blueprint claims

    - name: OBSERVE the installed package + version
      ansible.builtin.package_facts:
        manager: auto

    - name: Report the observed facts to Stratt (fact-back → Finding resolves)
      ansible.builtin.set_fact:
        stratt_facets:
          app.config:
            # Reported only because the running service answered on it and identified as nginx —
            # the tasks above fail the Run otherwise.
            port: "{{ nginx_port }}"
          # The same {name, version, origin, deliveryForm} component shape apache and tomcat report
          # (ADR-0080), so the ONE form-agnostic advisory pass covers all three identically. This is
          # the half that makes "which of my web tiers is running a vulnerable version?" a graph
          # question rather than three different log greps.
          software.package:
            packages:
              - name: nginx
                version: "{{ ansible_facts.packages['nginx'][0].version | default('unknown') }}"
                origin: distro
                deliveryForm: package
