---
# Write the CA-signed certificate onto the target and report what landed (CERT-2, ADR-0150 D5).
#
# The third verb of W4 (issuance, renewal, DELIVERY). It receives the signed certificate from the
# signing Step — {{.steps.sign.outputs.certificate}} — mapped onto `cert_pem` by the Workflow's
# extraVars, and never touches a private key: the key was generated by csr-gather.yml on this same
# host and has not moved since.
#
# WHY THIS IS NOT AN Intent/FileSet. FileSet is content-addressed: its route compares
# fileset.content.<key>.digest against a sha256 DECLARED IN GIT. A certificate's bytes change at
# every renewal, so nobody can declare that digest in advance — the expectation would be permanently
# unmet and the remediation would re-apply forever (CERT-2's first wrong answer, and the shipped
# nginx-conf Intent still carries a sha256:0000… placeholder that proves the shape). Delivery
# belongs to the Run that PRODUCES the artifact, which is this one.
- name: Deliver the signed certificate
  hosts: all
  # Facts gathered for the same reason csr-gather.yml gathers them: the crypto prerequisite below
  # is named differently per distribution, and `min` carries os_family.
  gather_facts: true
  gather_subset: [min]
  vars:
    # community.crypto's modules run ON THE TARGET, so `cryptography` is a target dependency the EE
    # cannot satisfy. Repeated from csr-gather.yml rather than assumed: a play that only works when
    # another play ran first has a dependency nobody declared.
    cert_crypto_package:
      Alpine: py3-cryptography
      Debian: python3-cryptography
      RedHat: python3-cryptography
      Suse: python3-cryptography
  tasks:
    - name: A distribution with no mapped cryptography package must fail here, by name
      ansible.builtin.assert:
        that: ansible_facts['os_family'] in cert_crypto_package
        fail_msg: >-
          no cryptography package is mapped for os_family "{{ ansible_facts['os_family'] }}" —
          add it to cert_crypto_package. Reading the delivered certificate back needs it, and
          guessing a package name would fail further from the cause (§1.8)

    - name: Ensure the target can read a certificate back (community.crypto executes here)
      ansible.builtin.package:
        name: "{{ cert_crypto_package[ansible_facts['os_family']] }}"
        state: present

    - name: Write the certificate
      ansible.builtin.copy:
        dest: "{{ cert_dir }}/{{ cert_common_name }}.crt"
        content: "{{ cert_pem }}"
        # 0644: the certificate is public. Its key sits beside it at 0600 and is untouched here.
        mode: "0644"
        owner: root
        group: root

    # OBSERVE BACK from the file that actually landed, not from the variable we were handed — the
    # ANS-014 rule. Reporting the digest of what we intended to write would make a failed copy
    # indistinguishable from a successful one.
    - name: OBSERVE the delivered certificate
      ansible.builtin.stat:
        path: "{{ cert_dir }}/{{ cert_common_name }}.crt"
        checksum_algorithm: sha256
      register: delivered

    - name: The certificate must exist after delivery
      ansible.builtin.assert:
        that: delivered.stat.exists
        fail_msg: >-
          {{ cert_dir }}/{{ cert_common_name }}.crt is absent after the delivery task reported
          success — the Run must fail rather than report a certificate nobody can find (§1.8)

    # PARSE THE FILE ON THE HOST, which is the whole point of cert.presented (ADR-0150 D5): the
    # subject, expiry and issuer below are read from the bytes that landed, never restated from the
    # request. A certificate issued for the wrong subject, or by the wrong CA, becomes a graph fact
    # rather than something an operator has to go looking for.
    - name: Read the delivered certificate back
      community.crypto.x509_certificate_info:
        path: "{{ cert_dir }}/{{ cert_common_name }}.crt"
      register: presented

    # RFC3339, converted here rather than shipped raw. x509_certificate_info returns ASN.1 TIME
    # (`20260829125544Z`), and the notBefore expectation operator — and the Facet's own
    # `format: date-time` — want RFC3339. Reported raw, the drift evaluator said exactly what was
    # wrong ("value is not an RFC3339 timestamp") and the Finding stayed open forever: the renewal
    # loop cannot compare a timestamp it cannot parse. The tool's format is the tool's; the Facet's
    # is the platform's, and the SHIM boundary is where one becomes the other (§1.1).
    #
    # ONE Jinja EXPRESSION for the whole structure, and that is a FIX rather than a style choice.
    # An earlier revision wrote the fileset key as a templated YAML key:
    #
    #     stratt_facets:
    #       fileset.content:
    #         "{{ cert_common_name }}-crt": { ... }
    #
    # ...and it reached the graph as the LITERAL text `{{ cert_common_name }}-crt` (measured on the
    # live floor: that is the key sitting in graph.facet today). set_fact does not template mapping
    # KEYS the way it templates values, so the facet was written under a name no query could match —
    # silently, because an unresolved template is a perfectly good string. Building the whole map
    # inside one `{{ }}` evaluates keys and values alike.
    - name: Report the delivered certificate to Stratt
      ansible.builtin.set_fact:
        stratt_facets: >-
          {{
            {
              'fileset.content': {
                cert_common_name ~ '-crt': {
                  'digest': 'sha256:' ~ delivered.stat.checksum,
                  'mode': delivered.stat.mode,
                  'present': true
                }
              },
              'cert.presented': {
                'commonName': presented.subject.commonName,
                'notAfter': (presented.not_after | to_datetime('%Y%m%d%H%M%SZ')).strftime('%Y-%m-%dT%H:%M:%SZ'),
                'notBefore': (presented.not_before | to_datetime('%Y%m%d%H%M%SZ')).strftime('%Y-%m-%dT%H:%M:%SZ'),
                'serial': presented.serial_number | string,
                'issuer': presented.issuer.commonName
              }
            }
          }}
