---
# Tomcat's layout on RHEL/Rocky/Fedora (ansible_os_family == "RedHat"). Loaded by tomcat-configure.yml.
#
# UNEXECUTED, and labelled as such. `task dev:content:proof` runs tomcat on Debian only, so this
# file is the layout RHEL's `tomcat` package documents rather than one that has been observed
# converging. It exists because the play must refuse an unknown family loudly rather than falling
# through to Debian's paths — the ANS-014 defect exactly — and because a named gap is reviewable
# where a silent default is not. Add a RedHat node to the proof before claiming this family works.
tomcat_pkg: tomcat
tomcat_home: /usr/share/tomcat
# RHEL keeps HOME and BASE as one directory (with conf/ symlinked to /etc/tomcat), unlike Debian's
# split — which is precisely why the play reads both from here rather than deriving one.
tomcat_base: /usr/share/tomcat
tomcat_conf_dir: /etc/tomcat
