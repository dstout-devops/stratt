---
# Apache's layout on Alpine (ansible_os_family == "Alpine"). Loaded by apache-configure.yml.
#
# Alpine packages upstream httpd's own layout under the name `apache2`: an httpd.conf that carries
# the stock `Listen 80`, a conf.d/ include directory, and the `httpd` binary. It is NOT Debian's
# layout despite sharing the package name — which is exactly the defect this file exists to fix
# (ANS-014): the play resolved the PACKAGE name from the distro and then hard-coded these paths for
# every distro, so on Debian it wrote configuration apache never reads and reported success.
apache_pkg: apache2
apache_ctl: httpd
apache_conf_dir: /etc/apache2/conf.d
apache_listen_conf: /etc/apache2/httpd.conf
apache_docroot: /var/www/localhost/htdocs
