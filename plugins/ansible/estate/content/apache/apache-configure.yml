---
# Converge Apache on a host: INSTALL it, set the listen port, start it, then observe the RUNNING
# service — not the file this play just wrote.
#
# The remediation half of the drift loop for the `apache` Blueprint (ADR-0148). The variables it
# reads (apache_port) are supplied by the Step's extraVars, which map the Workflow's declared launch
# inputs onto these names — core never parses this file to discover that (ADR-0117 D6); the mapping
# is declared in the Workflow and a repo-hygiene guard checks the two agree.
#
# WHAT THE DISTRO OWNS AND WHAT THE ESTATE OWNS (ANS-014). The Intent declares DESIRED STATE — a
# port — and nothing else. Everything about *where this distro keeps apache* is a fact about the
# target, so it belongs to content: vars/{Alpine,Debian,RedHat}.yml, loaded from the target's own
# facts. An earlier revision got half of this right and was worse for it: it resolved the PACKAGE
# name per family (`'httpd' if RedHat else 'apache2'`) and then hard-coded Alpine's paths for
# everyone. Measured on debian:12-slim, Debian's apache2 has no conf.d, no httpd.conf and no `httpd`
# binary — so the play wrote configuration apache never reads, into a directory it created itself,
# and every step that would have said so was `failed_when: false`. It reported success on a host
# where apache was not running. A per-distro map in Intent/Application would be the other wrong
# answer: that makes core learn distro packaging (§1.1/§9 ontology creep) and is the env-keyed-values
# shape ADR-0118 D1 refuses, rotated one axis.
- name: Converge apache
  hosts: all
  gather_facts: true
  tasks:
    # An unknown family must STOP, not fall through to a default. Falling through is how the
    # original defect stayed invisible: Alpine's layout was the default for everyone, and a
    # silently-wrong path is indistinguishable from a correct one until someone connects to the
    # port (§1.8 — the abstraction may hide mechanism, never failure).
    - name: Refuse a distro family this content has no layout for
      ansible.builtin.assert:
        that: ansible_facts.os_family in ['Alpine', 'Debian', 'RedHat']
        fail_msg: >-
          apache content has no layout for os_family={{ ansible_facts.os_family }}. Add
          content/apache/vars/{{ ansible_facts.os_family }}.yml (package, ctl binary, conf dir,
          the file holding the stock Listen, docroot) and add a node for it to
          `task dev:content:proof` — a layout that has never been executed is not support.

    - name: Load this distro's apache layout
      ansible.builtin.include_vars: "vars/{{ ansible_facts.os_family }}.yml"

    - name: Install the web server package (distro-resolved by ansible, not by Stratt)
      ansible.builtin.package:
        name: "{{ apache_pkg }}"
        state: present

    - name: Ensure the include directory exists
      ansible.builtin.file:
        path: "{{ apache_conf_dir }}"
        state: directory
        mode: "0755"

    - name: Set the desired listen port (idempotent — changed once, ok on re-run)
      ansible.builtin.copy:
        dest: "{{ apache_conf_dir }}/stratt.conf"
        mode: "0644"
        content: |
          Listen {{ apache_port }}
          <VirtualHost *:{{ apache_port }}>
            DocumentRoot {{ apache_docroot }}
          </VirtualHost>

    # Every family ships its own `Listen 80` — in httpd.conf on Alpine and RHEL, in ports.conf on
    # Debian — which would bind a port the estate never asked for and make the observation below
    # ambiguous about which one is effective.
    #
    # NOT `failed_when: false`. It was, and that is what let the Debian path fail in silence: the
    # file simply did not exist there. These are distro-owned files that are present by definition,
    # so a failure here means the layout above is wrong for this target and the Run must say so.
    - name: Remove the stock Listen so the declared port is the only one
      ansible.builtin.replace:
        path: "{{ apache_listen_conf }}"
        regexp: '^Listen\s+80\s*$'
        replace: "# Listen 80 — superseded by stratt.conf (stratt-managed)"

    - name: Start apache so the port actually takes effect (a real converge, not just a file)
      ansible.builtin.shell: "{{ apache_ctl }} -k restart 2>/dev/null || {{ apache_ctl }} -k start"
      register: started
      changed_when: false

    # ── OBSERVE BACK — from the RUNNING SERVICE ─────────────────────────────────────────────
    # The previous version of this section greped the file the play had just written, two tasks
    # above, and called it "the effective listen port from the running config". It was an echo: it
    # would report the desired port for a host where apache had never started, the drift Finding
    # would RESOLVE, and the estate would believe a dead service was converged. The comment sitting
    # over it said "a play that wrote the right file to a dead service would report success" — which
    # is precisely what it did.
    #
    # An observation has to be able to come back WRONG. These two can: the port must genuinely
    # accept a connection, and what answers there must genuinely be apache. Both fail the Run rather
    # than reporting, because a converge that did not converge is a failure and not a fact (§1.8).
    - name: OBSERVE — the declared port genuinely accepts connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ apache_port | int }}"
        timeout: 30
        msg: >-
          nothing is listening on {{ apache_port }} after the converge. Start output was:
          {{ started.stdout | default('') }} {{ started.stderr | default('') }}

    - name: OBSERVE — and what answers there is really apache
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ apache_port }}/"
        # A bare vhost may 200 (index present), 403 (no index, no autoindex) or 404. All three prove
        # an HTTP server answered; only a connection error or a 5xx does not.
        status_code: [200, 403, 404]
      register: served

    - name: OBSERVE — the running server identifies as apache, not merely as something on that port
      ansible.builtin.assert:
        that: "'Apache' in (served.server | default(''))"
        fail_msg: >-
          port {{ apache_port }} answered but Server: {{ served.server | default('(none)') }} —
          something other than apache holds the port this Blueprint claims

    - name: OBSERVE the installed package + version
      ansible.builtin.package_facts:
        manager: auto

    - name: Report the observed facts to Stratt (fact-back → the Finding resolves)
      ansible.builtin.set_fact:
        stratt_facets:
          app.config:
            # The desired value, reported ONLY because the running service answered on it: the
            # three tasks above fail the Run otherwise, so this line is unreachable for a host that
            # is not actually serving there. That is a different claim from grepping our own file,
            # and it is the one app.config's schema documents ("the effective listen port the
            # configure Run read back from the target after converging it").
            port: "{{ apache_port }}"
          # software.package is the HOST form of the deliverable-software dimension (ADR-0080):
          # the same `{name, version, origin, deliveryForm}` component shape software.container and
          # software.chart carry, so the ONE form-agnostic advisory pass covers an apache installed
          # here exactly as it covers a chart. That is what makes "is it installed, and is that
          # version vulnerable?" answerable from the graph rather than from this play's log.
          software.package:
            packages:
              - name: "{{ apache_pkg }}"
                version: "{{ ansible_facts.packages[apache_pkg][0].version | default('unknown') }}"
                origin: distro # the schema documents distro|internal|external|vendor
                deliveryForm: package
