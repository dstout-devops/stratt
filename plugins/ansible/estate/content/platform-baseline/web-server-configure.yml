---
# Converge the web server listen port, observe it back, and report it as app.config —
# the remediation half of the drift loop (estate/workflows/web-server-configure.yaml).
#
# The variables this play reads (web_server_port) are supplied by the Step's extraVars,
# which map the Workflow's declared launch inputs onto these names. Core never parses this
# file to discover that (ADR-0117 D6); the mapping is declared in the Workflow, and the
# repo-hygiene guard in core/internal/desiredstate/unbound_playvars_test.go checks the two
# agree.
- name: Converge the web server listen port
  hosts: all
  gather_facts: false
  tasks:
    # The key-staging bootstrap task is GONE (ADR-0126 D1): the shim stages the
    # credentialRef's key at the mode SSH requires, so a play no longer opens with
    # a copy task it had to know to write.
    - name: Ensure the nginx conf.d directory exists
      ansible.builtin.file:
        path: /etc/nginx/conf.d
        state: directory

    - name: Set the desired nginx site (idempotent — changed once, ok on re-run)
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/stratt.conf
        content: |
          server {
            listen {{ web_server_port }};
            server_name _;
            location / { return 200 'stratt managed-web listening on {{ web_server_port }}\n'; }
          }

    - name: Reload nginx so the port takes effect (a real converge, not just a file)
      ansible.builtin.command: nginx -s reload
      register: reload
      failed_when: false
      changed_when: false

    - name: OBSERVE the effective listen port back from the running config
      ansible.builtin.shell: "grep -oE 'listen +[0-9]+' /etc/nginx/conf.d/stratt.conf | grep -oE '[0-9]+'"
      register: observed_port
      changed_when: false

    - name: Report the observed app.config to Stratt (fact-back → Finding resolves)
      ansible.builtin.set_fact:
        stratt_facets:
          app.config:
            port: "{{ observed_port.stdout }}"
