# Access collector (ADR-0036): a scheduled, read-only gather Run that projects
# observed host-access grants as the access.grants Facet (charter §1.2,
# project-then-observe — the CIS precedent, ADR-0033). It mutates nothing; the
# projection is the Run's side-effect (WriterRun provenance). The compiled
# Access Baselines ensure-contain each desired grant; unmanaged grants surface
# in the recertification report.
#
# The set_fact name (stratt_access) and its array-of-{subject, kind, scope}
# shape are a contract with the ansible actuator's ExtractFacts and the pinned
# access.grants schema. Public keys only — no private material (§2.5). v1
# enumerates local group membership; sudoers/authorized_key/account enumeration
# is the operator-tunable part (structurally valid, not e2e-run this slice).
name: access-collector
kind: schedule
# Environment scope (ADR-0057): the production slice. This scheduled gather Run
# targets the secure-hosts fleet, which only exists where real hosts are
# projected — not in the dev cell — so a dev daemon (STRATT_ENVIRONMENT=dev)
# skips it instead of firing ansible against an empty View. Untag to run everywhere.
environments: [prod]
cron: "*/15 * * * *"
viewName: secure-hosts
principal: svc-collector
actuator: ansible-access-control
# This gather Run PROJECTS the access.grants Facet (ADR-0054 write-scope): the
# effective write-back is the ansible grant ∩ this scope. Without it the tight
# default would drop the projection at the one governor.
facetWriteScope: [access.grants]
params:
  # estate/ansible/projects/access-control/collect.yml (ADR-0134). A Trigger reaches a
  # playbook exactly as a Workflow Step does — the content root is a property of the
  # Actuator named above, so nothing about the launch path is special-cased.
  playbook: collect.yml
