# opentofu-network — OpenTofu as the AWS network `provisioning` provider (ADR-0112), the
# charter-canonical network builder (§5.1: tofu apply → outputs → Normalizer → ansible Step).
# It dials the same opentofu plugin pod as opentofu-s3; provider verification (ADR-0104 D1) confirms
# the pod's Manifest advertises `provisioning` before any consumer binds.
#
# It composes TWO capabilities on one build Actuator (ADR-0112 D1):
#   requires: [statestore, ipam]
#     - statestore (ADR-0105) → the S3 tofu backend, resolved+injected at Run dispatch.
#     - ipam       (ADR-0111) → a NetBox-allocated CIDR, injected as a module var (stratt_ipam_cidr).
#   So this Actuator stays PENDING (registry D6, §1.8) until BOTH a verified statestore AND a verified
#   ipam provider exist — observable, never a silent no-op.
#
# provisions advertises its per-kind build Workflow (ADR-0110 D3): Subnet → opentofu-subnet-build,
# which runs the AWS network module. This makes Subnet a >1-provider case (opentofu + crossplane) →
# the explicit estate/capability-bindings/ entry selects opentofu (ADR-0110 D5 demotion, ADR-0112 D6).
name: opentofu-network
address: stratt-opentofu:9090
pluginIdentity: opentofu
tier: trusted
dryRunnable: true
# The landscape this provider builds in (ADR-0151 D1). The MODULE targets AWS, so this builder
# does too — a Subnet it builds carries aws.subnetId, and a host placed in one must come from a
# provider of the same substrate or the placement cannot resolve (ADR-0147 D3, ADR-0151 D3).
substrate: aws
provides: [provisioning]
requires: [statestore, ipam]
# The build's ENTRY POINT is a targetless Action, not this Actuator's Apply verb (ADR-0145 D1).
# A `tofu apply` converges a WORKSPACE: it reads no target set and folds its result under the
# workspace-root item_key "", so there is no View to actuate against — and the label a build's
# projection must carry (stratt.intent/singleton, below) can only arrive through an Action's
# estate overlay, because the plugin refuses any stratt.*-prefixed label coming out of a module.
#
# `requires:` now reaches BOTH surfaces. It always described this declaration, but capability
# injection existed only on the Actuator verbs, so an Action served here would have run tofu with
# no S3 backend and no NetBox-allocated CIDR while reporting success. ADR-0145 D2 carried the
# handles to the Invoke seam; the Action gets the same statestore + ipam the Apply verb does.
actionNames:
  - opentofu/apply
# Identity: the module emits the built subnet under `aws.subnetId` — the SAME scheme the awsec2
# Syncer uses (ADR-0112 D5), so this build's identity-only Entity and the Syncer's net.subnet
# Facet co-own ONE subnet rather than splitting into two.
identitySchemes: [aws.subnetId]
# The CORRELATION LABEL is granted explicitly. The provisioning loop closes on exactly this key:
# the build projects the subnet carrying stratt.intent/singleton, and the next reconcile reads
# only that key back to see the desired singleton as built. Ungranted, Host.toUpsert DROPS it
# instead of refusing — the Entity lands, the Run goes green, and the only symptom is the same
# build offered again next pass. `source` is the module's own descriptive label.
labelKeys: [source, stratt.intent/singleton]
# provisions advertises the per-kind build Workflow (ADR-0110 D3) — RESTORED. It was withdrawn
# because `opentofu-subnet-build` had never been written: validateProvisions only checked the
# entry was non-empty, so a declared Intent/Subnet produced a build Finding offering a Workflow
# nobody could launch, discovered by an operator at the gate. That left Subnet provisioning dead
# in the reference estate — app-subnet and dmz-subnet unbuildable, and app-tier's placement
# depends on app-subnet — which made ADR-0110 D5's demotion of the Crossplane subnet builder in
# favour of OpenTofu (the charter-canonical network builder, §5.1/§5.2/§3) declared but never
# delivered. The Workflow now exists, and checkProvisioningBuildInputs verifies at load that it
# resolves, so this entry cannot go stale the same way twice.
provisions:
  Subnet: opentofu-subnet-build
