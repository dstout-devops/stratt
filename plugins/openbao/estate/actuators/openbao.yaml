# openbao — the OpenBao multi-capability PROVIDER (ADR-0106), registered as an Actuator Kind
# (ADR-0103) declaring provides:[keycustodian]. It dials the same openbao plugin pod (whose cert
# Syncer + WrapKey/UnwrapKey stay boot-env for now; the cert-issuer reconcile Actuator has since
# become its own declaration beside this file); provider verification (ADR-0104 D1) confirms the
# pod's Manifest advertises the class before any consumer binds.
#
# keycustodian is ENABLEMENT-GATE (ADR-0106 D1), not resolve-inject — so there is no resolve Action
# here: it is consumed via WrapKey/UnwrapKey + portCustodian (ADR-0100, and the core's own use
# deliberately stays there, D4). `requires:[keycustodian]` only gates that a verified provider EXISTS.
# secretbroker is NOT provided here — its material resolution is SDK-side (ADR-0094/0106 D3).
#
# `certissuer` USED TO BE declared here too, and has MOVED to the cert-issuer Actuator declaration
# beside this file. It was advertised by a declaration that is not the thing serving it: certissuer is
# consumed by dispatching the target-scoped cert-issuer Actuator (ADR-0098), and THIS declaration
# carries no facetNamespaces, so a capability-typed reconcile resolving here would have written back
# nothing. The provider must be the mechanism (ADR-0140 D2). Both must not advertise it — two
# declarations for one class are two providers, and resolution fails closed as ambiguous (§2.4).
#
# OpenBao is provider #1 of each class (§1.5) — swappable behind the same contract.
name: openbao
address: stratt-openbao:9090
pluginIdentity: openbao
tier: trusted
provides: [keycustodian]
