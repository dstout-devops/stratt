# crossplane — a `provisioning` capability PROVIDER (ADR-0110 D5), registered as an Actuator Kind
# declaring provides:[provisioning]. It dials the crossplane plugin pod (whose Apply/Observe build
# loop stays boot-env for now); provider verification (ADR-0104 D1) confirms the pod's Manifest
# advertises provisioning before any consumer binds.
#
# `provisions` advertises Crossplane's per-kind build WORKFLOWS (ADR-0110 D3): it is the SOLE builder
# of Vlan (AWS has no VLAN primitive — the acknowledged exception, ADR-0110 D5) and, until an
# alternative subnet provider lands (Slice 1), the sole builder of Subnet too — so both auto-bind here
# with no explicit capability-binding. When Slice 1 adds an awsec2/opentofu subnet builder, Subnet
# gains a second provider and an estate capability-binding selects one (the build demotion, ADR-0110 D5).
#
# Crossplane stays BINDABLE, never the default by fiat: it is one provider among several behind the
# `provisioning` class (§1.5). Its OBSERVE/Syncer role (projecting Crossplane-managed resources) is
# unchanged and orthogonal to this build-provider advertisement.
name: crossplane
address: stratt-crossplane:9090
pluginIdentity: crossplane
tier: trusted
# The Actuator's Plan/Apply verbs — the same posture the boot block registered it with.
dryRunnable: true
provides: [provisioning]
# ── The grant, MOVED here from main.go (ADR-0103) ────────────────────────────────────────────
# This declaration and a boot block both registered the name `crossplane`, which is a §2.4
# collision: whichever ran first won and the other was rejected, so "which grant is live?" was
# unanswerable from Git. Boot ran first, so THIS declaration was the one being rejected — it
# looked declared and was not the thing executing.
#
# The grant could not simply be dropped, either. The boot block carried facetNamespaces,
# identitySchemes AND labelKeys, and the Actuator Kind had no `labelKeys` field at all (only the
# Connector Kind did, since ADR-0047 §4). Declaring crossplane without it would have silently
# NARROWED its authority: an ungranted label key is dropped at the governor, never refused, so the
# build would stop labelling projected subnets and nothing would say so. The field was added to the
# Kind for this migration rather than the narrowing being accepted.
facetNamespaces: [net.subnet]
identitySchemes: [crossplane.claim]
# The CORRELATION LABEL is granted explicitly, and it is not optional garnish: the provisioning
# loop closes on it. A build projects the Entity it made carrying stratt.intent/singleton, and the next
# reconcile reads ONLY that key back to see the desired unit as built. It was missing here, and
# the failure mode is why it stayed missing: Host.toUpsert DROPS an ungranted label key rather
# than refusing the projection, so the Entity still lands, the Run still goes green, and the sole
# symptom is a build offered again on the next pass. TestProvisioningActuatorsGrantTheirCorrelationLabel
# now refuses a `provisions` advertisement without it.
labelKeys: [source, fleet, role, tier, stratt.intent/singleton]
# The targetless builder an Intent/Subnet launches (ADR-0059) — the same Action the boot block
# registered, now verified against the plugin's own Manifest at enable.
actionNames: [crossplane/provision]
provisions:
  # Subnet is DEMOTED here, and it costs something worth naming (ADR-0150 / NET-5).
  #
  # `Intent/Subnet` now declares an allocation REQUEST (size + pool) rather than a literal CIDR,
  # because ADR-0112 D5's claim is that a subnet's address is allocated and ADR-0111 makes the
  # allocator the system of record. opentofu's builder obtains the CIDR from the `ipam` capability
  # and injects it as a module var. THIS builder cannot: the crossplane plugin consumes no resolved
  # capabilities at all, so `requires: [ipam]` would resolve a handle it ignores, and its
  # subnet-build bound `{{.launch.params.cidr}}` — a value the Intent no longer declares and could
  # not declare without becoming a second source of truth for the address (§2.4).
  #
  # WHAT THIS COSTS: ADR-0112 D6 deliberately made Subnet a >1-provider case so the
  # estate/capability-bindings entry had something real to disambiguate. With one provider that
  # binding is vacuous, and the demotion machinery loses its live consumer. That is a genuine loss,
  # and it does not buy back an advertisement the provider cannot honour — the same rule that
  # refused `provides:` with no `remediates` on cert-issuer and `provisions:` with no Workflow on
  # opentofu-network. Restoring the line is one plugin change away (consume the ipam handle) and is
  # booked rather than forgotten.
  Vlan: vlan-build
