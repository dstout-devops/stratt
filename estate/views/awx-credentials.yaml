# The AWX-estate audit View over the ansible.credential mirror the ansible-automation
# Connector's controller half projects (§1.2 read-only, ADR-0128 D2). NAME AND KIND ONLY —
# no credential material is ever projected (§2.5); AWX returns $encrypted$ placeholders for
# secret fields and the plugin does not read even those.
#
# This View is why the namespace exists. "Which templates use this credential?" is the most
# -asked AWX audit question and the one that matters on the day a credential is rotated or
# compromised, and answering it by TRAVERSAL — ansible.template --uses-credential-->
# ansible.credential — is the estate-graph thesis (charter §7.1) applied to the system
# Stratt replaces. An array of names on the template facet would have answered it by scan,
# carried no kind, and left nothing to attach the next credential fact to.
#
# NOT CredentialRef. This is the read-only mirror of a foreign object, exactly as
# ansible.template mirrors a job template; CredentialRef is the frozen Named Kind it
# becomes when `stratt adopt` takes authority (§2).
name: awx-credentials
selector:
  kinds: [ansible.credential]
