# svc-servers — the hosts svc-fleet builds, whatever builds them.
#
# Selects on `fleet`, the label the builder stamps from the Intent's own labels — a key kubecompute
# is granted (ADR-0041: one owner per label key, and a builder may only write keys it owns). It
# names no substrate and no host.
name: svc-servers
selector:
  kinds: [host]
  labels:
    fleet: svc
