# app-tier — Intent/Compute (ADR-0058 + ADR-0059 decision 5): compute PLACED-IN a subnet.
# "One app host, in the app-subnet" — declared from the simplest form. Not an Entity
# (§1.2): the provisioning reconcile compares this count against the hosts already
# projected+correlated and surfaces a GATED build. `placement.subnet` rides the Intent
# (a Relation cannot be declared in Git) — the build honors it by projecting the host IN
# that subnet (a placed-in edge, Run-provenance). When declared placement diverges from a
# host's OBSERVED placement, the reconcile raises a placement-drift Finding (§1.8).
#
# THIS INTENT COULD NOT BE BUILT, and had not been able to for as long as it has existed
# (ADR-0146 D4). It declared `params: {tier: app}` while compute-build binds
# {{.launch.params.region}}, {{.launch.params.instanceType}} and {{.launch.params.ami}} — and
# `params` is opaque to core (§1.5), so nothing typed it and nothing checked it. The substituter
# refuses an unknown field, so the failure landed at launch, AFTER an operator approved the gate.
# It is now refused at load.
#
# THE AWS COORDINATES THAT FIX BOUGHT ARE GONE AGAIN, and the difference is the line below.
# `region: us-east-1`, `instanceType: t3.micro` and `ami: ami-0linuxbaseline000` were declared here
# to satisfy awsec2's compute-build — a builder that does not run for this Intent in either
# environment it is reconciled in. They were not inert: kubecompute, which DOES build it in dev,
# emitted `provider params ami,instanceType,region,tier ignored` on every single build
# (plugins/kubecompute/server.go:274). `tier` is still in that list and stays, because it is the one
# param this Intent ever meant; the other three were there for a builder that never runs.
#
# The load-time check had to demand them because it could not know WHERE this Intent is reconciled,
# so it checked it against every substrate's builder at once. `environments:` answers that question.
# The two named are where the estate binds a Compute provider AT ALL: dev binds the kubernetes
# substrate (capability-bindings/provisioning-kube.yaml) and vsphere-dc binds vcenter. PROD IS NOT
# HERE AND WAS NEVER BUILDABLE — it has two unscoped verified Compute providers and no binding, so
# resolution fails closed on the ambiguity (§2.4) and this Intent could only ever have surfaced a
# build Finding with no Workflow behind it. Naming dev and vsphere-dc is therefore not a withdrawal:
# it is the whole set where anything could happen, written down.
environments: [dev, vsphere-dc]
name: app-tier
kind: Intent/Compute
spec:
  count: 1
  namePrefix: app
  projectKind: host
  labels: { fleet: app }
  requires: [provisioning] # the capability CLASS (ADR-0110), never a provider name (§1.5)
  placement:
    subnet: app-subnet # placed-in the built subnet (ADR-0059 decision 5)
  params: # OPAQUE — validated against the resolved provider's own input Contract (§1.5)
    # `tier` is the only param this Intent ever meant. The AWS coordinates that sat beside it are
    # in the header above, with why they were here and why they are not any more.
    #
    # For the record of the rule they were obeying, which is unchanged and still right: a region is
    # declared FLAT, per environment-scoped Intent — never inherited from the environment
    # (ADR-0142 D4 / ADR-0118 D1, one document must not mean different things in different scopes).
    # And where a host IS placed in a subnet on a substrate that has regions, the two regions must
    # match (ADR-0146): a host in us-west-2 placed in a us-east-1 subnet asks for a network that
    # does not exist where it is looking. Kubernetes has neither, which is why neither is here.
    tier: app
