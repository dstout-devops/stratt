# dmz-subnet — a second Intent/Subnet (ADR-0059), the re-placement move TARGET. Built through the
# parameterized subnet-build Workflow, which crossplane advertises for Intent/Subnet — the SAME
# Workflow that builds app-subnet, launched with this Intent's own name/params (ADR-0120 D2).
#
# This comment used to name `subnet-provision`, contradicting the `requires:` comment four lines down
# in the same file. The header was aspirational and the inline comment was right: nothing ever routed
# to subnet-provision, and subnet-build hardcoded app-subnet, so THIS Intent was unbuildable while two
# comments disagreed about which Workflow would build it.
name: dmz-subnet
kind: Intent/Subnet
spec:
  projectKind: subnet
  requires: [provisioning] # the capability CLASS (ADR-0110), never a provider name (§1.5)
  params:
    # Same region as app-subnet: both are subnets of one estate in one place. Flat here, never
    # inherited from the environment (ADR-0142 D4) — see app-subnet.yaml for why the repetition is
    # the compliant shape rather than a missing abstraction (ADR-0118 D1).
    region: us-east-1
    cidr: 10.40.0.0/24
