# app-subnet — Intent/Subnet (ADR-0059): declare a desired subnet from the simplest form.
# "A /24 for the app tier" — that's the whole declaration. This is NOT an Entity (§1.2):
# the graph holds only what is BUILT. The provisioning reconcile compares this named
# singleton against the subnet already projected+correlated for it and surfaces a GATED
# build (a provision/app-subnet Finding) — it never auto-launches (§5 Flow 1). Approve the
# build Workflow → the provider builds the subnet → it projects back as kind: subnet correlated by
# stratt.intent/singleton → the Finding resolves → the Syncer maintains net.subnet as-built.
#
# THE PROVIDER MOVED, AND NOTHING HERE MOVED WITH IT (ADR-0145 D7). This resolves in dev/prod to
# `opentofu-network` → opentofu-subnet-build, running the bundled aws-network OpenTofu module — the
# charter-canonical network builder (§5.1/§5.2/§3), landing ADR-0110 D5's demotion of the opaque
# Crossplane Claim. `estate/capability-bindings/provisioning-subnet.yaml` is what selects it, because
# Subnet has two verified providers and the core never breaks a tie it was not told how to break
# (§2.4). That this file is unchanged is the point of naming a capability class rather than a
# provider (§1.4/§1.5). It was also, until ADR-0145, unbuildable: the advertised build Workflow had
# never been written.
#
# `params.cidr` IS A CLAIM, NOT AN ASSIGNMENT (ADR-0145 D8) — read it as a request, not a promise.
# Under the OpenTofu provider the range is allocated by the `ipam` capability (NetBox) and injected
# as var.stratt_ipam_cidr; this Intent says a /24 is wanted, not which one. The built subnet's
# `net.cidr` label reports what it actually got (§1.2 — the graph holds what is). The Crossplane
# builder, which binds {{.launch.params.cidr}}, took it literally. Hand-assigning addresses in Git
# is the thing the ipam capability exists to stop.
name: app-subnet
kind: Intent/Subnet
spec:
  projectKind: subnet
  requires: [provisioning] # the capability CLASS (ADR-0110), never a provider name (§1.5)
  params: # OPAQUE — validated against the resolved provider's own input Contract (§1.5)
    # The REGION is the substrate's own name for a place — a provider coordinate (ADR-0142 D3),
    # flat here rather than inherited from the environment (ADR-0142 D4 / ADR-0118 D1: the same
    # document must not mean different things in different scopes). It now reaches the module and
    # decides where the subnet is built; it must match the region web-fleet's hosts are built in,
    # or the host cannot be placed in this subnet (ADR-0146).
    region: us-east-1
    # AN ALLOCATION REQUEST, not a literal CIDR — which is what ADR-0112 D5 claims for this leg
    # ("a subnet CIDR is ALLOCATED, not declared") and what the estate could not previously express.
    # `cidr: 10.30.0.0/24` used to sit here, and with it the ipam capability had nothing to ask for:
    # capabilities/ipam.input wants {key, size} plus one of pool/role, so a declared CIDR made the
    # allocator decoration. Two subnets declaring overlapping literals would have collided with
    # nothing to notice — which is ADR-0111's whole argument for an allocator being the system of
    # record.
    #
    # `size` is the prefix length; `pool` is the supernet to carve from (seeded in NetBox as the EU
    # app supernet). pool and role are schema-EXCLUSIVE in the Contract (a JSON Schema oneOf), never
    # a pair with a runtime "role wins" rule — that would be the implicit precedence §2.4 refuses.
    size: 24
    pool: 10.30.0.0/16
