# app-tier-build — the GATED build Workflow for the app-tier compute, PLACED-IN the
# app-subnet (ADR-0058 + ADR-0059). Same shape as subnet-build: approve Gate → the
# crossplane/provision Action provisions REAL compute (a Pod via provider-kubernetes),
# waits Ready, and projects the host back with Run provenance — the stratt.intent/instance
# correlation label resolves the provision/app-tier Finding, AND a placed-in edge to the
# subnet projects the topology (the build's full observation, via the refined ingestion
# primitive — a build projects its edges, not just its identity). The placement-drift
# check then confirms declared (app-subnet) == observed (the placed-in edge).
name: app-tier-build
# The launch interface (ADR-0118 D2). This Workflow has always taken a launch param — the
# comment on `relations` below has described it since ADR-0059 — but nothing declared it,
# so `{{.launch.targetSubnet}}` was a binding no operator could discover and no reviewer
# could check. It was found by the field-wise declaration check the moment that check
# existed; before it, a launch omitting the param failed at dispatch instead.
#
# Required with no default deliberately: a placement target has no safe fallback, and
# defaulting one would silently move a host to whichever subnet we guessed.
inputs:
  type: object
  additionalProperties: false
  required: [targetSubnet]
  properties:
    targetSubnet:
      type: string
      description: >
        crossplane.claim name of the subnet this host is placed-in. Re-launching with a
        different value MOVES the host (placed-in is singular), which is the gated
        re-placement move — launch is the gate, this param is the target.
steps:
  - name: approve
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400
  - name: build
    needs: [approve]
    action: crossplane/provision
    credentialRefs: [crossplane-dev]
    params:
      group: kubernetes.crossplane.io
      version: v1alpha2
      resource: objects
      kind: Object
      name: app-01
      readySeconds: 120
      # Estate overlay: the built compute projects AS a host, correlated by
      # stratt.intent/instance so the provision/app-tier Finding resolves.
      projectKind: host
      identityScheme: crossplane.claim
      projectLabels:
        stratt.intent/instance: app-01
        fleet: app
      # The topology edge the build projects (decision 5): the host is placed-in the
      # subnet named by the LAUNCH param — the same Workflow builds OR re-places (ADR-0059).
      # placed-in is singular (a host in ONE subnet), so a re-launch with a different
      # targetSubnet MOVES the host: the build retracts its stale placed-in edge, adds the
      # new. This is the gated re-placement move — launch is the gate, the param is the
      # target, no reconcile-side write (§5 Flow 2 / §1.2).
      relations:
        - type: placed-in
          toScheme: crossplane.claim
          toValue: "{{.launch.targetSubnet}}"
      # Real compute: a Pod provider-kubernetes provisions (a genuine reconcile).
      spec:
        providerConfigRef:
          name: default
        forProvider:
          manifest:
            apiVersion: v1
            kind: Pod
            metadata:
              name: app-01
              namespace: crossplane-system
            spec:
              containers:
                - name: app
                  image: registry.k8s.io/pause:3.9
