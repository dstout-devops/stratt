# Access revoke Workflow (ADR-0036, onRemove: revert|remove): remove the granted
# host access (drop group membership / remove the sudoers rule / remove the
# authorized_key). Surfaced on the orphan Finding when the Assignment is
# withdrawn — a ref the operator launches, never auto-run (§5 Flow 2).
#
# Broken in the same way access-apply was: the play referenced
# access_subject/access_scope/access_kind, which nothing defined. See access-apply.yaml for
# the full account.
#
# HOW THIS ONE IS LAUNCHED, AND THE GAP THAT REMAINS. access-apply is a route's
# remediationWorkflow, so its params are compiled onto the Baseline and passed by the
# remediation door (ADR-0118 D3). This is a Blueprint's `removeWorkflow`, surfaced on the
# ORPHAN Finding when an Assignment is withdrawn — and that path carries the Workflow name
# as a string inside a freeform detail blob, with no typed param channel at all
# (compiler.go: detail["removeWorkflow"]).
#
# So these inputs must be supplied BY THE LAUNCHER. That is still a strict improvement:
# before, launching this Workflow ran a play that failed on an undefined variable; now the
# API refuses the launch and names exactly which inputs it wants. But it is not the finished
# shape — a withdrawal path deserves the same compiled params a remediation route gets, and
# resolving them properly needs the withdrawn Intent's EFFECTIVE spec (defaults + Assignment
# values), which the orphan branch does not currently have. Booked in ADR-0118 rather than
# half-built here against the raw Intent spec, which would silently ignore both other layers.
name: access-revoke
inputs:
  type: object
  additionalProperties: false
  required: [subject, kind, scope]
  properties:
    subject:
      type: string
      description: The host-local account whose grant is being removed.
    kind:
      enum: [sudo, group, authorized_key, account]
      description: The grant kind.
    scope:
      type: string
      description: Kind-scoped detail — group name, sudo command spec, key fingerprint, or shell.
steps:
  - name: revoke
    viewName: secure-hosts
    actuator: ansible
    params:
      extraVars:
        access_subject: "{{.launch.subject}}"
        access_kind: "{{.launch.kind}}"
        access_scope: "{{.launch.scope}}"
      play: |
        - name: Revoke host-access grant
          hosts: all
          become: true
          tasks:
            - name: Remove group membership
              ansible.builtin.command: "gpasswd -d {{ access_subject }} {{ access_scope }}"
              register: gpasswd
              changed_when: gpasswd.rc == 0
              failed_when: false
              when: access_kind == "group"
