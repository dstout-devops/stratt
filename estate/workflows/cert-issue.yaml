# cert-issue — the remediation the `certissuer` capability resolves to (W4, ADR-0030/0050/0106).
#
# IT LIVES IN THE ESTATE, not in the openbao plugin's tree, and that is ADR-0104 D1 enforced rather
# than preference: this Workflow composes TWO plugins — ansible generates the CSR and delivers the
# certificate, openbao signs it — and a plugin's own estate may not name another plugin's provider.
# `task plugins:boundary` caught the first draft doing exactly that. The rule is the same one that
# keeps cross-plugin DEMOS in demos/ rather than beside one of their plugins: whoever spans the
# boundary owns the composition.
#
# WHY THIS FILE DID NOT EXIST. `cert-issuer` has advertised `provides: [certissuer]` since ADR-0106
# with NO `remediates:` entry, because the Workflow it would name was never written — the exact
# shape ADR-0145 found on the network leg, where `opentofu-network` advertised
# `provides: [provisioning]` and could not build a Subnet. A class with a provider that can serve no
# Intent kind is an advertisement with nothing behind it: the capability RESOLVES, and then there is
# nothing to launch.
#
# The whole certificate leg was in that state. The provider ships, the Facets ship, the schema
# ships, `estate/triggers/cert-reconcile.yaml` names the capability — and no Intent/Certificate
# existed anywhere in the estate, so the reach path had zero consumers and could not be exercised.
name: cert-issue
inputs:
  type: object
  additionalProperties: false
  required: [commonName, role, ttl, renewBefore]
  properties:
    commonName:
      type: string
      minLength: 1
      description: >
        The subject the certificate is issued for, resolved per-Assignment from the Intent's spec.
        It is the ONE field an operator declares and everything else follows from — the whole point
        of an Intent/Certificate over a hand-run issuance.
    role:
      type: string
      minLength: 1
      description: >
        The CLM role to issue under, from Intent/Certificate's `issuer`. Named as a ROLE rather than
        as an OpenBao path so a step-ca implementation of the same capability serves the same
        Intent unchanged (§1.5) — this Workflow lives in the openbao plugin's estate, but nothing
        in the estate above it names openbao.
    ttl:
      type: string
      minLength: 1
      description: The requested validity, from the Intent's `validity`.
    renewBefore:
      type: string
      minLength: 1
      description: >
        How long before expiry a certificate must be renewed. The SAME value the Blueprint's
        observe expectation uses as its `notBefore` window, which is what makes renewal a drift
        loop rather than a schedule: the Baseline opens a Finding once `cert.expiry.notAfter` is
        closer than this, and this Run is what closes it.
steps:
  # ── THE BORN-ON-TARGET FLOW (CERT-2) ────────────────────────────────────────────────────────
  # Three Steps because the property §2.5 demands needs three: the KEY is made where it will be
  # used, only the CSR travels, and the signature comes back. It was unexpressible until an
  # Actuator Step could hand a typed value downstream — an ansible Step had nowhere to put the CSR
  # it had just generated, so the only shapes available were a CLM-generated key (discarding the
  # born-on-target property this Actuator's own input Contract states in writing) or a fake.
  - name: gather
    viewName: managed-certs
    actuator: ansible-certificate
    credentialRefs: [web-machine]
    # It writes NO facets: a CSR is not a fact about the host, it is a request for the next Step.
    # The value leaves through the Actuator's pinned outputContract instead (outputs/csr).
    params:
      connection:
        user: root
        credentialRef: web-machine
        hostKeyChecking: accept-new
      extraVars:
        cert_common_name: "{{.launch.commonName}}"
        cert_dir: /etc/stratt/pki
      playbook: csr-gather.yml

  - name: sign
    needs: [gather]
    # An ACTION, not the cert-issuer Actuator's Apply — because an Action's result binds into a
    # later Step and the delivery Step needs the certificate. The Actuator verb converges a View of
    # certificates and writes cert.identity/cert.expiry; this signs exactly one.
    action: cert-issuer/sign
    credentialRefs: [cert-issuer]
    params:
      # The output of the Step above, validated against outputs/csr before anything could bind it.
      csr: "{{.steps.gather.outputs.csr}}"
      role: "{{.launch.role}}"
      ttl: "{{.launch.ttl}}"

  - name: deliver
    needs: [sign]
    viewName: managed-certs
    actuator: ansible-certificate
    credentialRefs: [web-machine]
    # Delivery reports the FILE that landed — the one namespace this Actuator may write.
    facetWriteScope: [fileset.content]
    params:
      connection:
        user: root
        credentialRef: web-machine
        hostKeyChecking: accept-new
      extraVars:
        cert_common_name: "{{.launch.commonName}}"
        cert_dir: /etc/stratt/pki
        cert_pem: "{{.steps.sign.outputs.certificate}}"
      playbook: cert-deliver.yml

  # The reconcile that projects cert.identity / cert.expiry — the facts the renewal Baseline reads.
  # It runs AFTER delivery so a Finding closes on a certificate that is actually on the host, not on
  # one that merely exists in the CLM.
  - name: issue
    needs: [deliver]
    viewName: managed-certs
    # The CAPABILITY's provider, not a provider name. cert-issuer is what serves `certissuer` in
    # this estate; the Blueprint above names only the class (ADR-0106 D1).
    actuator: cert-issuer
    credentialRefs: [cert-issuer]
    # The write ceiling for the issuance: the two Facets a certificate projects and nothing else.
    facetWriteScope: [cert.identity, cert.expiry]
    params:
      commonName: "{{.launch.commonName}}"
      role: "{{.launch.role}}"
      ttl: "{{.launch.ttl}}"
      renewBefore: "{{.launch.renewBefore}}"
      # NO `csr` — and its absence is the §2.5 decision, not an omission. The CSR is the TARGET's:
      # the private key is born on the host and never crosses the wire, so a CSR pasted into an
      # estate file would either be a placeholder that issues nothing (which is what
      # estate/triggers/cert-reconcile.yaml still carries) or a key that left its host. The
      # Actuator's Contract makes `csr` optional for exactly this reason; supplying it is the
      # target-side flow, and this reconcile path names the subject and lets the provider mint.
