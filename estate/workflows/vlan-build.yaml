# vlan-build — the GATED build Workflow an Intent/Vlan launches (ADR-0059). Identical shape
# to subnet-build — the model extends to a new kind with NO new machinery: same gate, same
# crossplane/provision Action, same project-back + correlation. The Syncer projects the
# built Object AS a vlan (the stratt.dev/project-kind stamp) with its net.vlan Facet.
name: vlan-build
# The per-singleton launch interface (ADR-0120 D2, extended to the ADR-0059 D4 path). Before this the
# Workflow hardcoded ONE singleton's name and correlation key, so it could only ever build that one.
# net-vlan is currently the ONLY declared Intent/Vlan, so unlike subnet-build the hardcoding was
# LATENT here rather than already-reachable — a second Vlan would have collided with it. Fixed on the
# same pass regardless: a builder that only works while exactly one Intent of its kind exists is a
# defect waiting for the second declaration, not a working builder.
#
# `singleton` is the per-kind correlation key ("Intent/Vlan/net-vlan"), `name` is what the resource is
# called in the provider; they are different things and both are needed. `params` stays OPAQUE — the
# provider's own Action Contract types it downstream (§1.5).
inputs:
  type: object
  additionalProperties: false
  required: [singleton, name, projectKind, labels]
  properties:
    singleton:
      type: string
      description: The (intentKind, name) correlation key, e.g. Intent/Subnet/app-subnet.
    name:
      type: string
      description: The declared Intent name — what the provisioned resource is called.
    intentKind:
      type: string
      description: The Intent kind being built, e.g. Intent/Subnet.
    projectKind:
      type: string
      description: The Entity kind the built resource projects as.
    labels:
      type: object
      additionalProperties: { type: string }
      description: >
        Labels the projection carries, INCLUDING stratt.intent/singleton — the ONLY key
        ProvisionedSingletons reads, so any other spelling builds an Entity that never resolves
        its own Finding.
    placement:
      type: object
      additionalProperties: true
      description: Declared topology placement (subnet / dmz / availabilityZone), when declared.
    params:
      type: object
      additionalProperties: true
      description: Opaque provider build params, typed by the provider's Action Contract, never here.
steps:
  - name: approve
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400
  - name: build
    needs: [approve]
    action: crossplane/provision
    credentialRefs: [crossplane-dev]
    params:
      group: kubernetes.crossplane.io
      version: v1alpha2
      resource: objects
      kind: Object
      name: "{{.launch.name}}"
      readySeconds: 120
      projectKind: "{{.launch.projectKind}}"
      identityScheme: crossplane.claim
      projectLabels: "{{.launch.labels}}"
      # The NESTED manifest is what provider-kubernetes applies — see subnet-build for why
      # parameterizing only the top-level params left a silent per-instance collision behind.
      # `vid` comes from the Intent's opaque params (net-vlan declares vid: "100"), so the VLAN id
      # is the Intent's to declare and not this Workflow's to know (§1.5).
      spec:
        providerConfigRef:
          name: default
        forProvider:
          manifest:
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: "vlan-{{.launch.name}}"
              namespace: crossplane-system
            data:
              vid: "{{.launch.params.vid}}"
