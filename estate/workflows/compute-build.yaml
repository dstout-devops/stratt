# compute-build — the GATED build Workflow an Intent/Compute launches (ADR-0058).
# The provisioning reconcile surfaces a `provision/<intent>` Finding per missing
# instance; an operator launches THIS Workflow to build one (§5 Flow 1 — the launch
# IS the gate, and the approve Step adds a second platform-admin approval). The
# build Action projects the instance back with Run provenance; the projectKind +
# labels + the stratt.intent/instance correlation label ride that projection (never
# a reconcile-side write, §1.2 / ADR-0058 M1) so the next reconcile sees it built
# and resolves the Finding.
#
# `action:` is the landscape binding — awsec2/create-vm (moto in dev), swappable for
# opentofu / vsphere / crossplane without touching the estate around it (§1.4/§1.5).
# Per-instance parameterization landed in ADR-0120 D2 — the note that used to sit here calling it
# "the build-execution slice that follows this one" is discharged below.
name: compute-build
# The per-instance launch interface (ADR-0118 D2, ADR-0120 D2). Before this the Workflow
# hardcoded web-01, so a `count: 2` fleet raised two Findings and the gated path could only
# ever build the first — and the second Finding never resolved, because the correlation label
# it matches on was never projected.
#
# The reconcile supplies every one of these; none is typed by hand at launch. `params` is
# OPAQUE on purpose: Intent/Compute declares it additionalProperties:true and the provider's
# own Action Contract types it downstream (§1.5), so enumerating region/instanceType/ami here
# would re-couple this Workflow to one landscape (ADR-0110).
inputs:
  type: object
  additionalProperties: false
  required: [instance, projectKind, labels]
  properties:
    instance:
      type: string
      description: The desired instance's correlation name (namePrefix + ordinal), e.g. web-02.
    ordinal:
      type: integer
      description: Its 1-based position in the fleet.
    projectKind:
      type: string
      description: The Entity kind the built instance projects as.
    labels:
      type: object
      additionalProperties: { type: string }
      description: >
        Labels the projection carries, INCLUDING stratt.intent/instance — the correlation
        label the next reconcile matches to decide this instance is built.
    placement:
      type: object
      additionalProperties: true
      description: Declared topology placement (subnet / dmz / availabilityZone), when the Intent declares one.
    params:
      type: object
      additionalProperties: true
      description: Opaque provider build params, typed by the provider's Action Contract, never here.

steps:
  - name: approve
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400 # 24h to approve the build
  - name: build
    needs: [approve]
    action: awsec2/create-vm # landscape binding — swap for crossplane/opentofu/vsphere
    credentialRefs: [aws-dev] # §2.5 — an Action's use-check is its only authz gate
    params:
      # Provider-shaped build params, forwarded whole from the Intent's opaque `params`.
      region: "{{.launch.params.region}}"
      instanceType: "{{.launch.params.instanceType}}"
      ami: "{{.launch.params.ami}}"
      name: "{{.launch.instance}}"
      # The estate OVERLAY (ADR-0058 §6): the built instance projects AS this kind with these
      # labels (Run provenance, never a reconcile write, §1.2 — routing them through launch
      # params does not change the writer). `labels` already carries stratt.intent/instance,
      # which is what resolves the provisioning Finding, so this Workflow no longer names any
      # single instance and builds whichever one its Finding is for.
      projectKind: "{{.launch.projectKind}}"
      projectLabels: "{{.launch.labels}}"
