# subnet-build — the GATED build Workflow an Intent/Subnet launches (ADR-0059). The
# provisioning reconcile surfaces a provision/app-subnet Finding; an operator launches THIS
# Workflow to build the subnet (§5 Flow 1 — the launch IS the gate, and the approve Step
# adds a platform-admin approval). The crossplane/provision Action server-side-applies
# a real Crossplane resource, waits for it to reconcile Ready, and projects the subnet back
# with Run provenance; the projectKind + the stratt.intent/singleton correlation label ride
# that projection (never a reconcile-side write, §1.2) so the next reconcile sees it built
# and resolves the Finding. The Crossplane Syncer then maintains net.subnet as-built.
#
# `action:` is the landscape binding — crossplane/provision (provider-kubernetes in
# dev), swappable for a real cloud provider without touching the estate around it.
name: subnet-build
# The per-singleton launch interface (ADR-0120 D2, extended to the ADR-0059 D4 path). Before this the
# Workflow hardcoded ONE singleton's name and correlation key, so it could only ever build that one —
# app-subnet and dmz-subnet are both declared Intent/Subnet, and only the hardcoded one was buildable.
#
# `singleton` is the per-kind correlation key ("Intent/Subnet/app-subnet"), `name` is what the resource
# is called in the provider; they are different things and both are needed. `params` stays OPAQUE — the
# provider's own Action Contract types it downstream (§1.5).
inputs:
  type: object
  additionalProperties: false
  required: [singleton, name, projectKind, labels]
  properties:
    singleton:
      type: string
      description: The (intentKind, name) correlation key, e.g. Intent/Subnet/app-subnet.
    name:
      type: string
      description: The declared Intent name — what the provisioned resource is called.
    intentKind:
      type: string
      description: The Intent kind being built, e.g. Intent/Subnet.
    projectKind:
      type: string
      description: The Entity kind the built resource projects as.
    labels:
      type: object
      additionalProperties: { type: string }
      description: >
        Labels the projection carries, INCLUDING stratt.intent/singleton — the ONLY key
        ProvisionedSingletons reads, so any other spelling builds an Entity that never resolves
        its own Finding.
    placement:
      type: object
      additionalProperties: true
      description: Declared topology placement (subnet / dmz / availabilityZone), when declared.
    params:
      type: object
      additionalProperties: true
      description: Opaque provider build params, typed by the provider's Action Contract, never here.
steps:
  - name: approve
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400 # 24h to approve the build
  - name: build
    needs: [approve]
    action: crossplane/provision
    credentialRefs: [crossplane-dev] # §2.5 — an Action's use-check is its only authz gate
    params:
      # The Crossplane resource to provision (opaque, §1.5 — a provider-kubernetes Object
      # in dev; a provider-aws Subnet in prod is a params change, nothing else).
      group: kubernetes.crossplane.io
      version: v1alpha2
      resource: objects
      kind: Object
      name: "{{.launch.name}}"
      cidr: "{{.launch.params.cidr}}"
      readySeconds: 120
      # The estate overlay (ADR-0059 §6): the built subnet projects AS this kind, correlated
      # by the stratt.intent/singleton label so the provision/app-subnet Finding resolves.
      projectKind: "{{.launch.projectKind}}"
      identityScheme: crossplane.claim
      # labels already carries stratt.intent/singleton, so this builds whichever Subnet its Finding
      # is for rather than only app-subnet.
      projectLabels: "{{.launch.labels}}"
      # Topology composition (ADR-0059): the subnet is in-vlan the net-vlan — the build
      # projects the edge (relation primitive), targeted by identity. If the vlan isn't
      # built yet the edge drops with a visible trace (§1.8), never silently.
      relations:
        - type: in-vlan
          toScheme: crossplane.claim
          toValue: net-vlan
      # The NESTED manifest is what provider-kubernetes actually applies, and it was the last place
      # this Workflow still hardcoded one singleton. Parameterizing `name`/`cidr` above was not
      # enough: with `subnet-app-subnet` and `10.30.0.0/24` literal here, building dmz-subnet applied
      # a ConfigMap under app-subnet's NAME carrying app-subnet's CIDR — silently overwriting the
      # other subnet's resource rather than failing. Both Intent/Subnet declarations resolve to this
      # one Workflow (crossplane is the sole Subnet provider), so the collision was reachable the
      # moment dmz-subnet was built. Finding it prompted the D3 check that now makes the class
      # unshippable: a builder may not contain any literal belonging to a declaration of the kind it
      # builds — not a name, not a declared params value, at any depth including inside an opaque
      # provider blob. The literals below are exactly what that check refuses.
      spec:
        providerConfigRef:
          name: default
        forProvider:
          manifest:
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: "subnet-{{.launch.name}}"
              namespace: crossplane-system
            data:
              cidr: "{{.launch.params.cidr}}"
