# linux-onboard — the L3 onboarding construct (ADR-0055): a gated lifecycle DAG that
# composes plugin Actuators across landscapes. Provision is a Gate → nested-build seam
# (§5 Flow 1 "gate before build" — NEVER a silent auto-launch), then configure over the port.
#
# The provision Step names a CAPABILITY (ADR-0139 D3): the landscape binding is now the estate's
# verified provisioning provider, swappable between awsec2/crossplane/opentofu/vsphere without
# touching this file at all — which is what the old comment claimed and the old `action:` could
# not deliver. The converge Step still names its Actuator directly; that leg is Actuator-shaped
# and its own decision.
# NOTE: cert (cert-issuer) + app (helm) Steps are the next lifecycle slice.
name: linux-onboard
steps:
  - name: approve
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400 # 24h to approve the build
  - name: provision
    needs: [approve]
    # The CAPABILITY, not a provider (ADR-0139 D3/D4). This Step used to read
    # `action: awsec2/create-vm` with a comment calling it "the landscape binding — swap for
    # crossplane/opentofu/vsphere", which is the tell: the author was describing a capability and
    # the model could only express a provider. ADR-0104 D1 forbids a consumer naming a provider,
    # and this was the last such leg in a core-owned Workflow.
    #
    # It also skipped whatever the provider's build Workflow does AROUND the Action. `compute-build`
    # is what awsec2 advertises as its Compute builder — calling create-vm directly bypassed the
    # projection + correlation-label work that makes a build resolvable by the next reconcile.
    #
    # Resolution binds the single VERIFIED provisioning provider that builds Compute, at launch,
    # recorded on the nested run alongside the class (§1.8). The nested run is a first-class
    # WorkflowRun linked back to this Step, so descent, Gates and audit all keep working.
    workflowCapability: provisioning
    forKind: Compute
    # The child's declared interface, checked at LOAD against every candidate provider's build
    # Workflow — not just the one bound today. Which provider wins depends on runtime state Git
    # cannot see, so inputs that fit only one break the other on a binding change (ADR-0139 D4).
    inputs:
      instance: linux-fleet-node
      projectKind: host
      labels:
        stratt.intent/instance: linux-fleet-node
  - name: configure
    needs: [provision]
    viewName: linux-fleet
    # The platform-baseline PROJECT's Actuator (ADR-0134 D2). Naming it is how this Step
    # selects both the content root and the write ceiling that goes with it; the playbook
    # below is a path INSIDE that root, and core checks at estate load that it exists.
    actuator: ansible-platform-baseline
    params:
      # ADR-0158 D2 — the reach method, declared. UNLIKE the other Steps carrying this line,
      # these hosts were just BUILT (by `provision` above, through whichever provider the
      # provisioning capability resolved to), so some of them may well carry an observed
      # mgmt.transport. Declaring ssh is still both correct and necessary: it is inert where a
      # transport IS observed — the per-host var wins and ssh authors no group var at all — and
      # it is the only thing standing between an UNOBSERVED build (awsec2 writes no transport,
      # deliberately) and a refused Run.
      connection:
        type: ssh
      playbook: linux-onboard.yml
