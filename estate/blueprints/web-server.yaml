# web-server — the L2 onboarding Blueprint (ADR-0055, ADR-0083): the DEFAULTED,
# overridable unit for the "web server" capability on a group of hosts. An operator
# declares the simplest form — an Intent/Application naming the app — and THIS Blueprint
# supplies the sane DEFAULTS (G6, ADR-0083 §5): the listen port, the channel. A field the
# Intent omits takes the default; a field it sets overrides, via explicit overlay layering
# (no precedence field, §2.4/§4.1). The route observes the desired config and routes drift
# to a GATED ansible remediation — the PLUGIN materializes the state; core never learns
# "web server" or "ansible" (§1.4). "web-server" is a VALUE inside Intent/Application,
# never a core kind (§9). Co-management (ADR-0083 §3) fans out by ADDING routes — a cert
# route (cert-issuer), a package route (software.*) — the per-capability route map; each
# is an independently-metered §7.6 channel. This slice ships the config route.
name: web-server
version: 1
for: Intent/Application
# WHICH application this Blueprint installs (ADR-0148 D2). `for:` says which Intent KIND it
# composes; this says which app it actually knows how to converge — and they are different
# questions, because Intent/Application composes every app while a Blueprint composes one.
#
# It is one Blueprint per app because the tech CASCADES: content selection cannot be data (a
# templated content ref is refused at load — templating into arbitrary content is a supply-chain
# hole), so one playbook per Step means one app per Workflow, per route, per Blueprint. Apache and
# Tomcat differ by far more than a package name anyway — JVM, service unit, webapps dir, a PKCS12
# keystore rather than PEM.
#
# Stating it here is what makes the Intent's own `package:` checkable: an Assignment binding an
# Intent that asks for tomcat to this Blueprint is refused at load, rather than compiling, running
# the drift loop, and installing nginx on a fleet that asked for something else.
delivers: nginx
severity: warning
dampingObservations: 1
# Sane defaults for the composed Intent/Application spec — the BASE overlay layer that an
# Assignment's Intent overrides. Validated against the Application Contract at ingestion
# (§1.1 seam), partial-tolerant.
defaults:
  channel: stable
  port: "8080"
routes:
  - observe:
      namespace: app.config
      path: port
      equals: "{{.spec.port}}" # ← resolved from the Blueprint default OR the Intent override
    claim: exclusive
    # CAPABILITY-routed (ADR-0135 D3), which this Blueprint could not be until ADR-0138 D5.
    #
    # The history is worth keeping, because the failure mode is subtle and repeatable. This
    # WAS capability-routed once and broke every real floor: a capability route resolves only
    # through a VERIFIED provider, verification meant fetching a Manifest over a dial address,
    # and an EE-Job Actuator has none by construction (ansible is subprocess-only, §3). So it
    # was permanently unverifiable and the route compiled to:
    #
    #   assignment web-server: blueprint route 0 remediationCapability "configmgmt":
    #   no verified provider builds Intent/Application for capability "configmgmt"
    #
    # Three Assignments stopped compiling. Every unit test still passed, because they resolve
    # through a fake — `task dev:connector-e2e` was the only thing that caught it, and it is
    # still the gate that matters for a change to this line.
    #
    # ADR-0138 D5 made a dial-less provider verifiable from its DECLARED mechanisms instead of
    # a Manifest it cannot have, so ansible-platform-baseline now genuinely provides the class
    # and this route resolves to it. Every field in this Blueprint is provider-agnostic again,
    # which is what made a capability-shaped remediation leg worth having.
    #
    # `remediationWorkflow` is kept, not deprecated (ADR-0135): name the capability when more
    # than one provider could serve, name the Workflow when the estate has decided. The two are
    # mutually exclusive on a route, refused at compile.
    remediationCapability: configmgmt
    # The converge gets the SAME resolved value the expectation does (ADR-0118 D3, ADR-0148 D1).
    #
    # This was absent, and its absence is why an overriding fleet was broken rather than merely
    # undefaulted: `observe.equals` above resolves {{.spec.port}} per-Assignment, so web-server-secure
    # drift-checks 443 — while the remediation carried a literal 8080 and would have converged the
    # secure fleet to the wrong port, forever, since the Finding can never resolve against a value
    # the converge does not set.
    #
    # It works on a CAPABILITY route, which is worth stating because it looks like it should not:
    # the compiler resolves remediationCapability to a concrete Workflow BEFORE the params
    # cross-check runs, so everything downstream sees a plain remediationWorkflow. Naming a class
    # and parameterizing the converge are not alternatives.
    remediationParams:
      nginx_port: "{{.spec.port}}"
