# opentofu-network — OpenTofu as the AWS network `provisioning` provider (ADR-0112), the
# charter-canonical network builder (§5.1: tofu apply → outputs → Normalizer → ansible Step).
# It dials the same opentofu plugin pod as opentofu-s3; provider verification (ADR-0104 D1) confirms
# the pod's Manifest advertises `provisioning` before any consumer binds.
#
# It composes TWO capabilities on one build Actuator (ADR-0112 D1):
#   requires: [statestore, ipam]
#     - statestore (ADR-0105) → the S3 tofu backend, resolved+injected at Run dispatch.
#     - ipam       (ADR-0111) → a NetBox-allocated CIDR, injected as a module var (stratt_ipam_cidr).
#   So this Actuator stays PENDING (registry D6, §1.8) until BOTH a verified statestore AND a verified
#   ipam provider exist — observable, never a silent no-op.
#
# provisions advertises its per-kind build Workflow (ADR-0110 D3): Subnet → opentofu-subnet-build,
# which runs the AWS network module. This makes Subnet a >1-provider case (opentofu + crossplane) →
# the explicit estate/capability-bindings/ entry selects opentofu (ADR-0110 D5 demotion, ADR-0112 D6).
name: opentofu-network
address: stratt-opentofu:9090
pluginIdentity: opentofu
tier: trusted
dryRunnable: true
provides: [provisioning]
requires: [statestore, ipam]
# NO `provisions` ENTRY, DELIBERATELY, AND THIS IS A CORRECTION (ADR-0120 D3).
#
# This Actuator advertised `Subnet: opentofu-subnet-build` and that Workflow WAS NEVER WRITTEN.
# Nothing caught it: validateProvisions only checks the entry is non-empty, and the reconcile copies
# the name onto the build Finding, so a declared Intent/Subnet produced a Finding offering a Workflow
# nobody could launch — discovered by an operator at the gate. With estate/capability-bindings
# selecting THIS provider for Subnet, that meant Subnet provisioning in the reference estate was dead:
# app-subnet and dmz-subnet could not be built, and app-tier's placement depends on app-subnet.
#
# ADR-0110 D5's demotion of Crossplane's opaque-Claim subnet build in favour of OpenTofu — the
# charter-canonical network builder (§5.1/§5.2/§3) — was therefore DECLARED BUT NEVER DELIVERED. It is
# deferred rather than reversed: re-add this entry, and the binding beside it, the moment
# opentofu-subnet-build exists. Advertising it meanwhile is a promise the estate cannot keep, and
# checkProvisioningBuildInputs now refuses it at declaration.
#
# `provides: [provisioning]` stays: OpenTofu genuinely provides the class for consumers that only
# need a verified provisioner to EXIST (the enablement gate above). What it lacks is a per-kind build
# Workflow, and a provider with no builder must not be a build candidate.
