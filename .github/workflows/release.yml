# Release — build, sign, attest, verify (ADR-0165, charter §7.3).
#
# ── WHAT THIS FIXES IS NOT "THREE MISSING STEPS" ────────────────────────────────────────────────
#
# §7.3 promises signed releases, SBOM and SLSA provenance "from release one". Before this workflow
# there was no release: ci.yml builds the control-plane images so a spec change cannot silently
# break a Dockerfile, and then throws them away. Nothing was ever published, so there was nothing
# for the missing signatures to be missing from.
#
# ── AND IT DOES NOT PUBLISH YET, ON PURPOSE (ADR-0165 D5) ───────────────────────────────────────
#
# `publish: false` is the default and the only mode wired for now. Keyless signing needs no
# registry, so the ENTIRE trust chain — identity, signature, SBOM, provenance, verification — runs
# against an image that exists only in this runner. Flipping to real publication is a small reviewed
# change, gated on a decision that is not a coding task: a published digest can be deleted but never
# un-fetched, and the repository is not public yet.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to GHCR (leave false to prove the chain without publishing)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  # id-token is what makes keyless signing possible AT ALL (ADR-0165 D2): the runner exchanges it
  # for a short-lived Fulcio certificate bound to this workflow's identity. There is no long-lived
  # private key anywhere in this repository, which is the point — a key in CI secrets attests only
  # "somebody who had the key signed this", where this attests "built by THIS workflow at THIS ref".
  id-token: write
  packages: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, attest, verify
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      # Publication is opt-in: a tag alone does not publish while D5 stands.
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
    strategy:
      # fail-fast off: if one image cannot be signed, the others' results are still evidence about
      # WHERE the chain broke, which is the diagnosis this workflow exists to preserve (§1.8).
      fail-fast: false
      matrix:
        image: [strattd, stratt-agent, stratt-forwarder]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2" # keep in step with COSIGN_VER in Taskfile.yml

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: "v1.50.0" # keep in step with SYFT_VER in Taskfile.yml

      - name: Build the image
        id: build
        run: |
          set -eu
          ref="${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.image }}"
          tag="${GITHUB_REF_NAME}"
          docker build -f "deploy/docker/${{ matrix.image }}.Dockerfile" -t "${ref}:${tag}" .
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # ── The digest is the release, not the tag (ADR-0165 D1) ────────────────────────────────
      # Everything below binds to this value. A tag is how a human finds a release; a digest is
      # what was signed, attested and deployed.
      - name: Compute the image digest
        id: digest
        run: |
          set -eu
          # The local image id IS a digest over the config+layers, and it is what a dry run has to
          # bind to: no registry means no repo digest exists yet. A publishing run overwrites this
          # with the registry's own digest below, and the difference is stated rather than papered
          # over — signing a local id and claiming it is a repo digest would be a lie in an
          # artifact whose entire job is to not lie.
          echo "value=$(docker image inspect --format '{{ index .Id }}' '${{ steps.build.outputs.ref }}:${{ steps.build.outputs.tag }}')" >> "$GITHUB_OUTPUT"

      - name: Generate the SBOM
        run: |
          set -eu
          mkdir -p dist
          syft "docker:${{ steps.build.outputs.ref }}:${{ steps.build.outputs.tag }}" \
            -o spdx-json="dist/sbom-${{ matrix.image }}.spdx.json"
          echo "packages: $(jq -r '.packages | length' "dist/sbom-${{ matrix.image }}.spdx.json")"

      # ── Dry run: the trust chain WITHOUT publishing (D5) ─────────────────────────────────────
      # Keyless signing needs an identity, not a registry. Signing the digest as a blob exercises
      # the whole identity path — OIDC exchange, Fulcio cert, Rekor entry — and proves the half of
      # this ADR that cannot be tested on a workstation, while publishing nothing.
      - name: Sign the digest keyless (dry run — nothing published)
        if: env.PUBLISH != 'true'
        run: |
          set -eu
          printf '%s' '${{ steps.digest.outputs.value }}' > dist/digest.txt
          cosign sign-blob --yes \
            --bundle "dist/${{ matrix.image }}.sigbundle" \
            dist/digest.txt
          echo "signed the digest as a blob — identity-bound, nothing pushed"

      - name: Verify the dry-run signature
        if: env.PUBLISH != 'true'
        run: |
          set -eu
          # THE FALSIFICATION THIS STEP EXISTS FOR: a signing step that silently no-ops leaves a
          # green pipeline and unsigned artifacts. Verifying our own output is what turns "the
          # step ran" into "the step worked" (ADR-0165 D4).
          cosign verify-blob \
            --bundle "dist/${{ matrix.image }}.sigbundle" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/digest.txt
          echo "✓ verified: signed by this workflow's identity"

      # ── Publishing path — wired, and off by default (D5) ─────────────────────────────────────
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and re-read the REGISTRY digest
        if: env.PUBLISH == 'true'
        id: push
        run: |
          set -eu
          docker push "${{ steps.build.outputs.ref }}:${{ steps.build.outputs.tag }}"
          # The repo digest, which is what a consumer pulls and therefore what must be signed.
          echo "value=$(docker image inspect --format '{{ index .RepoDigests 0 }}' '${{ steps.build.outputs.ref }}:${{ steps.build.outputs.tag }}')" >> "$GITHUB_OUTPUT"

      - name: Sign, attest SBOM and attest provenance
        if: env.PUBLISH == 'true'
        run: |
          set -eu
          ref='${{ steps.push.outputs.value }}'
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson \
            --predicate "dist/sbom-${{ matrix.image }}.spdx.json" "$ref"

      - name: SLSA build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.build.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.value }}
          push-to-registry: true

      # A release that cannot be verified FAILS rather than shipping (D4).
      - name: Verify the published release
        if: env.PUBLISH == 'true'
        run: IMAGE='${{ steps.push.outputs.value }}' task supply:verify

      - name: Keep the evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ matrix.image }}
          path: dist/
