# app-install-with-cert — install an app on a managed host and give it a TLS certificate,
# through a gated Workflow, over a real SSH connection, with privilege escalation.
#
# This is the demo ADR-0117 was written for. Four things that did not work before it are
# all load-bearing here, so the demo fails if any of them regresses:
#
#   * CONTENT (D3). The play calls community.crypto modules. They exist only because the
#     Actuator this Step names runs an EE built with that collection declared and pinned.
#   * PER-STEP EE SELECTION (D3a). `actuator: ansible-crypto` is how the Step asks for that
#     image. Nothing here passes an image name as a parameter — the Actuator declaration is
#     the authority, and the Run states the content it actually got (kind=ee-content).
#   * PRIVILEGE ESCALATION (D1). The node disables root login, so writing /etc/ssl and
#     /etc/nginx is only reachable by escalating. `become` is typed and reviewable in Git
#     rather than a flag string, and it is recorded on the Run.
#   * ACTUATION ACCOUNTING (D5). A play that matched no host, or changed nothing, is a
#     FAILURE — see the vacuous-run-guard Workflow beside this one, which proves it.
#
# ADR-0134 then moved the play itself out of this file and into the project the ansible-crypto
# Actuator declares. What that Actuator selects is now both halves of "which content": the EE
# image (the collection) and the content root (the playbook). This file kept everything that
# was ever a DECLARATION and lost the 90 lines of Ansible that were only ever a string.
#
# The write-back reports the app's observed listen port and nothing else. The certificate's
# own attributes are NOT projected: cert.identity/cert.expiry belong to the cert-issuer
# Connector's Syncer, and a self-signed cert minted on the node has no system of record to
# project from — one authority per fact (§1.2). The Actuator's grant enforces that ceiling
# no matter what a play claims.
name: app-install-with-cert
# The launch interface (ADR-0118 D2). These are the values the app's Intent declares; the
# Blueprint route passes them (D3), and this schema is what the route's params are validated
# against AT COMPILE — so a route/Workflow mismatch fails the Assignment, not the remediation.
#
# Both required with no defaults, deliberately. A default here would be a SECOND declaration of
# a value the Intent already owns, which is the exact duplication this ADR removed: `port: 443`
# used to live in the Intent, in the Blueprint defaults, and in this file's extraVars.
inputs:
  type: object
  additionalProperties: false
  required: [commonName, tlsPort]
  properties:
    commonName:
      type: string
      description: The certificate subject and nginx server_name for the app.
    tlsPort:
      # A STRING, matching contracts/facets/app.config.schema.json's `port`. The chain is only
      # sound if the Intent spec, this input, and the observed Facet all agree on type, because
      # nothing coerces between them (ADR-0118 D1) — and the pinned Facet Contract is the end
      # that gets to decide.
      type: string
      minLength: 1
      description: The port the app serves TLS on, as a string (the app.config Facet types it so).
steps:
  - name: approve
    # The launch is itself a gate; this adds a human approval before anything mutates a
    # managed host (§5 Flow 1). 24h to approve.
    gate:
      approvers:
        teams: [platform-admins]
      timeoutSeconds: 86400

  - name: install
    needs: [approve]
    viewName: app-nodes
    actuator: ansible-crypto
    credentialRefs: [app-node-ssh]
    # The ceiling on this Step's write-back, intersected with the Actuator's own grant.
    facetWriteScope: [app.config]
    params:
      # Typed privilege escalation (D1) — a declared value, not an opaque flag string.
      become:
        enabled: true
        method: sudo
        user: root
      # HOW to reach the targets (ADR-0126 D1). The key path is DERIVED from the
      # credentialRef above — the one this Step is authorized to use — instead of being a
      # literal that nothing kept in agreement with it (§2.4). ansible_host still comes from
      # each target's mgmt.address; the shim renders both.
      connection:
        user: appops
        credentialRef: app-node-ssh
        # This demo's node is created fresh per run, so its host key is new every time and
        # accept-new (the default) is exactly right: first contact is accepted, a CHANGED
        # key is refused. It replaces `StrictHostKeyChecking=no` plus a /dev/null
        # known-hosts, which together meant nothing was ever verified or remembered.
        hostKeyChecking: accept-new
      extraVars:
        # APP CONFIG comes from the launch inputs, which the route filled from the Intent
        # (ADR-0118 D3). This mapping — Stratt input to Ansible variable name — is declared
        # explicitly because core never parses play content to infer what it needs (D6).
        app_common_name: "{{.launch.commonName}}"
        app_tls_port: "{{.launch.tlsPort}}"
      # The play is a PLAYBOOK, in the project the ansible-crypto Actuator declares
      # (ADR-0134 D2): demos/app-cert/estate/ansible/projects/app-cert/install-with-cert.yml.
      # It is 90 lines of Ansible that ansible-lint and --syntax-check can now read, and
      # this file is back to being a declaration of what runs where.
      playbook: install-with-cert.yml
