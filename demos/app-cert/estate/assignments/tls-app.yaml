# Binds the Intent to the target set through the Blueprint — the three-part join that makes
# an outcome apply to actual machines: WHAT (Intent), WHERE (View), HOW-IT-IS-JUDGED
# (Blueprint@version, pinned so a Blueprint revision cannot silently change what a live
# Assignment means).
name: tls-app
# `intent: name@N` pins WHICH configuration version this environment runs (ADR-0119 D2) —
# required, exactly as `blueprint: name@N` is, so an environment's identity is stated in its own
# Assignment rather than implied. Editing another version cannot change what this one means.
intent: tls-app@1
view: app-nodes
blueprint: tls-app@1
environments: [dev]
