# web-cert — LEG 4: declare a certificate (ADR-0030, ADR-0106, ADR-0150).
#
# `issuer` names a CLM ROLE and never a provider: nothing here says OpenBao, which is what lets a
# step-ca implementation of the `certissuer` capability serve this same document unchanged (§1.5,
# ADR-0106 D1).
#
# THE SUBJECT IS DERIVED FROM THE HOST, not authored per certificate (ADR-0150 D1). This one
# declaration covers every member of the Assignment's View: build a host, it gets a certificate.
# That is the whole point — a 200-host tier is this file, not 200 of them. `mgmt.address` rather
# than `dns.fqdn` because that is the fact this floor actually projects, and on it the reachable
# address IS the host's FQDN; a production estate with a DNS Syncer writes `{{.entity.dns.fqdn}}`
# and the declaration shape is identical. A host missing the named Facet is REFUSED at launch, by
# name, rather than issued a certificate for a guessed subject (D2).
#
# `renewBefore` is the load-bearing one, and it is why this is an Intent rather than a cron line: it
# is BOTH the window the Blueprint's observe expectation checks against AND the value the issuance
# Run is launched with. One declaration, so the check and the fix cannot disagree about when a
# certificate is too close to expiry.
name: web-cert
kind: Intent/Certificate
spec:
  issuer: stratt-dev
  commonName: "{{.entity.mgmt.address.address}}"
  validity: 720h
  renewBefore: 168h
