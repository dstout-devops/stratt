# prod — DECLARED HERE BECAUSE AN ADMITTED PLUGIN NAMES IT, and for no other reason. Nothing in
# this demo reconciles in prod; the daemon boots with STRATT_ENVIRONMENT=dev.
#
# ── THE COUPLING THIS FILE IS EVIDENCE OF ─────────────────────────────────────────────────────────
# The ansible plugin's own estate ships two scheduled collectors — `access-collector` and
# `fileset-collector` — tagged `environments: [prod]`, and one Trigger naming an environment the
# adopting estate has not declared is a hard load error, correctly:
#
#	trigger "access-collector": environments references "prod", which no environments/ declaration
#	defines (declared: dev). An unknown environment is not a no-op — it filters this declaration out
#	of EVERY environment, silently and permanently (§1.8, ADR-0142 D2)
#
# That check is right and should not be softened: silently dropping a Trigger whose environment is a
# typo is exactly the failure it was written to stop. What is WRONG is upstream of it — those
# Triggers are the REFERENCE ESTATE's compositions living in the PLUGIN's tree. They name `prod`,
# and they name `secure-hosts` and `web-hosts`, which are Views the reference estate happens to
# declare. ADR-0137 D1 says a plugin owns its Actuator, Workflows, Triggers and content; it does not
# license a plugin to presume its adopter's environments and View names. The practical consequence
# is that `plugins/ansible/estate` is not admittable by an estate that does not first mirror those
# four names — which is the opposite of what admission is for, and it is why demos/app-cert admits
# ansible `contractsOnly` with the note that "admitting the estate imports ansible's own Workflows,
# which target Views this demo does not declare".
#
# NOT FIXED HERE. The fix is to move those estate-shaped declarations out of the plugin tree, which
# changes what the reference estate's Assignments bind to — a real change with its own review, not
# something to improvise inside a demo. Booked as a follow-up; this file and views/plugin-owned.yaml
# beside it are the honest cost of admitting a plugin estate today, written down rather than
# smoothed over.
name: prod
description: >
  Declared only to satisfy the prod-scoped Triggers the admitted ansible plugin estate ships.
  Nothing in this demo runs here.
