# The reach credential for an OBSERVED kubectl transport (§2.5, ADR-0156 D4).
#
# THE HALF ADR-0156 MISSED. Its transport table records what each method needs IN THE GUEST, and for
# kubectl the honest answer is "nothing" — no sshd, no agent, no account. What the table had no
# column for is the CONTROL NODE, and kubectl needs a credential there like everything else: the
# execution pod is spawned with `AutomountServiceAccountToken: false` — "the pod has no cluster
# identity" (dispatch.go) — so `kubectl exec` has nothing to authenticate to the API server with.
#
# That property is deliberate and worth keeping. An execution pod runs arbitrary automation content;
# handing it an ambient token that can exec into any pod in the cluster would make every Run a
# lateral-movement primitive. So the authority arrives the way every other credential does — a
# named CredentialRef the Step is use-granted, resolved to a file at pod spawn, never in the graph
# and never in an artifact.
#
# POINTER only: the locator names the Kubernetes Secret holding the kubeconfig; the material never
# appears here. The shim renders its MOUNT PATH as `ansible_kubectl_kubeconfig`.
#
# SCOPE IT NARROWLY. The whole grant this needs is `create pods/exec` in the namespace the built
# hosts live in — not cluster-admin, not a namespace-wide edit role. `task dev:kubecompute:up`
# mints exactly that on the dev floor and nothing wider; a production estate should do the same. A
# kubeconfig is a bearer credential, so the blast radius of this file IS whatever the token behind
# it can reach.
name: hosts-kubeconfig
ownerTeam: platform-admins
backend: k8s-secret
locator: { namespace: stratt, name: hosts-kubeconfig-creds }
injection:
  - { key: kubeconfig, as: file, name: kubeconfig }
