# What the estate does about a link-flap STORM (ADR-0162).
#
# Nothing about this play is special, and that is the point: the pattern-matching that decided a
# storm had happened is the Trigger's business, and by the time anything runs here the decision is
# already made. The play is ordinary remediation.
#
# It installs a distinct blackhole route so the DEMO can ask the device whether remediation happened
# — a marker the run.sh assertion reads back over vtysh rather than trusting the Run's own report.
- name: Remediate a flapping link
  hosts: all
  gather_facts: false
  tasks:
    # The marker is DECLARED by the Step, not baked here, because two Workflows use this play and
    # each needs its own evidence: 10.97.0.0/24 for the flap storm, 10.96.0.0/24 for the NMS batch.
    # (10.99.0.0/24 is rtr-configure's change and 10.98.0.0/24 is the prefix the refused-EE guard
    # proves never reaches the device.) A shared marker would let one assertion pass on another's.
    - name: Install the remediation marker route on the device
      ansible.netcommon.cli_config:
        config: |
          ip route {{ marker_route }} blackhole
      register: push

    - name: Report
      ansible.builtin.debug:
        msg: "remediation applied for {{ marker_route }}; changed={{ push.changed }}"
