# Demo authz (ADR-0116) — the LEAN bootstrap grant for the vsphere-only demo floor, loaded from the
# staged declarations at boot (LoadTuples). The one self-retiring dev-header bootstrap-admin Principal
# gets exactly the two grants it needs to drive the gated build, and nothing else. Deny-by-default holds;
# the floor is self-retiring (the boot guard forbids the dev header alongside OIDC — charter §1.3).
tuples:
  # Approve the §5 Flow-1 gate fronting vsphere-vm-build (vcenter/create-vm mutates vSphere, gated on
  # team:platform-admins).
  - { user: principal:bootstrap-admin, relation: member, object: team:platform-admins }
  # Use the vcenter/create-vm Action's authz-gate CredentialRef (§2.5 use-check).
  - { user: principal:bootstrap-admin, relation: user, object: credential_ref:vsphere-dev }
