# helm — the Helm Actuator (charter §2.3, ADR-0092) as a runtime-registered Actuator Kind
# (ADR-0103): dialed + registered by the connectorregistry (RunActuators, every replica, on a
# cadence — no strattd restart) once this declaration lands in the store. Dual-surface — the
# per-target Actuator (Plan/Apply across a View) + the TARGETLESS helm/deploy Action this demo's
# deploy-hello Workflow invokes. Address is the in-cluster helm plugin Service (values-selfdeploy).
#
# Actuators are CaC-only (charter §2.2/§2.3 — Git review authorizes plugin registration; the
# imperative apply door cannot register one), so the demo delivers its whole estate through the
# declarations mount the reconcile controller enforces, NOT `stratt apply`.
name: helm
address: stratt-helm:9090
pluginIdentity: helm
tier: trusted
dryRunnable: true
actionNames: [helm/deploy]
