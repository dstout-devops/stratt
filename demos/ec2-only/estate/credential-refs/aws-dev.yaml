# aws-dev — the gate-only CredentialRef the awsec2/create-vm Action binds (§2.5 / ADR-0009). An Action's
# CredentialRef use-check is its ONLY authz gate (ExecuteAction refuses a credential-free Action,
# "ActionUngated"), so even a floci build must carry one. The awsec2 plugin authenticates to the EC2 API
# with its OWN ambient config (env, against floci), so no material is resolved through this ref — it is a
# DELIBERATE gate-only ref (gateOnly, ADR-0052): the launching Principal's use-check is the point. The
# demo authz grants bootstrap-admin `user` of it. (The reference estate's aws-dev brokers a real Secret;
# the demo needs none against floci.)
name: aws-dev
ownerTeam: platform-admins
backend: k8s-secret
gateOnly: true
locator: { namespace: stratt, name: aws-dev-authz }
