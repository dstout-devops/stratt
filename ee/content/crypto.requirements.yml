# Ansible content for the `ansible-crypto` EE variant (ADR-0117 D3, D3a).
#
# This is a REAL Galaxy requirements.yml — the same file `ansible-galaxy install -r` and
# `ansible-builder` consume. Stratt invents no content format (§1.1), and
# ansible-builder EE compatibility is a charter §3 commitment, so an
# ansible-builder-produced EE stays a drop-in replacement for this hand-built one.
#
# Every entry MUST carry an exact version. `ee/content.py verify` fails the build (and
# `task ci`) on a range, a moving ref, or the unpinned `- ns.name` shorthand: content
# that resolves differently on different days makes the image digest a lie about what
# content a Run actually had, which is the whole thing D3 exists to prevent.
#
# EDITING THIS FILE MEANS RELOCKING IT. A version bounds which version is requested; the
# lockfile beside it — crypto.requirements.lock.json — bounds which BYTES are accepted, for
# this file's artifacts AND for anything ansible-galaxy pulls in transitively (follow-up i).
# `task ee:content:lock CONTENT=crypto.requirements.yml` regenerates it from a real install;
# `task ci` fails if a declared version has no matching lock entry, and the EE build fails on
# any content-hash mismatch. Review the lockfile diff: an unexplained hash change on an
# unchanged version is the supply-chain event this exists to catch.
#
# A Step selects this content by selecting an Actuator declared with this EE image
# (estate/actuators/ansible-crypto.yaml) — never by a run-time params field.

collections:
  # community.crypto — openssl_privatekey / openssl_csr / x509_certificate. The
  # certificate demo's hard dependency, and the reason this variant exists.
  - name: community.crypto
    version: "2.22.3"

  # kubernetes.core — NOT for its modules, but for its `kubectl` CONNECTION plugin (ADR-0156).
  #
  # THIS IS THE UNION RULE MEETING REALITY. The transport is a property of the TARGET, observed by
  # the provider that built it; the EE image is per Actuator, and therefore per Run. So an image
  # must carry every transport ITS targets use — and this variant's Actuator converges hosts that
  # kubecompute built, which observe `kubectl`. Without this entry the shim refuses the run before
  # the play starts (D6), correctly and uselessly.
  #
  # The `kubectl` BINARY comes with it, as a build arg on dev:ee-crypto:build: the connection plugin
  # execs it, so the collection alone is not enough — the second axis ADR-0153 D7 did not have.
  - name: kubernetes.core
    version: "6.5.0"

  # ── THE PLATFORM FLOOR, repeated ─────────────────────────────────────────────────────
  # Everything below is ee/content/platform.requirements.yml, copied at the same versions.
  # `ee/content.py verify` (so `task ci`) fails if a variant drops or re-pins a floor entry.
  #
  # Repeated rather than composed because `install` refuses two requirements files per image:
  # a lockfile records the installed CLOSURE, and a closure cannot be attributed to one of
  # several declarations. The cost of that rule is this duplication; the check is what stops
  # it rotting. See platform.requirements.yml for why a floor exists at all (ANS-012).
  #
  # WHY IT MATTERS HERE SPECIFICALLY: this variant is selected by a Step that wants openssl
  # modules. Without the floor it would ALSO, silently, be a Step that can no longer install a
  # package on Alpine — a strictly weaker environment that looks identical from the estate.
  - name: community.general
    version: "13.2.0"

# roles: — supported and installed identically (ADR-0117 D3 put roles in scope after the
# first revision omitted them), but deliberately EMPTY: nothing shipping demands a Galaxy
# role yet, and pinning content no Contract needs would be inventory to maintain for no
# consumer. The install path handles both sections and is tested; add entries here as
# `- { name: ns.role, version: "x.y.z" }` when a shipping Workflow needs one.
roles: []
