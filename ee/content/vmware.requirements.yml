# Ansible content for the `ansible-vmware` EE variant (ADR-0117 D3, ADR-0156).
#
# WHY THIS VARIANT EXISTS. ADR-0156 made the connection method a property of the SUBSTRATE, and
# vSphere's is the most interesting of the three: `community.vmware.vmware_tools` executes guest
# operations THROUGH THE vCENTER API, so it needs NO NETWORK PATH TO THE GUEST AT ALL. A VM on an
# isolated segment — no route, no bastion, no jump host — becomes convergeable. That is a case the
# SSH path can only answer with a ProxyJump chain somebody has to build and keep working.
#
# The vcenter Syncer observes this transport only for a VM whose VMware Tools are actually RUNNING
# (guest.toolsRunningStatus), because claiming it for every VM would be computing a reach fact from
# the substrate rather than observing one — the thing ADR-0142 D4 forbids in those words.
#
# NO BINARY, unlike the kube variant: the connection plugin is a Python library (it needs
# `requests`, which the image already has), not an exec. The shim's D6 gate checks both axes and
# asks for nothing here.
#
# HONEST STATUS: this variant is built and locked, and the transport is NOT LIVE-PROVEN. vspheresim
# implements the vCenter API but not VMware Tools guest operations, so proving it needs a real
# vCenter with a real Tools-running guest. Unlike the kubectl transport — which was proven on kind
# against a pod with no sshd in it — this one has been exercised only in unit tests.
#
# EDITING THIS FILE MEANS RELOCKING IT:
#     task ee:content:lock CONTENT=vmware.requirements.yml

collections:
  # community.vmware — the `vmware_tools` CONNECTION plugin (plus the vSphere modules a play may
  # use). This is what makes ADR-0156's vmware_tools transport more than a Facet value.
  - name: community.vmware
    version: "6.2.1"

  # ── THE PLATFORM FLOOR, repeated ─────────────────────────────────────────────────────
  # Everything below is ee/content/platform.requirements.yml, copied at the same versions.
  # `ee/content.py verify` (so `task ci`) fails if a variant drops or re-pins a floor entry:
  # a variant ADDS capability and never subtracts it.

  # community.general — the other half of `ansible.builtin.package` and
  # `ansible.builtin.package_facts`. Both dispatch on the target's package manager, and both fall
  # outside ansible-core the moment the target is not apt- or yum-based. Without this the platform
  # cannot install a package on Alpine, SUSE, Arch or FreeBSD at all, which makes "install the
  # application" a claim that holds only on the distros nobody checked.
  #
  # Pinned at the current release (2026-07-13), which requires ansible-core >= 2.18 against the
  # image's >= 2.19 band (ee/Dockerfile) — evergreen §1.7 wants the current line, and content is
  # pinned exactly because reproducibility of what a Run executed is what ADR-0117 D3 buys.
  - name: community.general
    version: "13.2.0"

# roles: — installed identically and deliberately EMPTY, for the same reason crypto's is: pinning
# content no shipping Contract demands is inventory to maintain for no consumer.
roles: []
